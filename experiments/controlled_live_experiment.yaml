id: live-prompt-controlled-2026-01-24
description: "Low-frequency controlled live prompt experiment"
agent_id: prediction-arbitrage-analyst
runs_per_variant: 1

# Conservative filters for controlled experiment
filters:
  min_spread: 0.08  # Higher threshold for quality
  min_liquidity: 100000.0  # Higher liquidity requirement
  categories: ["crypto"]  # Single category for focus
  max_opportunities: 5  # Limit opportunities for faster processing

variants:
  - name: baseline-prompt
    description: "Current baseline prompt for comparison"
  - name: focused-prompt
    description: "More focused prompt emphasizing liquidity and venue diversity"

# Experiment configuration
experiment_config:
  frequency_hours: 6  # Run every 6 hours
  max_duration_minutes: 15  # Abort if takes longer than 15 minutes
  llm_timeout: 25  # Shorter LLM timeout
  max_retries: 1  # Fewer retries for faster failure
  degraded_mode_enabled: true  # Allow degraded mode on timeout
