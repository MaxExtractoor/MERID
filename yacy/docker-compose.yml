version: '3.9'
services:
  yacy:
    image: yacy/yacy_search_server:latest
    container_name: yacy
    ports:
      - "8090:8090"
      - "8443:8443"
    volumes:
      - yacy-data:/opt/yacy_search_server/DATA
      - yacy-config:/opt/yacy_search_server/defaults  # For advanced config persistence
    environment:
      - YACY_ADMIN_PASSWORD=merid_yacy_admin_2026  # Change this!
      - YACY_HEAP_SIZE=2048m  # Increase memory for larger indexing
      - YACY_PEER_NAME=MERID_Peer  # Set peer name for P2P network
      - YACY_PEER_PORT=8090
    restart: unless-stopped

volumes:
  yacy-data:
  yacy-config:
