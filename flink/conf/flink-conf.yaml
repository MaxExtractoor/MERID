# =============================================================================
# MERID Flink Configuration
#
# Optimized for trading stream processing with:
# - Prometheus metrics export
# - RocksDB state backend
# - Exactly-once checkpointing
# =============================================================================

# =============================================================================
# JOB MANAGER
# =============================================================================
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123
jobmanager.bind-host: 0.0.0.0
jobmanager.memory.process.size: 1600m

# =============================================================================
# TASK MANAGER
# =============================================================================
taskmanager.bind-host: 0.0.0.0
taskmanager.host: taskmanager
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 4

# Parallelism - align with Kafka partition count
parallelism.default: 2

# =============================================================================
# STATE BACKEND (RocksDB for large state)
# =============================================================================
state.backend: rocksdb
state.backend.rocksdb.localdir: /tmp/flink-rocksdb
state.checkpoints.dir: file:///opt/flink/checkpoints
state.savepoints.dir: file:///opt/flink/savepoints

# Incremental checkpoints for faster recovery
state.backend.incremental: true

# =============================================================================
# CHECKPOINTING
# =============================================================================
execution.checkpointing.interval: 60000
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.timeout: 600000
execution.checkpointing.min-pause: 30000
execution.checkpointing.max-concurrent-checkpoints: 1

# Unaligned checkpoints for lower latency during backpressure
execution.checkpointing.unaligned: true

# =============================================================================
# RESTART STRATEGY
# =============================================================================
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 3
restart-strategy.fixed-delay.delay: 10s

# =============================================================================
# NETWORK
# =============================================================================
taskmanager.network.memory.fraction: 0.1
taskmanager.network.memory.min: 64mb
taskmanager.network.memory.max: 1gb

# =============================================================================
# WEB UI
# =============================================================================
rest.port: 8081
rest.address: 0.0.0.0
rest.bind-address: 0.0.0.0
web.submit.enable: true

# =============================================================================
# PROMETHEUS METRICS
# =============================================================================
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249

# Additional metric reporters (optional)
# metrics.reporter.slf4j.factory.class: org.apache.flink.metrics.slf4j.Slf4jReporterFactory
# metrics.reporter.slf4j.interval: 60 SECONDS

# Metric scopes for better organization
metrics.scope.jm: <host>.jobmanager
metrics.scope.jm.job: <host>.jobmanager.<job_name>
metrics.scope.tm: <host>.taskmanager.<tm_id>
metrics.scope.tm.job: <host>.taskmanager.<tm_id>.<job_name>
metrics.scope.task: <host>.taskmanager.<tm_id>.<job_name>.<task_name>.<subtask_index>
metrics.scope.operator: <host>.taskmanager.<tm_id>.<job_name>.<operator_name>.<subtask_index>

# =============================================================================
# KAFKA CONNECTOR DEFAULTS
# =============================================================================
# These can be overridden per-connector in SQL/DataStream API

# Consumer settings
kafka.partition-discovery.interval-millis: 10000

# =============================================================================
# TRANSACTION TIMEOUTS (aligned with Redpanda)
# =============================================================================
# CRITICAL: These must be aligned with broker settings to prevent
# transaction expiry during checkpoints or recovery.
#
# Redpanda broker: transaction.max.timeout.ms = 900000 (15min)
# Flink producer: transaction.timeout.ms = 600000 (10min)
# Flink checkpoint timeout = 600000 (10min)

# Default Kafka producer transaction timeout for exactly-once sinks
# Must be < broker's transaction.max.timeout.ms
kafka.producer.transaction-timeout: 600000

# =============================================================================
# TABLE / SQL
# =============================================================================
table.exec.state.ttl: 86400000
table.exec.mini-batch.enabled: true
table.exec.mini-batch.allow-latency: 5s
table.exec.mini-batch.size: 5000

# =============================================================================
# WATERMARKS
# =============================================================================
pipeline.auto-watermark-interval: 200ms

# =============================================================================
# LOGGING
# =============================================================================
env.log.dir: /opt/flink/log
env.log.max: 5
