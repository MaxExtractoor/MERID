<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meridGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="320" height="80" rx="10" fill="#0a0a0a" stroke="#00ffcc"/>

  <text x="20" y="52"
        font-family="Consolas, monospace"
        font-size="36"
        fill="url(#meridGlow)"
        filter="url(#glow)">
    MERID
  </text>

  <text x="185" y="52"
        font-family="Consolas, monospace"
        font-size="14"
        fill="#7fffd4">
    SOVEREIGN CORE
  </text>
</svg>
