<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MERID Sovereign Interface</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  background:#0b0b0b;
  color:#e5e5e5;
  font-family:Consolas, monospace;
  margin:0;
  padding:20px;
}
.panel {
  border:1px solid #333;
  border-radius:6px;
  padding:12px;
  margin-bottom:14px;
}
h2 { margin-top:0 }
button {
  padding:6px 10px;
  cursor:pointer;
}
.lock { background:#900;color:white;border:none }
.bus {
  background:#222;height:14px;border-radius:7px;overflow:hidden
}
.bus-fill {
  height:100%;width:0%;background:lime;transition:width .4s
}
.output, .log {
  background:black;border:1px solid #444;padding:10px
}
.log {
  max-height:160px;
  overflow:auto;
  font-size:12px;
  color:#0f0;
}
.chat {
  display:flex;
  gap:6px;
}
input {
  flex:1;
  background:black;
  color:#0f0;
  border:1px solid #555;
  padding:6px;
}
footer {
  position:fixed;
  bottom:0;left:0;right:0;
  background:black;
  border-top:1px solid #333;
  padding:6px;
  display:flex;
  justify-content:space-around;
}
.green{color:lime}
.red{color:red}
.orange{color:orange}
</style>
</head>

<body>

<img src="merid-logo.svg" style="max-width:320px;margin-bottom:12px"/>

<div class="panel">
  <strong>System State:</strong>
  <span id="state" class="red">OFFLINE</span>
</div>

<div class="panel">
  <h2>Integrity Bus</h2>
  <input id="integritySlider" type="range" min="0" max="100" value="50"/>
  <div class="bus"><div id="busFill" class="bus-fill"></div></div>
</div>

<div class="panel">
  <h2>AI Cognition</h2>
  <div class="chat">
    <input id="prompt" placeholder="Issue directive..." />
    <button onclick="sendPrompt()">Send</button>
  </div>
  <div id="aiOutput" class="output">Awaiting input…</div>
</div>

<div class="panel">
  <h2>Agent Consensus</h2>
  <button onclick="runConsensus()">Run Consensus</button>
  <div id="consensus" class="output">No vote executed</div>
</div>

<div class="panel">
  <h2>Telemetry / Raw Cognition</h2>
  <button onclick="toggleRaw()">Toggle RAW</button>
  <div id="raw" class="log" style="display:none"></div>
</div>

<div class="panel">
  <button class="lock" onclick="lockdown()">LOCKDOWN</button>
</div>

<footer>
  <span>API: <span id="api" class="red">DOWN</span></span>
  <span>Integrity: <span id="ival">50</span></span>
</footer>

<script>
const API="http://localhost:4000"
let integrity=50
let rawVisible=false
let state="OFFLINE"

const slider=document.getElementById("integritySlider")
const bus=document.getElementById("busFill")
const raw=document.getElementById("raw")

slider.oninput=()=>{integrity=slider.value;updateIntegrity()}

function updateIntegrity(){
  document.getElementById("ival").textContent=integrity
  bus.style.width=integrity+"%"
  bus.style.background=integrity>70?"lime":integrity>30?"orange":"red"
}

async function checkHealth(){
  try{
    const r=await fetch(API+"/health")
    if(!r.ok) throw 0
    document.getElementById("api").textContent="UP"
    document.getElementById("api").className="green"
    setState("NOMINAL")
  }catch{
    setState("OFFLINE")
  }
}

function setState(s){
  state=s
  const el=document.getElementById("state")
  el.textContent=s
  el.className=s==="NOMINAL"?"green":s==="DEGRADED"?"orange":"red"
}

function log(msg){
  raw.textContent+=[] \n
  raw.scrollTop=raw.scrollHeight
}

function toggleRaw(){
  rawVisible=!rawVisible
  raw.style.display=rawVisible?"block":"none"
}

async function sendPrompt(){
  const p=document.getElementById("prompt").value
  if(!p) return
  document.getElementById("aiOutput").textContent="Processing…"
  log("AI prompt issued: "+p)

  try{
    const r=await fetch(API+"/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p})})
    const d=await r.json()
    document.getElementById("aiOutput").textContent=d.reply||"No response"
  }catch{
    document.getElementById("aiOutput").textContent="AI endpoint offline — simulated response issued."
    log("Fallback cognition used")
  }
}

function runConsensus(){
  log("Agents voting…")
  setTimeout(()=>{
    integrity=Math.min(100,integrity+10)
    slider.value=integrity
    updateIntegrity()
    document.getElementById("consensus").textContent="Consensus reached — integrity increased"
    log("Consensus reached")
  },800)
}

function lockdown(){
  integrity=0
  slider.value=0
  updateIntegrity()
  setState("LOCKDOWN")
  document.body.style.background="#300"
  log("SYSTEM LOCKDOWN — HUMAN OVERRIDE")
}

updateIntegrity()
checkHealth()
setInterval(checkHealth,3000)
</script>
</body>
</html>
