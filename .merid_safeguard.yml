{
  "version": "1.0",
  "description": "Swarm Integrity and Data Authenticity Enforcement",
  "enforcement": {
    "require_full_health": true,
    "require_sync": true,
    "min_health_pct": 100.0,
    "allowed_data_sources": [
      "verified_backend",
      "deterministic_fixture"
    ]
  },
  "reporting": {
    "required_mode_tags": [
      "mock",
      "paper",
      "live"
    ],
    "unverified_data_message": "⚠️ Data unverified — check source or mode (mock/paper/live)."
  },
  "pytest": {
    "integration_markers": [
      "integration",
      "e2e",
      "prod_integration",
      "contract"
    ],
    "enforce_env_var": "MERID_SWARM_INTEGRITY_ENFORCE",
    "snapshot_env_var": "MERID_SWARM_HEALTH_SNAPSHOT"
  }
}
