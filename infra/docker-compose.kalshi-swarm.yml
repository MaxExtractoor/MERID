version: "3.9"

services:
  # NATS event bus for inter-service communication
  event-bus:
    image: bitnami/nats:2.10
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"  # HTTP monitoring
    volumes:
      - nats-data:/bitnami/nats/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Python Kalshi WebSocket bridge (handles auth + routing)
  kalshi-ws-bridge:
    build:
      context: ..
      dockerfile: infra/Dockerfile.kalshi-bridge
    environment:
      KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID}
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi_private_key
      KALSHI_ENV: ${KALSHI_ENV:-demo}  # demo or prod
      EVENT_BUS_URL: nats://event-bus:4222
      MARKETS: ${KALSHI_MARKETS:-KXHARRIS24-LSV,BTC-15M,ETH-15M}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - kalshi_private_key
    depends_on:
      event-bus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # TypeScript swarm agents (market analysis, trading, risk)
  swarm-agents:
    build:
      context: ..
      dockerfile: infra/Dockerfile.swarm-agents
    environment:
      EVENT_BUS_URL: nats://event-bus:4222
      NODE_ENV: production
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      KALSHI_MODE: ${KALSHI_MODE:-paper}
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-100}
      MAX_DAILY_LOSS: ${MAX_DAILY_LOSS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      event-bus:
        condition: service_healthy
      kalshi-ws-bridge:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: ${SWARM_AGENT_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Python MERID API (existing FastAPI backend)
  merid-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      EVENT_BUS_URL: nats://event-bus:4222
      KALSHI_MODE: ${KALSHI_MODE:-paper}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./merid.db}
      ENABLE_SWARM_MODE: ${ENABLE_SWARM_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      event-bus:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - merid-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # React UI dashboard
  ui:
    build:
      context: ../web/react
      dockerfile: ../../infra/Dockerfile.ui
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      NODE_ENV: production
    depends_on:
      merid-api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

secrets:
  kalshi_private_key:
    file: ${KALSHI_PRIVATE_KEY_FILE:-./secrets/kalshi_private_key.pem}

volumes:
  nats-data:
  merid-data:
  redis-data:

networks:
  default:
    driver: bridge
