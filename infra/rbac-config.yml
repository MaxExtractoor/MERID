# MERID RBAC Configuration
# Gate 1: Infrastructure Security - Evidence Artifact
# Date: 2026-01-26

version: "3.8"

services:
  merid-api:
    image: merid:latest
    user: "1000:1000"  # Non-root user
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/run:noexec,nosuid,size=100m
    volumes:
      - ./certs:/certs:ro
      - ./logs:/logs:rw
    environment:
      - NEO4J_USER=merid_app
      - NEO4J_PASSWORD=${NEO4J_APP_PASSWORD}
      - REDIS_USER=merid_app
      - REDIS_PASSWORD=${REDIS_APP_PASSWORD}

  neo4j:
    image: neo4j:5.27-community
    user: "999:999"  # Neo4j non-root user
    environment:
      # Disable default admin account
      - NEO4J_AUTH=disabled
      # Create least-privilege app user
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_allowlist=apoc.*
      # Network restrictions
      - NEO4J_dbms_connector_bolt_advertised__address=neo4j:7687
      - NEO4J_dbms_connector_http_advertised__address=neo4j:7474
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./certs:/certs:ro
    command: >
      sh -c "
        # Create app user with minimal privileges
        cypher-shell -u neo4j -p ${NEO4J_ADMIN_PASSWORD} \"
        CREATE USER merid_app IF NOT EXISTS 
        SET PASSWORD '${NEO4J_APP_PASSWORD}' 
        CHANGE NOT REQUIRED;
        
        GRANT ROLE reader TO merid_app;
        GRANT ACCESS ON DATABASE neo4j TO merid_app;
        GRANT READ ON LABEL * TO merid_app;
        GRANT CREATE ON GRAPH * TO merid_app;
        \"
        && exec neo4j
      "

  redis:
    image: redis:7.2-alpine
    user: "999:999"  # Redis non-root user
    command: >
      sh -c "
        # Create Redis config with ACL
        cat > /usr/local/etc/redis/redis.conf << EOF
        port 6380
        bind 0.0.0.0
        protected-mode yes
        requirepass ${REDIS_ADMIN_PASSWORD}
        
        # ACL configuration
        acl-pubsub-default allchannels
        acl-log-max-len 128
        
        # Security settings
        tls-cert-file /certs/redis.crt
        tls-key-file /certs/redis.key
        tls-ca-cert-file /certs/ca.crt
        tls-port 6380
        port 0
        
        # Memory limits
        maxmemory 512mb
        maxmemory-policy allkeys-lru
        
        # Logging
        loglevel notice
        syslog-enabled yes
        EOF
        
        # Create ACL rules
        redis-cli --tls --cert /certs/redis.crt --key /certs/redis.key --cacert /certs/ca.crt \
          -a ${REDIS_ADMIN_PASSWORD} ACL SETUSER merid_app on >${REDIS_APP_PASSWORD} \
          ~* +@read +@write +@admin -@dangerous +@fast
        
        exec redis-server /usr/local/etc/redis/redis.conf
      "
    volumes:
      - redis_data:/data
      - ./certs:/certs:ro

# Kubernetes RBAC (for future deployment)
apiVersion: rbac.authorization.k8s.io/v1
kind: Namespace
metadata:
  name: merid-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ServiceAccount
metadata:
  name: merid-service-account
  namespace: merid-prod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: merid-prod
  name: merid-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: merid-role-binding
  namespace: merid-prod
subjects:
- kind: ServiceAccount
  name: merid-service-account
  namespace: merid-prod
roleRef:
  kind: Role
  name: merid-role
  apiGroup: rbac.authorization.k8s.io

# Docker Compose Security Policies
# These policies enforce least-privilege access

# 1. Network Policies
networks:
  merid-internal:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.21.0.0/16
  
  merid-external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

# 2. Volume Security
volumes:
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/neo4j
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/redis

# 3. Resource Limits
deploy:
  resources:
    limits:
      cpus: '2.0'
      memory: 4G
    reservations:
      cpus: '0.5'
      memory: 1G

# Environment Variables Required
# NEO4J_ADMIN_PASSWORD - Neo4j admin password
# NEO4J_APP_PASSWORD - Neo4j app user password
# REDIS_ADMIN_PASSWORD - Redis admin password
# REDIS_APP_PASSWORD - Redis app user password
