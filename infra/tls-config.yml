# MERID TLS Configuration
# Gate 1: Infrastructure Security - Evidence Artifact
# Date: 2026-01-26

version: "3.8"

services:
  merid-api:
    image: merid:latest
    ports:
      - "8000:8443"  # HTTPS port
      - "8001:8444"  # Alternative HTTPS port
    volumes:
      - ./certs:/certs:ro
    environment:
      - TLS_ENABLED=true
      - TLS_CERT_PATH=/certs/server.crt
      - TLS_KEY_PATH=/certs/server.key
      - TLS_CA_PATH=/certs/ca.crt
    command: >
      sh -c "
        if [ ! -f /certs/server.crt ]; then
          echo 'Generating self-signed certificate...';
          openssl req -x509 -newkey rsa:4096 -keyout /certs/server.key -out /certs/server.crt -days 365 -nodes \
            -subj '/C=US/ST=CA/L=San Francisco/O=MERID/CN=localhost';
        fi;
        exec uvicorn merid_api:app --host 0.0.0.0 --port 8443 --ssl-keyfile=/certs/server.key --ssl-certfile=/certs/server.crt
      "

  neo4j:
    image: neo4j:5.27-community
    ports:
      - "7474:7473"  # HTTPS
      - "7687:7687"  # Bolt with TLS
    volumes:
      - ./certs:/certs:ro
      - neo4j_data:/data
    environment:
      - NEO4J_dbms_ssl_policy__enabled=true
      - NEO4J_dbms_ssl_policy__client_auth=NONE
      - NEO4J_dbms_connector_bolt_advertised__address=neo4j:7687
      - NEO4J_dbms_ssl_policy__private_key=/certs/neo4j.key
      - NEO4J_dbms_ssl_policy__public_certificate=/certs/neo4j.crt
    command: >
      sh -c "
        if [ ! -f /certs/neo4j.crt ]; then
          echo 'Generating Neo4j certificate...';
          openssl req -x509 -newkey rsa:2048 -keyout /certs/neo4j.key -out /certs/neo4j.crt -days 365 -nodes \
            -subj '/C=US/ST=CA/L=San Francisco/O=MERID/CN=neo4j';
        fi;
        exec neo4j
      "

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6380"  # TLS port
    volumes:
      - ./certs:/certs:ro
      - redis_data:/data
    command: >
      sh -c "
        if [ ! -f /certs/redis.crt ]; then
          echo 'Generating Redis certificate...';
          openssl req -x509 -newkey rsa:2048 -keyout /certs/redis.key -out /certs/redis.crt -days 365 -nodes \
            -subj '/C=US/ST=CA/L=San Francisco/O=MERID/CN=redis';
        fi;
        exec redis-server --port 6380 --tls-port 6380 --tls-cert-file /certs/redis.crt --tls-key-file /certs/redis.key --tls-ca-cert-file /certs/ca.crt
      "

volumes:
  neo4j_data:
  redis_data:

# Certificate Generation Script (for reference)
#!/bin/bash
# generate-certs.sh
mkdir -p certs

# Generate CA
openssl genrsa -out certs/ca.key 4096
openssl req -new -x509 -key certs/ca.key -out certs/ca.crt -days 365 -nodes \
  -subj '/C=US/ST=CA/L=San Francisco/O=MERID/CN=MERID-CA'

# Generate server certificates
for service in merid neo4j redis; do
  openssl genrsa -out certs/${service}.key 2048
  openssl req -new -key certs/${service}.key -out certs/${service}.csr -nodes \
    -subj "/C=US/ST=CA/L=San Francisco/O=MERID/CN=${service}"
  openssl x509 -req -in certs/${service}.csr -CA certs/ca.crt -CAkey certs/ca.key \
    -CAcreateserial -out certs/${service}.crt -days 365
done

echo "TLS certificates generated successfully"
