repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff - lint and auto-fix
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff-format - format code

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        name: mypy - static type checking
        additional_dependencies: [types-all]
        args: [--strict, --ignore-missing-imports]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: bandit - security vulnerability scanner
        args: [-r, src/, -f, json]
        exclude: ^tests/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        name: codespell - check for typos
        args: [--write-changes]

  - repo: local
    hooks:
      - id: merid-sanity
        name: MERID sanity check (smoke tests + demo)
        entry: python scripts/sanity_check.py
        language: system
        pass_filenames: false
        stages: [pre-push]  # Run on push, not every commit (takes ~30s)
      - id: merid-tier2-coverage
        name: MERID Tier 2 per-module thresholds
        entry: hooks/check_merid_coverage.py
        language: system
        files: ^core/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
