##############################################################################
# MERID Full Streaming Stack - Redpanda + Flink + Monitoring
#
# Complete production-ready stack with:
# - Redpanda (Kafka-compatible broker)
# - Flink (JobManager + scalable TaskManagers)
# - Prometheus + Grafana (monitoring)
#
# Usage:
#   docker-compose -f docker-compose.full-stack.yml up -d
#   docker-compose -f docker-compose.full-stack.yml up -d --scale flink-taskmanager=3
#
# UIs:
#   - Redpanda Console: http://localhost:8080
#   - Flink Dashboard:  http://localhost:8081
#   - Prometheus:       http://localhost:9090
#   - Grafana:          http://localhost:3000 (admin/admin)
##############################################################################

version: "3.8"

services:
  # ==========================================================================
  # REDPANDA - Kafka-compatible streaming broker
  # ==========================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.21
    container_name: merid-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --schema-registry-addr 0.0.0.0:8083
      - --advertise-schema-registry-addr localhost:8083
      - --set redpanda.transaction_coordinator_replication=1
      - --set redpanda.id_allocator_replication=1
      - --set kafka/transaction.max.timeout.ms=900000
    ports:
      - "9092:9092"       # Internal Kafka
      - "19092:19092"     # External Kafka
      - "8082:8082"       # HTTP Proxy
      - "8083:8083"       # Schema Registry
      - "9644:9644"       # Admin/Metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - merid-net

  # ==========================================================================
  # REDPANDA CONSOLE - Web UI
  # ==========================================================================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: merid-console
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_SCHEMAREGISTRY_ENABLED=true
      - KAFKA_SCHEMAREGISTRY_URLS=http://redpanda:8083
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - merid-net

  # ==========================================================================
  # TOPIC INITIALIZATION
  # ==========================================================================
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.21
    container_name: merid-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c '
      echo "Creating MERID topics..."
      
      # Price topics
      rpk topic create prices.kraken.BTCUSD -p 1 --brokers redpanda:9092
      rpk topic create prices.kraken.ETHUSD -p 1 --brokers redpanda:9092
      rpk topic create prices.binance.BTCUSDT -p 1 --brokers redpanda:9092
      
      # Bar topics
      rpk topic create bars.1m.kraken.BTCUSD -p 1 --brokers redpanda:9092
      rpk topic create bars.1m.kraken.ETHUSD -p 1 --brokers redpanda:9092
      
      # Feature topics
      rpk topic create features.kraken.BTCUSD -p 1 --brokers redpanda:9092
      rpk topic create features.kraken.ETHUSD -p 1 --brokers redpanda:9092
      
      # Agent topics
      rpk topic create agent.opinions -p 3 --brokers redpanda:9092
      rpk topic create agent.decisions -p 3 --brokers redpanda:9092
      
      # Trade topics
      rpk topic create trades.intents -p 3 --brokers redpanda:9092
      rpk topic create trades.executed -p 3 --brokers redpanda:9092
      
      # Risk topics
      rpk topic create risk.alerts -p 1 --brokers redpanda:9092
      
      echo "Topics created!"
      rpk topic list --brokers redpanda:9092
      '
    networks:
      - merid-net

  # ==========================================================================
  # FLINK JOB MANAGER
  # ==========================================================================
  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: merid-flink-jm
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    ports:
      - "8081:8081"   # Web UI
      - "6123:6123"   # RPC
      - "9249:9249"   # Prometheus metrics
    volumes:
      - ./flink/conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
      - ./flink/sql:/opt/flink/sql:ro
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - merid-net

  # ==========================================================================
  # FLINK TASK MANAGER (scalable)
  # ==========================================================================
  flink-taskmanager:
    image: flink:1.18-scala_2.12
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./flink/conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml:ro
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    depends_on:
      - flink-jobmanager
    networks:
      - merid-net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G

  # ==========================================================================
  # PROMETHEUS - Metrics collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: merid-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - flink-jobmanager
    networks:
      - merid-net

  # ==========================================================================
  # GRAFANA - Dashboards
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: merid-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - merid-net

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  merid-net:
    name: merid-net
    driver: bridge

# ==========================================================================
# VOLUMES
# ==========================================================================
volumes:
  redpanda-data:
    name: merid-redpanda-data
  flink-checkpoints:
    name: merid-flink-checkpoints
  flink-savepoints:
    name: merid-flink-savepoints
  prometheus-data:
    name: merid-prometheus-data
  grafana-data:
    name: merid-grafana-data
