# =============================================================================
# MERID Kafka Connect Configuration
#
# Distributed mode configuration for sinking trading data to analytics stores.
# Run with Redpanda as the Kafka-compatible broker.
#
# Use cases:
#   - Sink trades.executed to PostgreSQL for analytics
#   - Sink bars.1m.* to ClickHouse for time-series queries
#   - Sink agent.decisions to S3 for audit trail
# =============================================================================

# =============================================================================
# BOOTSTRAP
# =============================================================================
bootstrap.servers=redpanda:9092

# =============================================================================
# CLUSTER IDENTITY
# =============================================================================
group.id=merid-connect-cluster

# =============================================================================
# TOPIC CONFIGURATION
# =============================================================================
# Internal topics for Connect coordination
config.storage.topic=merid-connect-configs
config.storage.replication.factor=1

offset.storage.topic=merid-connect-offsets
offset.storage.replication.factor=1
offset.storage.partitions=25

status.storage.topic=merid-connect-status
status.storage.replication.factor=1
status.storage.partitions=5

# =============================================================================
# CONVERTERS
# =============================================================================
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false

value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# =============================================================================
# REST API
# =============================================================================
rest.host.name=0.0.0.0
rest.port=8083
rest.advertised.host.name=kafka-connect
rest.advertised.port=8083

# =============================================================================
# PLUGIN PATH
# =============================================================================
plugin.path=/usr/share/java,/usr/share/confluent-hub-components

# =============================================================================
# PRODUCER/CONSUMER DEFAULTS
# =============================================================================
producer.bootstrap.servers=redpanda:9092
consumer.bootstrap.servers=redpanda:9092

# Exactly-once for sinks (requires Kafka transactions)
# producer.enable.idempotence=true
# producer.transactional.id=merid-connect-producer

# =============================================================================
# PERFORMANCE
# =============================================================================
offset.flush.interval.ms=10000
offset.flush.timeout.ms=5000

# =============================================================================
# TASK CONFIGURATION
# =============================================================================
tasks.max=4
