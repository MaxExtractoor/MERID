# Unified Risk Limits Configuration
# DEPRECATED for kalshi_crypto_15m_v2 profile (MERID_PROFILE=kalshi_crypto_15m_v2)
#
# For Kalshi 15m crypto agents (BTC_15M, ETH_15M, SOL_15M, XRP_15M, DOGE_15M):
#   - All risk limits: Use config/profiles/kalshi_crypto_15m_v2.yaml (SINGLE SOURCE OF TRUTH)
#   - Fixed $1 exposure cap: risk_policy.fixed_exposure_cap_usd: 1.00
#   - Per-asset limits: assets.*.max_contracts.value: 1
#   - Daily loss: guardrails.max_daily_loss_pct: 0.20 (20%)
#
# This file is retained for backward compatibility with other profiles only.
# DO NOT use this file for 15m crypto trading configuration.
#
# Single Source of Truth for all risk management parameters
# All caps are percentages of live bankroll unless otherwise specified

# Fixed exposure cap (SINGLE SOURCE OF TRUTH: global slot allocator $2 model)
# Env var MERID_FIXED_EXPOSURE_CAP_USD overrides this value.
fixed_exposure_cap_usd: 2.00

# Bankroll-based risk limits for highly correlated crypto assets
# BTC, ETH, SOL, XRP, DOGE have 0.8+ correlation and are treated as single position
# 2026-07-16: Percentage-based ALLOCATION caps DISABLED (0.0) - the $1 global slot
# allocator (merid/risk/global_slot_allocator.py) is the single source of truth.
# pct==0.0 makes UnifiedRiskManager defer to fixed_exposure_cap_usd.
bankroll:
  # DISABLED - fixed $2 cap via global slot allocator (was 0.05 = 5% per cycle)
  max_cycle_risk_pct: 0.0
  
  # DISABLED - fixed $2 cap via global slot allocator (was 0.15 = 15% total)
  max_total_risk_pct: 0.0
  
  # Maximum daily loss limit (5% - triggers trading halt)
  # Standard institutional practice: 3-5% daily loss limit
  daily_loss_pct: 0.20  # CRITICAL FIX: 20% aligned with drawdown halt (was 0.05)
  
  # Maximum cluster loss (2.5% - half of daily limit)
  cluster_stop_pct: 0.025

# Category-level caps
categories:
  crypto:
    # DISABLED - fixed $2 cap via global slot allocator (was 0.25 = 25% of bankroll)
    max_notional_pct: 0.0
    # Minimum floor in USD (legacy pct mode only - unused when pct is 0.0)
    min_cap_usd: 100.0

# Correlated stack caps (same underlying across timeframes)
correlated_stack:
  # 2026-07-08: DISABLED percentage-based cap for fixed $2 exposure model
  # Maximum exposure to same underlying is now fixed at $2 USD
  # BTC, ETH, SOL, XRP, DOGE treated as single position due to 0.8+ correlation
  max_notional_pct: 0.0  # DISABLED - using fixed USD cap instead
  # Fixed USD cap (primary source of truth)
  max_usd: 2.0  # Max $2 total exposure (hard cap)
  # Minimum floor in USD
  min_cap_usd: 1.0

# Per-asset caps (DISABLED for highly correlated crypto assets)
# When assets have 0.8+ correlation, per-asset caps block legitimate trades
# Use portfolio-level correlated stack cap instead
per_asset:
  enabled: false
  # If enabled, these would be per-asset percentages of bankroll
  # BTC: 0.02  # 2%
  # ETH: 0.02  # 2%
  # SOL: 0.015 # 1.5%
  # XRP: 0.015 # 1.5%
  # DOGE: 0.01 # 1%
  min_cap_usd: 5.0

# Per-trade limits
per_trade:
  # DISABLED - fixed $2 cap via global slot allocator (was 0.03 = 3% of bankroll)
  # The $2 global slot allocator enforces per-order exposure (10-75c, up to 2 contracts).
  max_notional_pct: 0.0
  # Maximum contracts per trade (slot model: 2 contracts per order)
  max_contracts: 2

# Drawdown limits (loss guardrails - NOT allocation; percentage of bankroll is correct here)
drawdown:
  # Drawdown percentage that triggers trading halt (20% - aligned with profile guardrails)
  halt_pct: 0.20
  # Drawdown percentage that triggers position unwind (25% - aligned with profile guardrails)
  unwind_pct: 0.25

# Rate limiting
rate_limit:
  # Maximum trades per hour
  max_trades_per_hour: 20
  # Minimum time between trades (seconds)
  min_time_between_trades: 60.0

# Emergency controls
emergency:
  # Emergency halt flag (set to true to halt all trading)
  halt: false
  # Reason for halt (if halt is true)
  halt_reason: ""
