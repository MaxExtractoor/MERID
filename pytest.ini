[pytest]
pythonpath = .
testpaths = tests
norecursedirs = archived_prototype flutter LangChain-Ollama .hypothesis
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Local dev: minimal options
# CI/coverage: enable via explicit command or CI config
addopts =
    -ra
    --import-mode=importlib
    -p no:langsmith
    -p no:charset_normalizer
    --ignore=tests_legacy
    # --cov-config=.coveragerc
    # --cov-report=xml:coverage.xml
    # --cov-report=term-missing
    # --cov-report=html:htmlcov
    # --checklist-collect=merid,trading,core
    # --checklist-report

# Suppress expected deprecation warnings from legacy config functions
filterwarnings =
    ignore::DeprecationWarning:config.kalshi_15m_crypto_config
    # Suppress websockets library deprecation warnings (from library itself, not our code)
    ignore::DeprecationWarning:websockets
    # Suppress mock library RuntimeWarning for coroutines (test cleanup issue)
    ignore::RuntimeWarning:unittest.mock
    # Suppress inspect module RuntimeWarning for coroutines (test cleanup issue)
    ignore::RuntimeWarning:inspect
    # Suppress pytest unraisable exception warnings for event loop cleanup (test cleanup issue)
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    dev_swarm: Dev Swarm subsystem tests (strict coverage gate target >=90%)
    smoke: Smoke tests for critical path sanity checks
    safety_critical: Tests covering execution guardrails, poisoning/Sybil defenses, lag monitoring, and other safety invariants
    risk_core: Tests covering venue onboarding, routing/reconciliation, ARR risk analytics, and access-control guardrails
    prod_integration: Tests that require live or prod-like services (Moat API, production dashboard)
    stress_core: Stress, soak, or high-load suites that exercise production limits
    quarantine: Known-broken, flaky, or legacy tests skipped unless --run-quarantine
    kalshi_enhanced: Legacy Kalshi enhanced-client/adapter stack (see tests/QUARANTINE_INDEX.txt)
    snapshot: Deterministic golden-output tests guarding against behavioral drift
    localvenue: Tests for local venue functionality
    feed_handlers: Tests for feed handler components
    matching_engine: Tests for matching engine components
    ui_integration: Tests for UI integration
    ui_api: Tests for UI API endpoints
    ui_smoke: Smoke tests for UI components
    e2e: End-to-end tests
    failure_scenarios: Failure scenario tests
    cross_mode: Cross-venue parity tests
    performance: Performance and load tests
    integration: System integration tests
    pointer: Pointer marks for pytest-checklist to track critical function coverage
    asyncio: Marks for async tests (built-in)
    contract: Pact contract tests
    xfail: Expected failure tests
    skip: Tests to skip
    kalshi_core: Tests specific to Kalshi venue integration (order routing, WebSocket, execution)
    kalshi_live_ready: Go/no-go slice — execution gate wiring, spot/exchange gating, health JSON, risk caps, crypto universe invariants, snapshot replay (P0-3)
    p0_live_blocker: Stricter subset — execution gate + live route fail-closed, exchange/session gating, health, core check_execution_gate scenarios (enable-live trading gate)
    windows_flaky_async: Tests that may be flaky on Windows due to async event loop behavior
    devswarm: Dev Swarm subsystem tests
    auditor: Auditor-specific tests
    kalshi_crypto_15m_v2: Tests for the kalshi_crypto_15m_v2 profile (BTC/ETH/SOL/XRP/DOGE 15m sentiment-free trading)
    sentiment_research: Research-only sentiment tests excluded from live 15m Kalshi runs
    kalshi_15m_critical: Critical path tests for Kalshi 15m crypto stack (startup, WS, market_state, risk, AgentGrid, loop)
    kalshi_risk: Tests for Kalshi risk infrastructure (exposure caps, kill-switch, risk limits, reconciliation invariants)
    kalshi_agent_grid: Tests for Kalshi agent grid configuration and initialization
    kalshi_catalog: Tests for Kalshi market catalog discovery and refresh
    kalshi_websocket: Tests for Kalshi WebSocket connection and message handling
    benchmark: Performance benchmark tests
    kalshi_15m: Tests for Kalshi 15m crypto sealed stack (run in Kalshi 15m CI with MERID_PROFILE=kalshi_crypto_15m_v2)
    legacy: Tests for legacy/non-Kalshi systems (swarm, sentiment, governance, non-Kalshi venues, DeFi, sports/macro)

[coverage:run]
# Track branch coverage for better quality gates
branch = True
source = 
    merid
    trading
    core

[coverage:report]
# Per-module thresholds - these are enforced by CI, not local runs
# TradingGuard: 85%
# Portfolio: 80%
# Kalshi executor: 75%
# Coinbase executor: 75%
show_missing = True
skip_covered = False

# Run tests in parallel:
#   pytest tests -n auto
