[pytest]
pythonpath = .
testpaths = tests
norecursedirs = archived_prototype flutter LangChain-Ollama
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings - per-module thresholds enforced in CI
addopts = 
    -ra
    --cov-config=.coveragerc
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --checklist-collect=merid,trading,core
    --checklist-report

[coverage:run]
# Track branch coverage for better quality gates
branch = True
source = 
    merid
    trading
    core

[coverage:report]
# Per-module thresholds - these are enforced by CI, not local runs
# TradingGuard: 85%
# Portfolio: 80%
# Kalshi executor: 75%
# Coinbase executor: 75%
show_missing = True
skip_covered = False

# Run tests in parallel:
#   pytest tests -n auto
markers =
    dev_swarm: Dev Swarm subsystem tests (strict coverage gate target >=90%)
    smoke: Smoke tests for critical path sanity checks
    safety_critical: Tests covering execution guardrails, poisoning/Sybil defenses, lag monitoring, and other safety invariants
    risk_core: Tests covering venue onboarding, routing/reconciliation, ARR risk analytics, and access-control guardrails
    prod_integration: Tests that require live or prod-like services (Moat API, production dashboard)
    stress_core: Stress, soak, or high-load suites that exercise production limits
    quarantine: Known-broken or flaky tests awaiting fixes
    snapshot: Deterministic golden-output tests guarding against behavioral drift
    localvenue: Tests for local venue functionality
    feed_handlers: Tests for feed handler components
    matching_engine: Tests for matching engine components
    ui_integration: Tests for UI integration
    ui_api: Tests for UI API endpoints
    ui_smoke: Smoke tests for UI components
    e2e: End-to-end tests
    failure_scenarios: Failure scenario tests
    cross_mode: Cross-venue parity tests
    performance: Performance and load tests
    integration: System integration tests
    pointer: Pointer marks for pytest-checklist to track critical function coverage
    asyncio: Marks for async tests (built-in)
    contract: Pact contract tests
    xfail: Expected failure tests
    skip: Tests to skip
