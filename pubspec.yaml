name: merid
description: MERID v2.0 - Sovereign Decision Organism
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0+1
  web_socket_channel: ^3.0.3
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  web3dart: ^2.7.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
