# MERID 15m Lean Trading System - Supervisor Configuration
# For Windows/Unix systems with Supervisor
# CRITICAL FIX (2026-07-17): Process management for 24/7 uptime with auto-restart

[program:merid_15m_lean]
command=C:\\Dev\\MERID\\venv\\Scripts\\python.exe -m uvicorn web.main_15m_lean:app --host 0.0.0.0 --port 8011
directory=C:\\Dev\\MERID
user=merid
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true

# Environment variables
environment=MERID_PROFILE="kalshi_crypto_15m_v2",TRADING_ENABLED="true",MERID_PM_TRADING_MODE="live",MERID_KALSHI_NET_EDGE_FILTER_ENABLED="false",MERID_DISABLE_SHARED_RISK_GUARD="true",MERID_FIXED_EXPOSURE_CAP_USD="2.00"

# Logging
stdout_logfile=C:\\Dev\\MERID\\logs\\supervisor_stdout.log
stderr_logfile=C:\\Dev\\MERID\\logs\\supervisor_stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10

# Process priority
priority=999

# Process management
redirect_stderr=true
