[SERVICE]
    Parsers_File parsers.conf
    Log_Level info

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    DB                /var/log/fluent-bit/docker.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    On

[INPUT]
    Name              tail
    Path              /var/log/merid/agent_runs.jsonl
    Parser            json
    Tag               merid.agent_runs
    DB                /var/log/fluent-bit/agent_runs.db
    Mem_Buf_Limit     50MB
    Refresh_Interval  5

[INPUT]
    Name              tail
    Path              /var/log/merid/*.log
    Parser            json
    Tag               merid.logs
    DB                /var/log/fluent-bit/merid_logs.db
    Mem_Buf_Limit     50MB
    Refresh_Interval  5

[FILTER]
    Name              modify
    Match             docker.*
    Add               service docker
    Add               container_name ${container_name}
    Add               container_id ${container_id}

[FILTER]
    Name              grep
    Match             docker.*
    Regex             msg agent_run_completed|agent_run_failed|agent_run_logging_failed
    Exclude           On

[FILTER]
    Name              parser
    Match             merid.agent_runs
    Key_Name         log
    Parser           json
    Reserve_Data      On

[OUTPUT]
    Name  es
    Match docker.*
    Host  elasticsearch
    Port  9200
    Index docker-logs
    Time_Key @timestamp

[OUTPUT]
    Name  es
    Match merid.*
    Host  elasticsearch
    Port  9200
    Index merid-logs
    Time_Key @timestamp

[OUTPUT]
    Name  stdout
    Match *
    Format json_lines
