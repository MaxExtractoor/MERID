version: "3.9"

services:
  merid-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=merid
      - REDIS_URL=redis://redis:6379
    depends_on:
      - neo4j
      - redis
    volumes:
      - .:/app
    command: uvicorn merid_api:app --host 0.0.0.0 --port 8000 --reload

  neo4j:
    image: neo4j:5.27-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/merid
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data:
