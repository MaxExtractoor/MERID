version: "3.9"

services:
  # ========== LLM & AI Services ==========
  ollama:
    image: ollama/ollama:latest
    container_name: merid-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ========== Database & Cache ==========
  postgres:
    image: postgres:16-alpine
    container_name: merid-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: merid
      POSTGRES_USER: merid
      POSTGRES_PASSWORD: merid_local_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merid -d merid"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.27-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/merid
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ========== Broker API Mocks ==========
  wiremock:
    image: wiremock/wiremock:3.3.1
    container_name: merid-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings
      - ./docker/wiremock/__files:/home/wiremock/__files
    command: --port 8080 --verbose

  # ========== Observability Stack ==========
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: merid-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.2.3
    container_name: merid-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=merid_local
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: merid-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ========== Container Management ==========
  portainer:
    image: portainer/portainer-ce:2.19.4
    container_name: merid-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # ========== MERID API ==========
  merid-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=merid
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://merid:merid_local_dev@postgres:5432/merid
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - neo4j
      - redis
      - postgres
      - ollama
    volumes:
      - .:/app
    command: uvicorn merid_api:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ollama_data:
  postgres_data:
  neo4j_data:
  redis_data:
  prometheus_data:
  grafana_data:
  portainer_data:
