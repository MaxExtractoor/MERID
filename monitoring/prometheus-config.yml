# MERID Prometheus Configuration
# Week 2: Production Operations Gate - Evidence Artifact
# Date: 2026-01-26

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'merid-prod'
    environment: 'production'

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # MERID API Metrics
  - job_name: 'merid-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'merid-api-1'

  # Node Exporter for System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # cAdvisor for Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Neo4j Metrics
  - job_name: 'neo4j'
    static_configs:
      - targets: ['localhost:2004']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Jaeger Metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['localhost:14269']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Docker Container Metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    metrics_path: '/metrics'
    scrape_interval: 10s

# Alertmanager Configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Remote Write Configuration (for long-term storage)
remote_write:
  - url: "http://prometheus-remote-storage/api/v1/write"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500

# Storage Configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 10GB
