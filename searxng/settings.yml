# ==================================================
# SEARXNG CONFIGURATION — MERID Self-Hosted Instance
# Location: C:\Dev\MERID\searxng\settings.yml
# Purpose: Privacy-focused, powerful metasearch for MERID agents
# ==================================================

use_default_settings: true

server:
  secret_key: "MERID_ultra_secure_key_change_this_2026"  # CHANGE THIS IN PRODUCTION
  limiter: false
  image_proxy: true  # Proxy images for privacy

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"

ui:
  default_theme: oscar
  static_use_hash: true

# ==================================================
# ENGINES — Enhanced for maximum truth-seeking
# ==================================================

engines:
  # Major search engines
  - name : google
    shortcut : go
    disabled : false
    categories : general
    paging : true
    time_range_support : true
    safesearch : true

  - name : bing
    shortcut : bi
    disabled : false

  - name : duckduckgo
    shortcut : ddg
    disabled : false

  # Privacy-focused
  - name : qwant
    shortcut : qw
    disabled : false

  - name : startpage
    shortcut : sp
    disabled : false

  # Academic / Scientific
  - name : google scholar
    shortcut : gs
    disabled : false

  - name : semantic scholar
    shortcut : ss
    disabled : false

  - name : pubmed
    shortcut : pm
    disabled : false

  # News & Real-time
  - name : reddit
    shortcut : re
    disabled : false

  - name : wikinews
    shortcut : wn
    disabled : false

  # Code & Dev
  - name : github
    shortcut : gh
    disabled : false

  - name : stackoverflow
    shortcut : so
    disabled : false

  # Crypto / Finance
  - name : currency
    shortcut : cu
    disabled : false

  - name : yahoo finance
    shortcut : yf
    disabled : false

  # Alternative / Decentralized
  - name : marginalia
    shortcut : mg
    disabled : false  # Non-commercial web index

  - name : wiby
    shortcut : wb
    disabled : false  # Surprise me old web

# Enable metrics for monitoring
enable_metrics : true

# Comments: This config gives MERID agents access to diverse, high-quality sources
# including academic, real-time, code, and alternative web indexes.
# Avoid over-enabling — too many slow engines degrade performance.
