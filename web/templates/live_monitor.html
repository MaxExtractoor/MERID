<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERID Live Monitor - Real-Time Intelligence Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
            padding: 20px;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }
        
        .header h1 {
            color: #00ff88;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #00ff88;
            color: #0a0e27;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .panel {
            background: #1a1f3a;
            border: 1px solid #2a3f5f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        .panel-header {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2a3f5f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .event-stream {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .event-stream::-webkit-scrollbar {
            width: 8px;
        }
        
        .event-stream::-webkit-scrollbar-track {
            background: #0a0e27;
            border-radius: 4px;
        }
        
        .event-stream::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 4px;
        }
        
        .event {
            background: #0f1629;
            border-left: 3px solid #00ff88;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .event.market {
            border-left-color: #00d4ff;
        }
        
        .event.news {
            border-left-color: #ff9500;
        }
        
        .event.agent {
            border-left-color: #ff00ff;
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .event-type {
            font-weight: bold;
            color: #00ff88;
            text-transform: uppercase;
            font-size: 12px;
        }
        
        .event-time {
            color: #888;
            font-size: 11px;
        }
        
        .event-content {
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #0f1629;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        
        .metric-label {
            color: #888;
            font-size: 13px;
        }
        
        .metric-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 16px;
        }
        
        .price-change.positive {
            color: #00ff88;
        }
        
        .price-change.negative {
            color: #ff4444;
        }
        
        .sentiment-positive {
            color: #00ff88;
        }
        
        .sentiment-negative {
            color: #ff4444;
        }
        
        .sentiment-neutral {
            color: #ffaa00;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        
        .stat-card {
            background: #0f1629;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2a3f5f;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ MERID Live Intelligence Monitor</h1>
        <span class="status" id="status">CONNECTING...</span>
    </div>
    
    <div class="container">
        <!-- Statistics Panel -->
        <div class="panel full-width">
            <div class="panel-header">System Metrics</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="marketEvents">0</div>
                    <div class="stat-label">Market Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="newsEvents">0</div>
                    <div class="stat-label">News Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="agentOutputs">0</div>
                    <div class="stat-label">Agent Outputs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalEvents">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
            </div>
        </div>
        
        <!-- Market Data Stream -->
        <div class="panel">
            <div class="panel-header">📊 Market Data Stream</div>
            <div class="event-stream" id="marketStream"></div>
        </div>
        
        <!-- News Stream -->
        <div class="panel">
            <div class="panel-header">📰 News Stream</div>
            <div class="event-stream" id="newsStream"></div>
        </div>
        
        <!-- Agent Outputs -->
        <div class="panel full-width">
            <div class="panel-header">🤖 Agent Intelligence Stream</div>
            <div class="event-stream" id="agentStream"></div>
        </div>
    </div>
    
    <script>
        let ws;
        let stats = {
            market: 0,
            news: 0,
            agent: 0,
            total: 0
        };
        
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/live`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status').textContent = 'LIVE';
                document.getElementById('status').style.background = '#00ff88';
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'connected') {
                    console.log('Stream connected:', data.message);
                    return;
                }
                
                handleEvent(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('status').textContent = 'ERROR';
                document.getElementById('status').style.background = '#ff4444';
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed, reconnecting...');
                document.getElementById('status').textContent = 'RECONNECTING...';
                document.getElementById('status').style.background = '#ffaa00';
                setTimeout(connect, 3000);
            };
        }
        
        function handleEvent(data) {
            stats.total++;
            
            switch(data.channel) {
                case 'market_data':
                    stats.market++;
                    displayMarketEvent(data);
                    break;
                case 'news':
                    stats.news++;
                    displayNewsEvent(data);
                    break;
                case 'agent_output':
                    stats.agent++;
                    displayAgentEvent(data);
                    break;
            }
            
            updateStats();
        }
        
        function displayMarketEvent(data) {
            const container = document.getElementById('marketStream');
            const event = document.createElement('div');
            event.className = 'event market';
            
            const symbol = data.data.symbol || 'UNKNOWN';
            const price = data.data.price || 0;
            const change = data.data.change || 0;
            const changeClass = change >= 0 ? 'positive' : 'negative';
            
            event.innerHTML = `
                <div class="event-header">
                    <span class="event-type">${data.event_type} - ${symbol}</span>
                    <span class="event-time">${formatTime(data.timestamp)}</span>
                </div>
                <div class="event-content">
                    <strong>Price:</strong> $${price.toFixed(2)} 
                    <span class="price-change ${changeClass}">(${change >= 0 ? '+' : ''}${change.toFixed(2)}%)</span><br>
                    <strong>Source:</strong> ${data.source}
                </div>
            `;
            
            container.insertBefore(event, container.firstChild);
            
            // Keep only last 20 events
            while (container.children.length > 20) {
                container.removeChild(container.lastChild);
            }
        }
        
        function displayNewsEvent(data) {
            const container = document.getElementById('newsStream');
            const event = document.createElement('div');
            event.className = 'event news';
            
            const title = data.data.title || 'No title';
            const sentiment = data.data.sentiment || 0;
            const sentimentClass = sentiment > 0.3 ? 'sentiment-positive' : 
                                   sentiment < -0.3 ? 'sentiment-negative' : 'sentiment-neutral';
            const sentimentText = sentiment > 0.3 ? 'BULLISH' : 
                                  sentiment < -0.3 ? 'BEARISH' : 'NEUTRAL';
            
            event.innerHTML = `
                <div class="event-header">
                    <span class="event-type">${data.source}</span>
                    <span class="event-time">${formatTime(data.timestamp)}</span>
                </div>
                <div class="event-content">
                    <strong>${title}</strong><br>
                    <span class="${sentimentClass}">Sentiment: ${sentimentText} (${sentiment.toFixed(2)})</span>
                </div>
            `;
            
            container.insertBefore(event, container.firstChild);
            
            while (container.children.length > 20) {
                container.removeChild(container.lastChild);
            }
        }
        
        function displayAgentEvent(data) {
            const container = document.getElementById('agentStream');
            const event = document.createElement('div');
            event.className = 'event agent';
            
            const type = data.event_type || 'analysis';
            const agentData = data.data || {};
            
            let content = '';
            if (agentData.reasoning) {
                content = `<strong>Reasoning:</strong> ${agentData.reasoning}<br>`;
            }
            if (agentData.confidence) {
                content += `<strong>Confidence:</strong> ${(agentData.confidence * 100).toFixed(1)}%<br>`;
            }
            if (agentData.signal) {
                content += `<strong>Signal:</strong> ${agentData.signal.toUpperCase()}<br>`;
            }
            
            event.innerHTML = `
                <div class="event-header">
                    <span class="event-type">${data.source} - ${type}</span>
                    <span class="event-time">${formatTime(data.timestamp)}</span>
                </div>
                <div class="event-content">
                    ${content || JSON.stringify(agentData, null, 2)}
                </div>
            `;
            
            container.insertBefore(event, container.firstChild);
            
            while (container.children.length > 15) {
                container.removeChild(container.lastChild);
            }
        }
        
        function updateStats() {
            document.getElementById('marketEvents').textContent = stats.market;
            document.getElementById('newsEvents').textContent = stats.news;
            document.getElementById('agentOutputs').textContent = stats.agent;
            document.getElementById('totalEvents').textContent = stats.total;
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString();
        }
        
        // Connect on page load
        connect();
    </script>
</body>
</html>
