<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERID Simulation Monitor</title>
    <link rel="stylesheet" href="/static/css/merid.css">
    <style>
        .simulation-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .simulation-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            color: white;
        }

        .simulation-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }

        .simulation-header p {
            margin: 0;
            opacity: 0.9;
        }

        .simulation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .simulation-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .simulation-card h2 {
            margin: 0 0 20px 0;
            font-size: 1.5em;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .news-headline {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
            color: #333;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .news-url {
            font-size: 0.85em;
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }

        .news-url:hover {
            text-decoration: underline;
        }

        .agent-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .agent-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #28a745;
        }

        .agent-item.rejected {
            border-left-color: #dc3545;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .agent-name {
            font-weight: bold;
            color: #333;
        }

        .agent-confidence {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .agent-reasoning {
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }

        .consensus-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .consensus-badge.approved {
            background: #28a745;
            color: white;
        }

        .consensus-badge.rejected {
            background: #dc3545;
            color: white;
        }

        .consensus-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.connected {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: #dc3545;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .simulation-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="simulation-container">
        <div class="simulation-header">
            <h1>🤖 MERID Simulation Monitor</h1>
            <p>
                <span class="status-indicator" id="wsStatus"></span>
                <span id="statusText">Connecting to simulation stream...</span>
            </p>
        </div>

        <div class="simulation-grid">
            <!-- Current News Being Processed -->
            <div class="simulation-card">
                <h2>📰 Current News</h2>
                <div id="currentNews">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <p>Waiting for news to process...</p>
                    </div>
                </div>
            </div>

            <!-- Simulation Results -->
            <div class="simulation-card">
                <h2>🤖 Simulation Layer</h2>
                <div id="simulationResults">
                    <div class="empty-state">
                        <div class="empty-state-icon">🔄</div>
                        <p>No simulation data yet</p>
                    </div>
                </div>
            </div>

            <!-- Agent Analysis -->
            <div class="simulation-card">
                <h2>👥 Agent Analysis</h2>
                <div id="agentAnalysis">
                    <div class="empty-state">
                        <div class="empty-state-icon">🧠</div>
                        <p>Waiting for agent analysis...</p>
                    </div>
                </div>
            </div>

            <!-- Consensus Results -->
            <div class="simulation-card">
                <h2>🎯 Consensus Decision</h2>
                <div id="consensusResults">
                    <div class="empty-state">
                        <div class="empty-state-icon">⚖️</div>
                        <p>No consensus data yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}/ws/simulation`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('Connected to simulation stream');
                reconnectAttempts = 0;
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Simulation update:', data);
                handleSimulationUpdate(data);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus(false);
            };

            ws.onclose = () => {
                console.log('Disconnected from simulation stream');
                updateStatus(false);
                
                // Attempt to reconnect
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, 3000);
                }
            };
        }

        function updateStatus(connected) {
            const indicator = document.getElementById('wsStatus');
            const text = document.getElementById('statusText');
            
            if (connected) {
                indicator.className = 'status-indicator connected';
                text.textContent = 'Connected - Monitoring simulations';
            } else {
                indicator.className = 'status-indicator disconnected';
                text.textContent = 'Disconnected - Attempting to reconnect...';
            }
        }

        function handleSimulationUpdate(data) {
            if (data.type === 'simulation_complete') {
                updateCurrentNews(data.news);
                updateSimulationResults(data.simulation);
                updateAgentAnalysis(data.simulation.agents);
            } else if (data.type === 'consensus_complete') {
                updateConsensusResults(data.consensus);
            }
        }

        function updateCurrentNews(news) {
            const container = document.getElementById('currentNews');
            container.innerHTML = `
                <div class="news-item">
                    <div class="news-headline">${escapeHtml(news.headline)}</div>
                    <div class="news-meta">
                        <span>📰 ${escapeHtml(news.source)}</span>
                        <span>⚡ ${Math.round(news.importance * 100)}%</span>
                    </div>
                    <a href="${escapeHtml(news.url)}" target="_blank" class="news-url">
                        🔗 ${escapeHtml(news.url)}
                    </a>
                </div>
            `;
        }

        function updateSimulationResults(simulation) {
            const container = document.getElementById('simulationResults');
            const badge = simulation.approved ? 
                '<span class="consensus-badge approved">✅ APPROVED</span>' :
                '<span class="consensus-badge rejected">❌ REJECTED</span>';
            
            container.innerHTML = `
                ${badge}
                <div class="consensus-stats">
                    <div class="stat-box">
                        <div class="stat-value">${Math.round(simulation.consensus * 100)}%</div>
                        <div class="stat-label">Consensus</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${simulation.agent_count}</div>
                        <div class="stat-label">Agents</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${simulation.approved ? 'YES' : 'NO'}</div>
                        <div class="stat-label">Approved</div>
                    </div>
                </div>
            `;
        }

        function updateAgentAnalysis(agents) {
            const container = document.getElementById('agentAnalysis');
            
            if (!agents || agents.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No agent data</p></div>';
                return;
            }

            const agentHtml = agents.map(agent => {
                const voteClass = agent.vote > 0 ? '' : 'rejected';
                const voteIcon = agent.vote > 0 ? '✅' : '❌';
                
                return `
                    <div class="agent-item ${voteClass}">
                        <div class="agent-header">
                            <span class="agent-name">${voteIcon} ${escapeHtml(agent.agent)}</span>
                            <span class="agent-confidence">${Math.round(agent.confidence * 100)}%</span>
                        </div>
                        <div class="agent-reasoning">${escapeHtml(agent.reasoning || 'No reasoning provided')}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="agent-list">${agentHtml}</div>`;
        }

        function updateConsensusResults(consensus) {
            const container = document.getElementById('consensusResults');
            const badge = consensus.approved ? 
                '<span class="consensus-badge approved">✅ APPROVED</span>' :
                '<span class="consensus-badge rejected">❌ REJECTED</span>';
            
            container.innerHTML = `
                ${badge}
                <div class="consensus-stats">
                    <div class="stat-box">
                        <div class="stat-value">${Math.round(consensus.confidence * 100)}%</div>
                        <div class="stat-label">Confidence</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${consensus.agent_count}</div>
                        <div class="stat-label">Agents</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${consensus.summary || 'N/A'}</div>
                        <div class="stat-label">Summary</div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Connect on page load
        connectWebSocket();
    </script>
</body>
</html>
