<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERID API Integration Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%); 
            color: #ffffff; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .header { 
            background: rgba(255, 255, 255, 0.05); 
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 30px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff41, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .summary-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
        }
        
        .summary-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .summary-label {
            color: #a8a8a8;
            font-size: 0.9em;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .category-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .category-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #00b4d8;
        }
        
        .category-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff41;
        }
        
        .stat-label {
            font-size: 0.8em;
            color: #a8a8a8;
        }
        
        .api-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .api-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .api-item.configured {
            border-left-color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
        }
        
        .api-item.missing-required {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        
        .api-item.optional-missing {
            border-left-color: #ffbd2e;
            background: rgba(255, 189, 46, 0.1);
        }
        
        .api-name {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .api-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-active {
            background: #00ff41;
            color: #0f0f23;
        }
        
        .status-missing {
            background: #ff6b6b;
            color: #ffffff;
        }
        
        .status-optional {
            background: #ffbd2e;
            color: #0f0f23;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #00b4d8;
            font-size: 1.2em;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .refresh-btn {
            background: linear-gradient(45deg, #00ff41, #00b4d8);
            color: #0f0f23;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px auto;
            display: block;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.3);
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #00ff41, #00b4d8);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔌 MERID API Integration Dashboard</h1>
        <p>Real-time status of all configured API integrations and services</p>
    </div>

    <div class="main-container">
        <div id="loading" class="loading pulse">
            Loading API status...
        </div>

        <div id="content" style="display: none;">
            <!-- Summary Section -->
            <div class="summary-section">
                <h2>📊 Integration Overview</h2>
                <div class="summary-grid" id="summaryGrid">
                    <!-- Summary cards will be populated here -->
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="overallProgress" style="width: 0%"></div>
                </div>
            </div>

            <!-- Categories Grid -->
            <div class="categories-grid" id="categoriesGrid">
                <!-- Category sections will be populated here -->
            </div>

            <button class="refresh-btn" onclick="loadApiStatus()">🔄 Refresh Status</button>
        </div>
    </div>

    <script>
        async function loadApiStatus() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');
            
            loading.style.display = 'block';
            content.style.display = 'none';
            
            try {
                const response = await fetch('/api/v1/api-status');
                const data = await response.json();
                
                populateSummary(data.summary);
                populateCategories(data.categories);
                
                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (error) {
                loading.innerHTML = '❌ Failed to load API status';
                console.error('Error loading API status:', error);
            }
        }
        
        function populateSummary(summary) {
            const summaryGrid = document.getElementById('summaryGrid');
            const overallProgress = document.getElementById('overallProgress');
            
            summaryGrid.innerHTML = `
                <div class="summary-card">
                    <div class="summary-number">${summary.total_apis}</div>
                    <div class="summary-label">Total APIs</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" style="color: #00ff41;">${summary.configured_apis}</div>
                    <div class="summary-label">Configured</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" style="color: #00b4d8;">${summary.configuration_percentage}%</div>
                    <div class="summary-label">Completion</div>
                </div>
                <div class="summary-card">
                    <div class="summary-number" style="color: ${summary.overall_status === 'healthy' ? '#00ff41' : '#ffbd2e'};">${summary.required_configured}/${summary.required_apis}</div>
                    <div class="summary-label">Required APIs</div>
                </div>
            `;
            
            overallProgress.style.width = `${summary.configuration_percentage}%`;
        }
        
        function populateCategories(categories) {
            const categoriesGrid = document.getElementById('categoriesGrid');
            
            categoriesGrid.innerHTML = Object.values(categories).map(category => `
                <div class="category-section">
                    <div class="category-header">
                        <div class="category-title">${category.name}</div>
                        <div class="category-stats">
                            <div class="stat-item">
                                <div class="stat-number">${category.configured}</div>
                                <div class="stat-label">Active</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${category.total}</div>
                                <div class="stat-label">Total</div>
                            </div>
                        </div>
                    </div>
                    <div class="api-list">
                        ${category.apis.map(api => `
                            <div class="api-item ${getApiItemClass(api)}">
                                <div class="api-name">${api.name}</div>
                                <div class="api-status ${getStatusClass(api)}">${api.status}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
        
        function getApiItemClass(api) {
            if (api.configured) return 'configured';
            if (api.required) return 'missing-required';
            return 'optional-missing';
        }
        
        function getStatusClass(api) {
            if (api.status === 'active') return 'status-active';
            if (api.status === 'missing') return 'status-missing';
            return 'status-optional';
        }
        
        // Load data on page load
        loadApiStatus();
        
        // Auto-refresh every 30 seconds
        setInterval(loadApiStatus, 30000);
    </script>
</body>
</html>
