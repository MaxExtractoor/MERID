<!DOCTYPE html>
<html>
<head>
    <title>Trading Volume Test</title>
</head>
<body>
    <h1>Trading Volume Test</h1>
    <div id="test-results">Loading...</div>
    
    <script>
        async function testTradingVolume() {
            try {
                const response = await fetch('http://127.0.0.1:8011/api/v1/analytics/dashboard');
                const data = await response.json();
                
                // Test the convertMetricsToKeyMetrics function logic
                const metrics = data.metrics || [];
                const keyMetrics = {};
                
                metrics.forEach(metric => {
                    switch(metric.name) {
                        case 'trading_volume':
                            keyMetrics.trading_volume = metric.value;
                            break;
                    }
                });
                
                document.getElementById('test-results').innerHTML = `
                    <h2>API Response:</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <h2>Processed Trading Volume:</h2>
                    <p>Trading Volume: ${keyMetrics.trading_volume || 'NOT FOUND'}</p>
                    
                    <h2>Status:</h2>
                    <p>${keyMetrics.trading_volume ? '✅ SUCCESS - Trading volume data found!' : '❌ FAILED - No trading volume data'}</p>
                `;
                
            } catch (error) {
                document.getElementById('test-results').innerHTML = `
                    <h2>Error:</h2>
                    <p>${error.message}</p>
                `;
            }
        }
        
        testTradingVolume();
    </script>
</body>
</html>
