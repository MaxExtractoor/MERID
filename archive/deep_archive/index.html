<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MERID Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: #38bdf8; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        .input-group { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 20px; box-sizing: border-box; }
        button { background: #22c55e; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #16a34a; }
        #status { font-style: italic; color: #94a3b8; margin-top: 10px; }
        .feed-container { background: #020617; border-radius: 12px; padding: 20px; border: 1px solid #1e293b; min-height: 200px; }
        .feed-item { border-left: 4px solid #38bdf8; background: #1e293b; padding: 15px; margin-bottom: 10px; border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MERID — Blind Consensus Engine</h1>
        <div class="input-group">
            <label>Source:</label>
            <input type="text" id="source" value="user">
            
            <label>Payload (Signal/Question):</label>
            <textarea id="payload" rows="4" placeholder="e.g. BTC breaking $105,000..."></textarea>
            
            <button onclick="submitEnergy()">Submit Energy ? Consensus</button>
            <div id="status">Ready.</div>
        </div>

        <div class="feed-container" id="feed">
            <div style="color: #475569; text-align: center;">Live agent results will appear here...</div>
        </div>
    </div>

    <script>
        const feed = document.getElementById('feed');
        const statusMsg = document.getElementById('status');

        // WebSocket for live updates
        const ws = new WebSocket('ws://localhost:8000/ws');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `<strong>${data.source.toUpperCase()}</strong>: ${data.payload}<br>
                              <small style="color:#38bdf8">Approved: ${data.approved} | Consensus: ${data.consensus_score}</small>`;
            feed.prepend(item);
        };

        async function submitEnergy() {
            const source = document.getElementById('source').value;
            const payload = document.getElementById('payload').value;
            statusMsg.innerText = "Submitting to swarm...";

            try {
                const response = await fetch('http://localhost:8000/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source, payload })
                });
                const result = await response.json();
                statusMsg.innerText = "Success: " + result.message;
                document.getElementById('payload').value = ""; // Clear box
            } catch (err) {
                statusMsg.innerText = "Error: Could not connect to backend.";
            }
        }
    </script>
</body>
</html>
