# ═══════════════════════════════════════════════════════════════════════
# Trade-vs-Hold Decision Configuration
# ═══════════════════════════════════════════════════════════════════════
# LEGACY CONFIGURATION - For non-crypto, non-15m agents only.
#
# For Kalshi 15m crypto agents (BTC_15M, ETH_15M, SOL_15M, XRP_15M, DOGE_15M):
#   - Edge thresholds: Use config/crypto_threshold_matrix.yaml (SINGLE SOURCE OF TRUTH)
#   - Risk limits: Use config/profiles/kalshi_crypto_15m.yaml (SINGLE SOURCE OF TRUTH)
#   - This file's edge/risk values are NOT used by 15m crypto agents
#
# Single source of truth for all gating thresholds that determine whether
# the system trades or holds on any given cycle.  Every value here was
# previously a hard-coded constant scattered across trading_agent.py,
# strategy.py, and risk.py.
#
# Override hierarchy (highest wins):
#   1. Environment variable  (e.g. MERID_TH_WARMUP_MIN_SECONDS=20)
#   2. Per-agent YAML block  (kalshi_agent_grid.yaml → agent.trade_hold)
#   3. This file (global defaults)
#
# Env var naming convention: MERID_TH_<SNAKE_UPPER_KEY>
# ═══════════════════════════════════════════════════════════════════════

# ── Feature gate ──────────────────────────────────────────────────────
# Master switch: when false the Decision pipeline is bypassed and the
# legacy code path runs unmodified (safe rollback).
enabled: true

# ── Warmup / lifecycle (ENV-DRIVEN) ────────────────────────────────────
warmup:
  min_seconds: ${MERID_WARMUP_MIN_SECONDS:-15.0}
  max_seconds: ${MERID_WARMUP_MAX_SECONDS:-90.0}
  max_stagger_seconds: ${MERID_WARMUP_MAX_STAGGER:-30.0}
  min_cycles_for_data_ready: ${MERID_WARMUP_MIN_CYCLES:-1}

# ── Session ───────────────────────────────────────────────────────────
session:
  maintenance_day: 3           # Thursday (0=Mon)
  maintenance_start_et: "03:00"
  maintenance_end_et: "05:00"

# ── Entry window (ENV-DRIVEN) ──────────────────────────────────────────
entry_window:
  expiry_proximity_guard_seconds: ${MERID_EXPIRY_PROXIMITY_GUARD:-90}
  expiry_caution_zone_seconds: ${MERID_EXPIRY_CAUTION_ZONE:-120}

# ── Strategy thresholds (ENV-DRIVEN - aligns with Top 3 / 1-2% strategy) ─
strategy:
  min_edge_early: ${MERID_MIN_EDGE_EARLY:-0.08}
  min_edge_mid: ${MERID_MIN_EDGE_MID:-0.07}
  min_edge_late: ${MERID_MIN_EDGE_LATE:-0.06}
  min_edge_terminal: ${MERID_MIN_EDGE_TERMINAL:-0.06}
  min_arb_edge: ${MERID_MIN_ARB_EDGE:-0.005}
  min_confidence: ${MERID_MIN_CONFIDENCE:-0.45}  # Lowered from 0.60 for live trading
  min_volume: ${MERID_MIN_VOLUME:-0}
  min_open_interest: ${MERID_MIN_OPEN_INTEREST:-0}
  snapshot_stale_seconds: ${MERID_SNAPSHOT_STALE_SECONDS:-120}

# ── Consensus / swarm (ENV-DRIVEN) ────────────────────────────────────
consensus:
  solo_wait_seconds: ${MERID_SOLO_WAIT_SECONDS:-0.0}
  solo_trades_cap: ${MERID_SOLO_TRADES_CAP:-3}
  solo_wall_seconds: ${MERID_SOLO_WALL_SECONDS:-1800.0}
  consensus_wait_timeout_ms: ${MERID_CONSENSUS_WAIT_TIMEOUT:-500}

# ═══════════════════════════════════════════════════════════════════════════
# Risk / pre-trade (DERIVED from Kalshi bankroll, was hardcoded)
# CRITICAL: 1-2% TOTAL CYCLE RISK CAP (Pass 8 Invariant)
# These are PER-MARKET CAPS, not per-cycle allocations.
# TopNAllocator enforces the 1-2% TOTAL across all markets in a cycle.
# 3 markets × 2% = 6% is STRICTLY FORBIDDEN.
# ═══════════════════════════════════════════════════════════════════════════
risk:
  max_contracts_per_order: 50      # Absolute safety cap (contracts are cheap on Kalshi)
  max_contracts_per_market: 0    # 0 = derive: 1 contract per $10 bankroll, max 500
  min_order_size: 1
  max_order_size: 0              # 0 = derive: 1% of bankroll / price, max 100
  # CAP: 1% per market (TopNAllocator ensures 1-2% TOTAL across all markets)
  # 2% per market × 3 markets = 6% FORBIDDEN. 1% max keeps us within 1-2% total.
  max_notional_per_market_usd: 0   # 0 = derive: 1% of bankroll CAP (was 2%/$500)
  # CAP: 2% per event absolute max (never 5% - that would cause major losses)
  max_notional_per_event_usd: 0    # 0 = derive: 2% of bankroll MAX CAP (was 5%/$1000)
  # HARD CAP: Never exceed 50% of bankroll total (safety limit, not target)
  max_total_notional_usd: 0      # 0 = derive: 50% of bankroll MAX CAP (was $5000)
  max_daily_loss_usd: 0          # 0 = derive: 5% of bankroll (was $500)
  max_open_markets: 0            # 0 = derive: 1 per $50 bankroll, max 50
  max_orders_per_minute: 30      # Rate limit (not bankroll-scaled)
  max_orders_per_hour: 200      # Rate limit (not bankroll-scaled)
  min_post_fee_edge: 0.01        # Minimum post-fee edge (fraction)
  tick_size_cents: 1
  # 2026-07-11: Updated from 10c to 30c to align with dynamic threshold system canonical default
  max_spread_cents: 30
  max_slippage_cents: 3
  min_depth_contracts: 1

# ── Per-window limits ─────────────────────────────────────────────────
order_limits:
  max_orders_per_window: 10  # Default; overridden per-agent in grid YAML

# ── Consecutive error circuit breaker ─────────────────────────────────
error_handling:
  max_consecutive_errors: 5  # Pause agent after this many consecutive cycle errors

# ── Observability ─────────────────────────────────────────────────────
logging:
  log_every_decision: true       # Emit [PM_DECISION] for every decision
  log_hold_detail: true          # Include full detail string in HOLD logs
  log_config_snapshot: false     # Include config thresholds (verbose — enable for debug)
  cycle_trace_no_action: true    # Include NO_ACTION buckets in PM_CYCLE_TRACE
  cycle_trace_consensus: true    # Include consensus hold detail in PM_CYCLE_TRACE
