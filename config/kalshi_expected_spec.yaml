# Kalshi Expected Contract Specification
# 
# This file contains the expected Kalshi API specification for contract
# sizing, fixed-point fields, and other risk-relevant metadata.
# 
# To update this file after a Kalshi API change:
#   python -m merid.tools.kalshi_spec_snapshot --mode snapshot --output config/kalshi_expected_spec.yaml
#
# Validation:
#   python -m merid.tools.kalshi_spec_snapshot --mode validate --fail-on-mismatch

# Price fields (in cents)
min_price_cents: 1
max_price_cents: 99
tick_size_cents: 1

# Size fields
min_contracts: 1
max_contracts: 10000
contract_multiplier: 1

# Fixed-point field scales
# count_fp: count in cents * scale (typically 100 for cents)
count_fp_scale: 100
# price_fp: price in cents * scale (typically 100 for cents)
price_fp_scale: 100

# Order types (less risk-relevant, but good to track)
order_types:
  - limit
  - market

# Time in force options (less risk-relevant, but good to track)
time_in_force:
  - GTC  # Good Till Cancel
  - IOC  # Immediate Or Cancel
  - FOK  # Fill Or Kill
