# ═══════════════════════════════════════════════════════════════════════════
# Market Regime Gate Configuration
# ═══════════════════════════════════════════════════════════════════════════
# Config-driven crypto basket flatness filter — prevents trading in dead markets.
#
# Wired upstream of order intent creation and at execution adapter ingress.
# See: merid/market_regime/gate.py, merid/market_regime/config.py
#
# Override path: MERID_MARKET_REGIME_CONFIG_PATH

market_regime_gate:
  enabled: true
  shadow_mode: false  # Set true for Phase 1 (log only, don't block)
  universe:
    - BTC
    - ETH
    - SOL
    - XRP
    - DOGE

  lookback:
    bar_interval: "15m"
    bars: 16  # 4 hours of 15m bars

  flatness:
    # ENV-DRIVEN: Flatness detection thresholds
    max_abs_return_pct: ${MERID_FLAT_MAX_ABS_RETURN_PCT:-0.75}
    min_atr_pct: ${MERID_FLAT_MIN_ATR_PCT:-0.35}
    min_volume_ratio: ${MERID_FLAT_MIN_VOLUME_RATIO:-0.80}

  basket_rules:
    # ENV-DRIVEN: Basket blocking/reduction rules
    block_if_flat_count_gte: ${MERID_BLOCK_IF_FLAT_COUNT:-4}
    reduce_if_flat_count_gte: ${MERID_REDUCE_IF_FLAT_COUNT:-3}

  trend_confirmation:
    # ENV-DRIVEN: Trend confirmation thresholds
    adx_min: ${MERID_ADX_MIN:-18}
    breakout_range_pct_min: ${MERID_BREAKOUT_RANGE_PCT_MIN:-1.2}

# ═══════════════════════════════════════════════════════════════════════════
# Phase Rollout Guide
# ═══════════════════════════════════════════════════════════════════════════
#
# Phase 1 (Shadow Mode):
#   shadow_mode: true
#   → Gate evaluates and logs but never blocks. Compare would_block vs actual.
#
# Phase 2 (Soft Enforcement):
#   shadow_mode: false
#   → Blocks NEW ENTRIES only. Position management and exits still allowed.
#
# Phase 3 (Full Enforcement):
#   (same config, full blocking in place)
#
# ═══════════════════════════════════════════════════════════════════════════
