# ═══════════════════════════════════════════════════════════════════════
# Trade-Hold Config — LIVE Profile
# ═══════════════════════════════════════════════════════════════════════
# DEPRECATED: This profile is NOT used by the production 15m Kalshi crypto stack.
#
# For Kalshi 15m crypto agents (BTC_15M, ETH_15M, SOL_15M, XRP_15M, DOGE_15M):
#   - Edge thresholds: Use config/profiles/kalshi_crypto_15m_v2.yaml (SINGLE SOURCE OF TRUTH)
#   - Risk limits: Use config/profiles/kalshi_crypto_15m_v2.yaml (SINGLE SOURCE OF TRUTH)
#   - Fixed $1 exposure cap: Enforced via risk_policy.fixed_exposure_cap_usd: 1.00
#   - All configuration: Use config/profiles/kalshi_crypto_15m_v2.yaml (SINGLE SOURCE OF TRUTH)
#
# This file is retained for backward compatibility with non-crypto, non-15m agents only.
# DO NOT use this file for 15m crypto trading configuration.
# ═══════════════════════════════════════════════════════════════════════

# DEPRECATED: Not used by production 15m Kalshi crypto stack
# See config/profiles/kalshi_crypto_15m_v2.yaml for production configuration
enabled: false

# All values below are IGNORED for kalshi_crypto_15m_v2 profile
# They are retained only for legacy agent compatibility

warmup:
  min_seconds: 30.0
  max_seconds: 120.0
  max_stagger_seconds: 15.0
  min_cycles_for_data_ready: 2

entry_window:
  expiry_proximity_guard_seconds: 120
  expiry_caution_zone_seconds: 180

strategy:
  min_edge_early: 0.05
  min_edge_mid: 0.04
  min_edge_late: 0.04
  min_edge_terminal: 0.05
  min_arb_edge: 0.01
  min_confidence: 0.45
  min_volume: 0
  min_open_interest: 0
  snapshot_stale_seconds: 90

consensus:
  solo_wait_seconds: 0.0
  solo_trades_cap: 2
  solo_wall_seconds: 900.0
  consensus_wait_timeout_ms: 500

risk:
  max_contracts_per_order: 10
  max_contracts_per_market: 50
  min_order_size: 1
  max_order_size: 10
  max_notional_per_market_usd: 100.0
  max_notional_per_event_usd: 200.0
  max_total_notional_usd: 500.0
  max_daily_loss_usd: 50.0
  max_open_markets: 10
  max_orders_per_minute: 10
  max_orders_per_hour: 60
  min_post_fee_edge: 0.02
  tick_size_cents: 1
  max_spread_cents: 30
  max_slippage_cents: 2
  min_depth_contracts: 1

order_limits:
  max_orders_per_window: 5

error_handling:
  max_consecutive_errors: 3

logging:
  log_every_decision: true
  log_hold_detail: true
  log_config_snapshot: true
  cycle_trace_no_action: true
  cycle_trace_consensus: true
