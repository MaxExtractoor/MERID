    rolling_4h_halt_pct: 0.09  # 9% halt
  XRP:
    rolling_1h_halt_pct: 0.06  # 6% halt
    rolling_4h_halt_pct: 0.09  # 9% halt
  # DOGE: Most volatile, tightest limits
