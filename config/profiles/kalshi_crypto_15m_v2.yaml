# ── Operation Mode (test vs prod) ────────────────────────────────────────────
# Controls daily loss limit and other risk parameters for testing vs production.
# - test: Relaxed daily loss limit for realistic live testing (e.g., 10% of bankroll)
# - prod: Conservative daily loss limit for production (e.g., 5% of bankroll)
# Set via environment variable MERID_OPERATION_MODE (default: prod)
operation_mode: prod  # Options: test, prod

# ── Sandbox/Dry-Run Mode (Extra 1) ─────────────────────────────────────────
# When enabled, orders are logged but NOT submitted to Kalshi API.
# Useful for testing strategies without risking real capital.
# Set to true for paper/demo mode, false for live trading.
dry_run: false

# ── Catalog Staleness Enforcement ───────────────────────────────────────────
# Controls whether catalog staleness (catalog_age > 60s) can halt trading.
# For kalshi_crypto_15m_v2, catalog is updated every cycle and per-market
# expiry/MD/depth checks provide sufficient safety. Catalog staleness is
# purely informational for this profile.
catalog_staleness_enforced: false

# ── Signal Mode Configuration ───────────────────────────────────────────────
# Controls the signal generation mode for trading decisions.
# - mean_reversion: Trade against overextensions (RSI overbought/oversold zones)
# - momentum_fvg: Trade with trend using Fair Value Gaps and Order Book Imbalance
# - hybrid: Allow both modes (default for maximum opportunity capture)
# - price_based: Turbine research winner - buy YES when price <= 0.50, sell when price >= 0.70
signal_mode: price_based  # Options: mean_reversion, momentum_fvg, hybrid, price_based

# ── Phase 1 Profitability Enhancements ─────────────────────────────────────────
# YES/NO Sum Arbitrage, Market Making, and Correlation Tracking

# YES/NO Sum Arbitrage Configuration
# When YES+NO < 100c, buy both sides for risk-free profit
yes_no_arbitrage:
  enabled: true  # Set to true to enable arbitrage execution
  threshold_cents: 3  # Minimum arbitrage edge to execute (3c = 3%)
  max_size_contracts: 10  # Max contracts per arbitrage trade
  execution_timeout_ms: 500  # Max time to execute both sides (milliseconds)
  description: "YES/NO sum arbitrage: buy both sides when YES_ask + NO_bid < 100c"

# Market Making Configuration
# Liquidity provision to earn spread income
market_making:
  enabled: true  # Set to true to enable market making
  quoting_mode: "two_sided"  # Options: one_sided, two_sided
  spread_cents: 2  # Target spread in cents
  inventory_limit_contracts: 50  # Max inventory per asset
  skew_adjustment: true  # Adjust quotes based on inventory imbalance
  description: "Market making: provide liquidity and earn spread income"

# Correlation Tracking Configuration
# Reduce exposure when assets are highly correlated
correlation_tracking:
  enabled: true  # Set to true to enable correlation tracking
  threshold: 0.5  # Correlation threshold for exposure reduction
  max_reduction: 0.4  # Reduce to 40% of combined cap at perfect correlation
  window_days: 30  # Rolling window for correlation calculation
  description: "Correlation tracking: reduce exposure when assets are highly correlated"

# ── Momentum/FVG Mode Parameters ───────────────────────────────────────────
# Parameters for momentum_fvg signal mode (when enabled)
# Tuned specifically for Kalshi 15m crypto microstructure
momentum_fvg:
  # RSI thresholds for momentum (not overextended, but directional)
  momentum_rsi_long_min: 55  # Bullish momentum: RSI > 55
  momentum_rsi_short_max: 45  # Bearish momentum: RSI < 45
  
  # MACD histogram thresholds
  momentum_min_macd_hist_long: 0  # For longs: MACD histogram >= 0
  momentum_min_macd_hist_short: 0  # For shorts: MACD histogram <= 0
  
  # Order Book Imbalance (OBI) parameters - Kalshi-specific per-asset thresholds
  # OBI = (BidContracts_10c - AskContracts_10c) / (BidContracts_10c + AskContracts_10c)
  obi_min: 0.25  # Minimum absolute OBI to qualify as directional (not noise)
  obi_persistence_min: 0.6  # Minimum fraction of snapshots with consistent OBI sign (60%)
  obi_persistence_window_sec: 10  # Time window for persistence check (10 seconds)
  obi_ewma_alpha: 0.15  # EWMA smoothing factor (0.15 = ~7 snapshot effective window)
  
  # Per-asset OBI strong thresholds (Kalshi books are thinner than spot)
  obi_strong_btc: 0.55  # BTC: strong imbalance threshold
  obi_strong_eth: 0.55  # ETH: strong imbalance threshold
  obi_strong_sol: 0.45  # SOL: strong imbalance threshold (thinner book)
  obi_strong_xrp: 0.45  # XRP: strong imbalance threshold (thinner book)
  obi_strong_doge: 0.45  # DOGE: strong imbalance threshold (thinner book)
  
  # Per-asset EWMA alpha (tuned per asset depth/flicker)
  obi_ewma_alpha_btc: 0.15  # BTC: more depth, more flicker, smoother
  obi_ewma_alpha_eth: 0.15  # ETH: more depth, more flicker, smoother
  obi_ewma_alpha_sol: 0.20  # SOL: less depth, quicker reaction
  obi_ewma_alpha_xrp: 0.20  # XRP: less depth, quicker reaction
  obi_ewma_alpha_doge: 0.20  # DOGE: less depth, quicker reaction
  
  # Fair Value Gap (FVG) parameters - Kalshi 15m constraints
  fvg_max_age_bars: 4  # Maximum age of FVG in bars (15m bars, 4 bars = 60min)
  fvg_min_size_ticks: 3  # Minimum FVG size in ticks to consider valid
  fvg_min_time_to_expiry_min: 30  # Minimum time to expiry to use FVG for new entries (30min)
  
  # Trend confirmation
  require_ema_stack: true  # Require EMA stack alignment (fast > slow for longs)
  require_price_vs_ema50: true  # Require price above/below EMA50 for direction
  
  # Liquidity-aware size scaling (Kalshi-specific tiers)
  # Based on depth_yes_10c and depth_no_10c from orderbook
  liquidity_tiers:
    high_threshold: 200  # High liquidity: >=200 contracts (deep BTC 15m)
    high_size_factor: 1.0  # Use full profile risk
    medium_threshold: 80  # Medium liquidity: 80-200 contracts
    medium_size_factor: 0.75  # 75% of profile risk
    low_threshold: 40  # Low liquidity: 40-80 contracts
    low_size_factor: 0.5  # 50% of profile risk
    ultra_low_threshold: 25  # Ultra-low liquidity: 25-40 contracts
    ultra_low_size_factor: 0.25  # 25% of profile risk
    min_threshold: 25  # Below this: no new entries
    min_size_factor: 0.0  # No new entries
  
  # Spread guard interaction with momentum
  # If spread exceeds this, require higher OBI persistence for momentum entries
  spread_gate_cents: 40  # From guardrails_max_spread_cents
  spread_gate_obi_persistence_boost: 0.75  # Require 75% persistence if spread is wide

# ── Price-Based Strategy Parameters (Turbine Research Winner) ───────────────
# Simple price-based strategy that showed +56.6% ROI in Turbine backtests
# Buy YES when market price is cheap, sell when it recovers
# RELAXED: Widen thresholds to 0.50/0.70 to match Turbine winner (custom_price_buy050_sell070)
# Previous 0.45/0.55 gap was too tight; 0.50/0.70 aligns with most profitable 2026 strategy
price_based:
  buy_threshold: 0.50  # Buy YES when price <= 0.50 (betting price goes up)
  sell_threshold: 0.70  # Buy NO when price >= 0.70 (betting price goes down)

# ── Sentiment Isolation (Single Source of Truth) ────────────────────────────
# For kalshi_crypto_15m_v2 profile, sentiment-based trading is disabled.
# This is the single source of truth for sentiment configuration in the 15m stack.
# All other sentiment-related code paths (env vars, trading_agent nulling, etc.)
# are considered redundant and should defer to this configuration.
sentiment_isolation:
  enable_sentiment_execution: false  # Sentiment-based trading disabled for 15m crypto
  sentiment_mode: disabled  # Explicitly set to disabled

# ── Drawdown Semantics ───────────────────────────────────────────────────────
# Time horizon: "since process start" (not rolling window)
# - Peak equity tracks highest equity since FastAPI startup
# - Drawdown is computed as (peak - current) / peak
# - Fresh start resets peak equity to current equity
#
# PnL basis: "equity including open positions" (realized + unrealized)
# - Uses Kalshi account balance (total equity)
# - Not based on realized PnL only
#
# Deposits/Withdrawals:
# - Deposits: treated as PnL (increase equity, may update peak)
# - Withdrawals: treated as PnL (decrease equity, peak unchanged)
# - This ensures drawdown reflects actual account performance
#
# Fresh Start Behavior:
# - When MERID_FRESH_START=1, peak_equity resets to current_equity
# - This prevents old drawdown state from persisting across sessions
drawdown_semantics:
  time_horizon: "since_process_start"
  pnl_basis: "equity_including_positions"
  deposit_withdrawal_treatment: "as_pnl"

# ── Global Capital and Cycle Risk ────────────────────────────────────────
# Capital for this strategy. Set to 0 to derive from live Kalshi bankroll API.
# For paper/demo mode, you can set a fixed value (e.g., 10000.0).
# For live trading, set to 0 to use actual account balance.
# For validation/calibration mode, set to fixed value (e.g., 50.0) to ensure consistent caps regardless of live balance.
capital_usd: 0  # Live mode: derive from live Kalshi equity via router/bankroll engine

# Minimum trade size (floor) - single source of truth for all agents
min_notional_usd: 0.50  # INCREASED: $0.50 minimum notional per trade (was $0.05, too low for meaningful sizing)
min_contracts: 1  # Minimum 1 contract per trade (Kalshi venue invariant)

# Fallback pricing configuration
# When live market data is unavailable, the system can use a fallback price (50c)
# DISABLED: Fallback trades are not allowed in production (Task 32: Remove temporary flag)
# Live market data is required for all trading decisions
allow_fallback_trades: false  # DISABLED: Require live market data
max_fallback_notional_usd: 0.35  # If fallback allowed, cap at min_notional (unused when disabled)
max_fallback_cycles: 0  # DISABLED: No fallback cycles allowed

# Maximum risk per cycle as percentage of capital
# RELAXED: Increased to 10% to allow more trades and reduce cycle cap blocking
max_cycle_risk_pct:
  value: 0.10  # Increased from 2.5% to 10% to reduce cycle cap blocking
  dynamic: bankroll  # Computed from live bankroll via RiskEnvelopeService
  description: "Maximum risk per cycle as percentage of capital (computed from bankroll)"
  
# CRITICAL FIX: Added maximum total risk cap for production safety
max_total_risk_pct:
  value: 0.06  # 6% total risk cap (conservative for production)
  description: "Maximum total risk as percentage of capital (production safety)"

# Optional absolute cap on cycle risk (overrides percentage if set)
# Set to 0 to use percentage-based only
max_cycle_risk_usd: 0.0

# ── Venue-Level Caps (Kalshi) ──────────────────────────────────────────────
# These caps are derived as percentages of capital, NOT hardcoded values.
# This ensures risk scales with actual account balance.
venue:
  name: kalshi
  # INCREASED: venue_max_total_notional_pct to 25% to accommodate 5 assets at 5% each
  # Primary risk controls are now:
  # - per_trade_risk_pct (0.8%): primary sizing control
  # - per-asset max_notional_pct (5%): secondary per-asset limits (increased from 2%)
  # - max_cycle_risk_pct (2.5%): aggregate cycle-level control
  # - max_total_risk_pct (6%): aggregate total exposure control
  max_total_notional_pct:
    value: 0.25  # INCREASED: 25% total venue cap (was 15%, now 5% * 5 assets = 25%)
    static: profile
    description: "Maximum total notional as percentage of capital (increased for 5 assets at 5% each)"
  
  # Rate limits (not bankroll-scaled)
  max_orders_per_minute:
    value: 30
    static: profile
    description: "Maximum orders per minute (static for this profile)"
  max_orders_per_hour:
    value: 300
    static: profile
    description: "Maximum orders per hour (static for this profile)"

# ── Universe Liquidity Filters ───────────────────────────────────────────────
# Liquidity thresholds for the KalshiUniverse layer (coarse prefilter).
# These are tuned for the 15m crypto universe (exactly 5 markets per asset cycle).
# More stringent microstructure checks are applied downstream in candidate optimizer/risk layer.
universe:
  min_volume: 5  # Minimum 5 contracts volume (relaxed from default 50 for 15m crypto)
  min_open_interest: 1  # Minimum 1 contract open interest (relaxed from default 10)
  max_spread_cents: 50  # RELAXED: Maximum 50 cent spread (increased from 30 to match guardrails and allow more trades)
  description: "Coarse liquidity prefilter for 15m crypto markets - tuned for exactly 5 markets per asset"

# ── Throttling (Order Rate Limits) ───────────────────────────────────────────
# Global and per-asset throttling to prevent order spam and ensure orderly execution.
# These replace hardcoded values in agent_grid_15m.py with profile-driven configuration.
# BALANCED SETTINGS: Optimized based on industry comparison (Polymarket 15m bot uses 30s with 93% WR)
throttling:
  global_orders_window_sec: 60  # Rolling window for global order limit (seconds)
  global_orders_limit: 5  # REDUCED: Max 5 orders per minute globally (was 10 - safer exposure across 5 assets)
  per_asset_cooldown_sec: 0  # REMOVED: Per-asset cooldown is anti-pattern per 2026 industry research. Rely on global throttling (5/min, 5/15m window, 1/cycle) and API-level rate limiting with exponential backoff.
  per_strip_notional_usd: 0.0  # Max notional per strip (0.0 = disabled, set if needed)
  max_orders_per_15m_window: 5  # PRIMARY: Max 5 orders total per 15m window across all assets (prevents overtrading)
  
  # REMOVED: Conflicting top-N limits - now handled by guardrails section (single source of truth)
  # - per_strip_order_limit: replaced by guardrails.max_orders_per_cycle
  # - max_trades_per_cycle_global: replaced by guardrails.max_orders_per_cycle
  # - max_trades_per_cycle_asset: replaced by guardrails.max_orders_per_cycle
  
  cooldown_after_loss_cycles: 2  # No new entry for 2 cycles (30s) after a loss in that asset (relaxed from 4)

# ── Failsafe Configuration ───────────────────────────────────────────────────
# Emergency brake when market data is degraded (catalog stuck but MD fresh).
# This is separate from normal strip limits and should be clearly logged when active.
failsafe:
  max_contracts_per_order: 1  # Max contracts per order when in failsafe mode (emergency brake)

