    # Depth thresholds (contracts at best price) - single source of truth for 15m stack
    # CRITICAL FIX: Set to 1 contract since we only trade 1 contract per 15m window per asset
    # The gating condition is "can I fill 1 contract within slippage budget?" not "does book have 2-3 contracts"
    min_depth_yes: 1  # Minimum YES depth at best bid (contracts) - aligned with 1 contract per order
    min_depth_no: 1  # Minimum NO depth at best ask (contracts) - aligned with 1 contract per order

# ── Per-Agent Caps ─────────────────────────────────────────────────────────
# 2026-07-08 UPDATE: Percentage-based agent caps DISABLED in favor of fixed $1 exposure model
# max_notional_pct DISABLED - using fixed $1 exposure cap instead
agent_defaults:
  # max_notional_pct DISABLED - using fixed $1 exposure cap instead
  max_orders_per_window: 24  # Max orders per trading window (2026-07-11: increased to 24 for 15m opportunity capture)
  max_yes_position: 5  # INCREASED: Max YES contracts per side (up from 3)
  max_no_position: 5  # INCREASED: Max NO contracts per side (up from 3)
  max_concurrent_trades: 8  # INCREASED: Max 8 concurrent trades (was 5, for more opportunities)
  
  # Entry window (time before expiry to start trading)
  # Kalshi 15m markets only exist ~15 minutes before expiry
  # Realistic trading window is 2-12 minutes (sweet spot: 5-10 minutes)
  minutes_before_expiry: 12
  cutoff_minutes_before_expiry: 0  # Trade full 15m window (no cutoff)

# ── Edge / Confidence Thresholds ────────────────────────────────────────────
# Edge thresholds are defined per-asset in the assets section above.
# For kalshi_crypto_15m_v2, crypto_threshold_matrix.yaml is profile-guarded and NOT used.
# All edge configuration comes from this YAML file only.
confidence:
  # PROFILE-GUARD: crypto_threshold_matrix.yaml is disabled for kalshi_crypto_15m_v2
  use_crypto_threshold_matrix: false
  profile_name: null  # Not used when use_crypto_threshold_matrix=false
  # 2026-07-07 REVERT: Confidence threshold gate for high-probability trades
  # REVERTED from 0.80 to 0.65 - 80% threshold was blocking all trades
  # Trade scenario simulation suggested 80% for optimal profitability, but actual signal generation
  # does not achieve this confidence level in practice. 65% allows trades to execute.
  # Industry standard (voltage-kalshi): 0.55, Predict & Profit: 0.30
  min_confidence_threshold: 0.65  # REVERTED from 0.80 to 0.65 (minimum confidence to execute trade)

# ── Tiered Edge Band Configuration ───────────────────────────────────────────
# TIERED STRUCTURE: 0.5% watch, 0.5% small, ≥0.5% standard
# 2026-07-07 OPTIMIZATION: Reduced thresholds based on trade scenario simulation results
# Simulation showed 0.5% edge achieved 61.9 profitability score vs 52.2 at 3%
# Lower edge increases trade frequency and win rate (60.5% at 0.5% vs 55.3% at 3%)
# CRITICAL: Edge bands are the ACTUAL thresholds used (per-asset min_edge fields are ignored)
# MIN_EDGE HIERARCHY (from highest to lowest priority):
# 1. edge_bands.*.min_edge_pct - PRIMARY: Used for trade execution (watch/small/standard bands)
# 2. strategy_policy.min_edge - LEGACY: Not actively used, kept for compatibility
# 3. strategies.*.policy.min_edge - Strategy-specific: Used by individual strategies
# 4. Per-asset min_edge_early/mid/late/terminal - IGNORED: Legacy fields, not used
edge_bands:
  enabled: true  # Enable tiered edge band logic
  watch_band:
    min_edge_pct: 0.005  # 0.5% minimum edge for watch band (REDUCED from 0.8% based on simulation)
    max_edge_pct: 0.005  # 0.5% maximum edge for watch band (unified with min for consistency)
    action: "log_only"  # Log candidates but don't trade
    kelly_multiplier: 0.0  # No sizing in watch band
  small_band:
    min_edge_pct: 0.005  # 0.5% minimum edge for small band (REDUCED from 1.5% based on simulation)
    max_edge_pct: 0.01  # 1% maximum edge for small band (REDUCED from 3%)
    action: "trade_small"  # Trade with reduced size
    kelly_multiplier: 0.25  # 0.25x Kelly for small band
  standard_band:
    min_edge_pct: 0.005  # 0.5% minimum edge for standard band (REDUCED from 3% based on simulation)
    max_edge_pct: 1.0  # No upper limit
    action: "trade_standard"  # Trade with standard size
    kelly_multiplier: 0.50  # 0.5x Kelly for standard band
  
  # Optional: Override Kelly multipliers for this profile
  # If set, these override crypto_threshold_matrix.yaml
  kelly_multiplier_no_trade: 0.0
  kelly_multiplier_cautious: 0.5
  kelly_multiplier_quick_win: 0.6
  kelly_multiplier_confident: 1.0

# ── Dynamic Threshold Configuration ───────────────────────────────────────────────
# 2026-07-11: Dynamic regime-aware thresholds based on industry research
# Canonical thresholds used during normal market conditions (Momentum/Mean Reversion regimes)
# Crisis thresholds used during extreme volatility (13% of market time per research)
# Regime detection uses ATR%, correlation, and order flow features
# Reference: DYNAMIC_THRESHOLD_RESEARCH_AND_RECOMMENDATIONS.md

canonical:
  # Normal regime thresholds (87% of market time)
  price_range:
    min_cents: 10  # Lower bound (low-profit trap prevention)
    max_cents: 75  # 2026-07-12: Expanded to 75c - YES prices consistently 60-97c in current market conditions
  spread:
    max_cents: 30  # Canonical spread threshold (harmonized with 10-50c entry price sweet spot)
    min_gate_cents: 30  # Edge-dependent threshold (optimized for entry price sweet spot)
  liquidity:
    min_volume_24h: 500  # Minimum 24-hour volume for liquidity
    min_depth_top_of_book: 100  # Minimum depth at best bid/ask
    max_spread_cents: 30  # Coarse filter spread threshold

crisis:
  # Crisis regime thresholds (13% of market time - extreme volatility)
  # 2026-07-12: Aligned with expanded 10-75c range to match actual market conditions
  # Crisis regime uses same price range but relaxed spread/position sizing
  price_range:
    min_cents: 10  # Lower bound (aligned with canonical regime)
    max_cents: 75  # 2026-07-12: Expanded to 75c - YES prices consistently 60-97c in current market conditions
  spread:
    max_cents: 100  # Relaxed spread threshold (accommodates 60c-96c spreads observed in current conditions)
    min_gate_cents: 30  # Edge-dependent threshold (unchanged - optimized for entry price sweet spot)
  liquidity:
    min_volume_24h: 500  # Minimum 24-hour volume (unchanged)
    min_depth_top_of_book: 100  # Minimum depth at best bid/ask (unchanged)
    max_spread_cents: 100  # Coarse filter spread threshold (relaxed for crisis regime)

regime_detection:
  # Regime detection configuration
  enabled: true
  method: "ATR"  # Method: ATR (simpler, proven) or BELIEF_VOLATILITY (research-backed)
  lookback_periods: 14  # 14 periods for 15m = 3.5 hours of history
  hysteresis_periods: 3  # Require 3 consecutive periods before regime change (prevents flickering)
  thresholds:
    atr_pct:
      LOW: 1.0  # ATR% < 1% = low volatility regime
      NORMAL: 2.0  # ATR% 1-2% = normal volatility regime
      HIGH: 3.0  # ATR% 2-3% = high volatility regime
      EXTREME: 4.0  # ATR% > 3% = extreme volatility regime
  adjustment_factors:
    MOMENTUM:
      price_range_multiplier: 1.0  # No change to price range
      spread_multiplier: 1.2  # Slightly wider spread allowance
      position_size_multiplier: 1.0  # Full position size
    MEAN_REVERSION:
      price_range_multiplier: 1.0  # No change to price range
      spread_multiplier: 1.0  # Canonical spread threshold
      position_size_multiplier: 1.0  # Full position size
    CRISIS:
      price_range_multiplier: 1.0  # 2026-07-12: Keep canonical 10-50c range (no expansion)
      spread_multiplier: 3.3  # 30c → 100c (relaxed spread)
      position_size_multiplier: 0.5  # Reduce exposure by 50%

coarse_filters:
  # Hierarchical sequential gates for universe reduction
  # Order matters: cheap gates first, expensive gates later
  gates:
    - name: "tau_gate"
      enabled: true
      min_minutes: 5  # Minimum time to expiry
      max_minutes: 1440  # Maximum time to expiry (24 hours)
    - name: "asset_whitelist"
      enabled: true
      assets: ["BTC", "ETH", "SOL", "XRP", "DOGE"]
    - name: "price_range_gate"
      enabled: true
      dynamic: true  # Uses dynamic thresholds based on regime
    - name: "spread_gate"
      enabled: true
      dynamic: true  # Uses dynamic thresholds based on regime
    - name: "volume_depth_gate"
      enabled: true
      dynamic: false  # Uses static thresholds
    - name: "edge_gate"
      enabled: true
      min_implied_yield_pct: 50  # Minimum 50% annualized implied yield
      min_edge_vs_model_pct: 5  # Minimum 5% edge vs model prediction

# ── Guardrails (Legacy - Migrated to canonical/crisis above) ─────────────────────
# Pre-trade checks (not bankroll-scaled)
# 2026-07-02 OPTIMIZED: Based on research for 15m crypto markets
# Research findings: 15m markets have spreads 2-5c, profitable edge 1-2% post-fee
# Reference: https://www.indiehackers.com/post/building-a-stable-15-minute-trading-bot-for-polymarket-crypto-up-down-markets-563a14e882
# NOTE: These values are now dynamically set from canonical/crisis sections above
guardrails:
  max_spread_cents: 20  # 2026-07-12: ALIGNED with industry research - 20c max for 15m crypto (industry: 15-20c for short-duration markets)
  max_slippage_cents: 5  # INCREASED: Max 5 cents worse than best (research: 2-5c slippage acceptable for 15m markets)
  # CRITICAL FIX: Removed min_depth_contracts - use per-asset depth thresholds instead (single source of truth)
  # min_depth_contracts: 2  # REMOVED - inconsistent with per-asset min_depth_yes/min_depth_no values
  min_post_fee_edge: 0.015  # LOWERED: Minimum post-fee edge 1.5% (research: 2-2.5% net edge realistic, 1.5% floor for more opportunities)
  min_time_to_expiry_min: 2.0  # RELAXED: Minimum 2 minutes to expiry (120s, reduced from 2.5min for more 15m opportunities)
  max_dist_pct_trade: 2.5  # RELAXED: Maximum spot-strike distance percentage for trading (2.5% for better market coverage)
  min_contract_price_cents: 10  # 2026-07-12: Lower bound (10c) maintained for low-profit trap prevention
  max_contract_price_cents: 75  # 2026-07-12: Expanded from 50c to 75c - YES prices consistently 60-97c in current market conditions
  max_same_side_per_strip: 5  # RELAXED: Maximum same-direction positions per strip (increased from 4 to 5 for more opportunities)
  # REMOVED: Duplicate max_orders_per_cycle - now handled by throttling.max_orders_per_15m_window (single source of truth)
  min_edge_per_trade: 0.02  # UNIFIED: 2% base edge for maker orders (aligned with Kalshi's 1-2% maker requirement, research-backed)
  # Time trap prevention (entry window narrowing)
  # Aligned with TTE regimes from risk.tte_regime:
  # - NORMAL: > 10 minutes (allow entry)
  # - APPROACHING: 5-10 minutes (allow entry with tighter constraints)
  # - CRITICAL: 2-5 minutes (allow entry with very tight constraints)
  # - TERMINAL: < 0.5 minutes (block entry - relaxed from 2min to allow full window trading)
  # 2026-07-09: Relaxed min_entry_mins from 2.0 to 0.5 to allow trading throughout entire 15-minute window
  max_entry_mins: 15.0  # NORMAL: Maximum time to expiry for entry (15min - aligned with 15m market duration)
  min_entry_mins: 0.5   # TERMINAL: Minimum time to expiry for entry (0.5min - relaxed to capture early window opportunities)
  # Microstructure trap prevention
  # SIMPLIFIED: Single spread rule instead of complex edge-dependent mapping
  # For edge < 2%: do not trade (avoid low edge & wide spread)
  # For edge >= 2%: require spread <= 20c and edge >= 1.1x spread
  # 2026-07-10: ALIGNED to 20c to match universe.max_spread_cents (single source of truth)
  max_spread_for_edge:
    "default": 30  # 2026-07-10: ALIGNED to 30c - harmonizes with 10c-50c entry price sweet spot (industry research: 3-8c typical, 30c quality filter)
  depth_size_multiplier: 1.5  # Depth must be >= 1.5x order size (relaxed from 3.0x to reduce rejections)
  # Regime/drawdown trap prevention
  regime_cooldown_enabled: false  # DISABLED: Asset halting based on PnL performance (industry advises against variance-based changes, let drawdown limits handle risk)
  regime_cooldown_min_trades: 20  # RELAXED: Minimum trades before regime check (20 for more stable feedback - was 10)
  regime_cooldown_min_winrate: 0.45  # RELAXED: Minimum winrate threshold (45% - was 50%)
  regime_cooldown_max_loss_pct: 0.10  # RELAXED: Maximum loss percentage threshold (10% - was 5%)
  
  # Experimental slice configuration (DISABLED for fair asset treatment)
  # Previously applied only to BTC/ETH, creating asymmetric treatment
  experimental_price_band_enabled: false  # DISABLED: Fair treatment for all assets (was true for BTC/ETH only)
  experimental_tte_band_enabled: false  # DISABLED: Fair treatment for all assets (was true for BTC/ETH only)
  
  # Depth thresholds: per-asset values are single source of truth (min_depth_yes/min_depth_no per asset)
  # Removed tier-based thresholds to avoid confusion
  
  # NEW: Spread guard with edge override
  spread_guard_enabled: true  # Enable spread guard
  spread_guard_edge_multiplier: 1.1  # Require edge >= 1.1x spread to trade (relaxed from 1.5x)
  # 2026-07-12: ALIGNED with industry research - 8c minimum quality filter (industry: 8-10c for 15m crypto)
  min_spread_gate_cents: 8  # 2026-07-12: ALIGNED with industry research - 8c minimum quality filter (industry: 8-10c for 15m crypto)
  
  # Drawdown limits (percentage-based, not bankroll-scaled)
  # Drawdown is the primary hard cap; daily loss is optional/soft
  drawdown_halt_pct:
    value: 0.20  # RELAXED: Halt at 20% drawdown (increased from 15% to align with industry 25% standard)
    static: profile
    description: "Drawdown halt percentage (static for this profile)"
  drawdown_unwind_pct:
    value: 0.25  # RELAXED: Unwind at 25% drawdown (increased from 20% to align with industry 25% standard)
    static: profile
    description: "Drawdown unwind percentage (static for this profile)"
  
  # Position limit (total position value across all assets)
  # This is a derived kill switch that auto-resets when position drops below limit
  # Set to 0 to disable (rely on per-asset and cycle limits instead)
  max_position_value_usd: 100000.0  # $100k total position limit (relaxed for 15m crypto)
  
  # 2026-07-08 UPDATE: Percentage-based per_trade_risk_pct DISABLED in favor of fixed $1 exposure model
  # per_trade_risk_pct DISABLED - using fixed $1 exposure cap instead
  # Sizing is now enforced via:
  # - risk_policy.fixed_exposure_cap_usd: 1.00
  # - Sequential trading (blocks new entries until positions exit)
  # - Slot-based position management (sum of contract prices ≤ $1)
  
  # Daily loss cap (2026 BEST PRACTICE: 20% - aligned with drawdown halt)
  # 2026 best practice: Halt trading when daily loss exceeds 20% of bankroll
  # ALIGNED with drawdown_halt_pct (20%) to allow trading through drawdowns for recovery
  # This is the SINGLE SOURCE OF TRUTH - core.settings.py must match this value
  daily_loss_enabled: true  # ENABLED: 2026 best practice - daily loss halt is critical
  # Daily loss limits by operation mode (test vs prod)
  # 2026 best practice: 20% for both test and prod (aligned with drawdown halt)
  max_daily_loss_pct:
    test: 0.20  # 20% daily loss limit for test mode (aligned with drawdown_halt_pct)
    prod: 0.20  # 20% daily loss limit for prod mode (aligned with drawdown_halt_pct)
  max_daily_loss_usd: 8.00  # Fallback USD value for small bankrolls (20% of $40)
  
  # NEW: Rolling PnL-based size reduction
  rolling_1h_pnl_halt_pct: 0.05  # RELAXED: Halt new entries if 1h PnL <= -5% of equity (was 3%)
  rolling_4h_pnl_halt_pct: 0.08  # RELAXED: Halt new entries if 4h PnL <= -8% of equity (was 5%)
  rolling_1h_pnl_reduce_pct: 0.02  # Reduce size by 50% if 1h PnL <= -2% of equity
  rolling_4h_pnl_reduce_pct: 0.03  # Reduce size by 50% if 4h PnL <= -3% of equity
  
  # ── Adaptive Risk Scaling ───────────────────────────────────────────────────
  # Risk scaling bands based on drawdown percentage.
  # As drawdown approaches halt, risk multiplier decreases to give recovery chance.
  # 2026 RESEARCH-BASED: More granular bands for smoother risk reduction
  # Example with $10,000 bankroll and 2% per-trade risk:
  # - 0-8% drawdown: $200 per trade (100% of normal)
  # - 8-10% drawdown: $160 per trade (80% of normal)
  # - 10-12% drawdown: $100 per trade (50% of normal)
  # - 12-15% drawdown: $50 per trade (25% of normal)
  # - 15%+ drawdown: $0 per trade (halted)
  adaptive_risk_bands:
    - max_drawdown_pct: 0.08  # 8% - normal risk (100% multiplier)
      multiplier: 1.0
    - max_drawdown_pct: 0.10  # 10% - reduced risk (80% multiplier)
      multiplier: 0.8
    - max_drawdown_pct: 0.12  # 12% - reduced risk (50% multiplier)
      multiplier: 0.5
    - max_drawdown_pct: 0.15  # 15% - critical risk (25% multiplier)
      multiplier: 0.25
    - max_drawdown_pct: 1.00  # halt (0% multiplier)
      multiplier: 0.0

# ── Reconciliation Thresholds ────────────────────────────────────────────────
# Thresholds for portfolio reconciliation against Kalshi API
# Drift beyond these tolerances triggers alerts; persistent discrepancies trigger errors
reconciliation:
  cash_tolerance_cents: 1  # Alert if cash drift > 1 cent
  pnl_tolerance_cents: 10  # Alert if PnL drift > 10 cents
  position_tolerance_contracts: 0  # Exact match required for positions
  discrepancy_persistence_cycles: 2  # Alert after 2 consecutive discrepancies
  reconciliation_interval_seconds: 300  # Reconcile every 5 minutes

# ── Clock Drift Detection ─────────────────────────────────────────────────────
# Clock drift detection thresholds for timestamp validation
# Detects when exchange timestamps are too far from local clock (indicates clock skew)
clock_drift:
  clock_skew_tolerance_seconds: 5.0  # Max acceptable clock skew (seconds)
  max_age_seconds: 30.0  # Max staleness threshold for timestamps

# ── Kelly Sizing ──────────────────────────────────────────────────────────
# Kelly fraction: maximum fraction of bankroll to risk per trade
# CRITICAL FIX: Aligned to unified risk limit (2% per-trade) to prevent systematic rejections
# 0.02 = 2% of bankroll maximum (aligned with config/risk_limits.yaml per_trade.max_notional_pct)
# This is a hard cap; actual sizing may be lower based on signal quality
kelly:
  kelly_fraction: 0.02  # CRITICAL FIX: 2% Kelly hard cap (aligned with unified risk limit, was 0.05 causing rejections)
  kelly_hard_cap: 0.02  # CRITICAL FIX: legacy field, kept in sync (was 0.05 causing rejections)
  kelly_min_edge_pct: 0.015  # 2026-07-01 FIX: Lowered to 1.5% from 2% to increase trade frequency
  kelly_max_edge_pct: 0.25  # FIXED: Max 25% edge (was 25.0, normalized to 0.25 for consistency)
  kelly_min_win_prob: 0.01
  kelly_max_win_prob: 0.99
  kelly_global_notional_cap_pct: 0.02  # CRITICAL FIX: 2% of equity (aligned with per-trade limit, was 0.05)
  
  # P4-FIX11: Tiered Kelly caps by asset (volatility-based)
  # ALIGNED WITH INDUSTRY: 1-2% per-trade recommendation from 2026 research
  # Tier 1 assets (BTC, ETH): higher Kelly cap due to lower volatility
  # Tier 2 assets (SOL, XRP, DOGE): lower Kelly cap due to higher volatility
  tiered_kelly:
    tier1_fraction: 0.02  # 2% Kelly for BTC, ETH (aligned with unified risk limit, was 0.05)
    tier2_fraction: 0.015  # 1.5% Kelly for SOL, XRP, DOGE (conservative for higher volatility, was 0.03)
    tier1_assets: ["BTC", "ETH"]  # Lower volatility assets
    tier2_assets: ["SOL", "XRP", "DOGE"]  # Higher volatility assets

# ── Contract Caps ─────────────────────────────────────────────────────────
# Hard caps on total contracts across all positions (not bankroll-scaled)
# These are venue-level limits to prevent excessive position concentration
# 2026-07-09: Reduced all caps to align with slot-based model and $1 exposure cap
contract_caps:
  max_contracts_total: 4  # Max total contracts across all assets (aligns with max_concurrent_positions=4)
  max_contracts_per_asset: 1  # Max contracts per asset (slot-based: 1 contract per order)
  max_contracts_per_cluster: 1  # Max contracts per asset/timeframe/overlap-window (slot-based)
  max_single_order_contracts: 1  # CRITICAL FIX (2026-07-08): Reduced from 10 to 1 to enforce 3% risk limit (10 contracts can exceed 3% at low prices)

# ── Risk Policy ───────────────────────────────────────────────────────────
# Risk limits that affect order acceptance and sizing
# 2026-07-08 UPDATE: Fixed $1 exposure model for small bankroll optimization
# Replaces percentage-based sizing with fixed dollar cap to ensure $1+ profit per 15m window
risk_policy:
  # FIXED DOLLAR EXPOSURE MODEL (2026-07-08)
  # Ensures never more than $1 exposure at any time
  # Forces entries in sweet spot (10-75c) and enables mandatory profit exits
  fixed_exposure_cap_usd: 1.00  # CRITICAL: $1 max total exposure across all assets
  sequential_trading: true  # No new entries until all positions exit
  # MANDATORY PROFIT EXIT (2026-07-08)
  # Automatic profit-taking based on entry price to ensure quick wins
  mandatory_profit_exit:
    enabled: true  # Enable automatic profit exits
    # Profit targets based on entry price (tiered for optimal risk/reward)
    # Entry 10-30c: 30% profit target (quick flips)
    # Entry 30-50c: 25% profit target
    # Entry 50-75c: 20% profit target
    profit_target_pct_low: 0.30  # 30% for entries 10-30c
    profit_target_pct_mid: 0.25  # 25% for entries 30-50c
    profit_target_pct_high: 0.20  # 20% for entries 50-75c
    price_threshold_low_cents: 30  # Threshold for low band
    price_threshold_high_cents: 50  # Threshold for high band
  # Legacy percentage-based cap (DISABLED in favor of fixed $1 model)
  group_notional_cap_pct: 0.05  # 5% of bankroll per group (DISABLED - using fixed $1 instead)
  group_notional_cap_min_usd: 5.00  # Minimum $5 cap (DISABLED - using fixed $1 instead)
  group_notional_cap_max_usd: 2000.0  # Maximum $2000 cap (DISABLED - using fixed $1 instead)
  # 2026-07-08 UPDATE: Max entry price lowered to 50c for fixed $1 exposure model
  # Sweet spot is now 10-50c (cheaper entries = easier loss recovery, more slots available)
  max_entry_price_cents: 50  # Max entry price for new orders
  max_fee_to_notional_pct: 15.0  # Max fee/notional ratio (circuit breaker)
  # 2026 STANDARD: Per-asset cluster stop-loss limits instead of aggregate
  # Each asset (BTC/ETH/SOL/XRP/DOGE) has calibrated limits based on volatility and liquidity
  max_stop_loss_usd_per_cluster: 5.00  # Increased from 2.50 to allow reasonable trading (5% of $100 bankroll)
  per_asset_cluster_stop_loss:
    BTC: 3.00  # BTC: $3 max cluster stop-loss (lower due to higher liquidity)
    ETH: 3.00  # ETH: $3 max cluster stop-loss (lower due to higher liquidity)
    SOL: 5.00  # SOL: $5 max cluster stop-loss (higher due to lower liquidity)
    XRP: 5.00  # XRP: $5 max cluster stop-loss (higher due to lower liquidity)
    DOGE: 5.00  # DOGE: $5 max cluster stop-loss (highest due to lowest liquidity)
  # 2026 STANDARD: Institutional-grade risk controls
  # Daily VaR (Value at Risk) cap - maximum expected loss at 95% confidence
  daily_var_cap_pct: 0.03  # 3% daily VaR cap (institutional standard)
  daily_var_cap_min_usd: 2.00  # Minimum $2 VaR cap for small bankrolls
  daily_var_cap_max_usd: 1500.0  # Maximum $1500 VaR cap for large bankrolls
  # Anomalous market state detection and position reduction
  anomalous_state_detection: true  # Enable detection of anomalous market conditions
  anomalous_position_reduction_pct: 0.50  # Reduce positions by 50% during anomalous states

# ── Venue Invariants ───────────────────────────────────────────────────────
# Kalshi venue-level constants (not configurable per profile)
venue_invariants:
  valid_price_cents_min:
    value: 10  # 2026-07-05: Lowered to 10c to match agent_grid entry band [10, 70] and DEEP_OTM_CHEAP_CENTS threshold
    static: invariant
    description: "Minimum valid price for Kalshi binary contracts (PRODUCTION INVARIANT - aligned with min_contract_price_cents guardrail)"
  valid_price_cents_max:
    value: 99  # Kalshi binary contract maximum price (99 cents)
    static: invariant
    description: "Maximum valid price for Kalshi binary contracts (PRODUCTION INVARIANT)"
  deep_otm_threshold_cents:
    value: 5  # Deep OTM threshold for deployment safety (5 cents)
    static: invariant
    description: "Deep OTM threshold for deployment safety (PRODUCTION INVARIANT)"
  deep_itm_threshold_cents:
    value: 99  # Deep ITM threshold for deployment safety (99 cents) - relaxed for 15m crypto
    static: invariant
    description: "Deep ITM threshold for deployment safety (PRODUCTION INVARIANT) - relaxed for 15m crypto markets"
  ioc_auto_below_seconds:
    value: 120  # IOC auto-below threshold: use IOC if expiry within N seconds
    static: invariant
    description: "IOC auto-below threshold in seconds (PRODUCTION INVARIANT)"
  max_book_staleness_ms:
    value: 30000  # 30 seconds maximum orderbook staleness
    static: invariant
    description: "Maximum orderbook staleness in milliseconds for 15m crypto (PRODUCTION INVARIANT)"
  # Time-in-force defaults for swing trading
  entry_tif_default:
    value: ioc  # IOC for entries (immediate fill or cancel)
    static: configurable
    description: "Default time-in-force for entry orders (IOC for capital efficiency)"
  exit_tif_default:
    value: gtc  # GTC for exits (allow resting to ensure fills)
    static: configurable
    description: "Default time-in-force for exit orders (GTC for fill assurance)"

# ── Market Discovery Freshness ───────────────────────────────────────────────
# Freshness cutoff disabled - we need ALL markets to find current 15m window
# The snapshot filter will pick the right ones based on end_date
market_discovery:
  kalshi_min_close_seconds_ago: null  # Disabled - get all markets

# ── Edge/Lag Filter Configuration ───────────────────────────────────────────
# Edge/lag ratio filter: rejects trades where edge is too small relative to lag
# Higher values = more conservative (require larger edge relative to lag)
# BTC/ETH are more efficient, so require higher edge/lag ratio
# SOL/XRP/DOGE are less efficient, allow lower edge/lag ratio
edge_lag_filter:
  # Per-asset minimum edge/lag ratio thresholds (edge per second of lag)
  min_edge_lag_ratio:
    BTC: 0.02   # 2 cents per second of lag
    ETH: 0.02
    SOL: 0.03
    XRP: 0.03
    DOGE: 0.04
  # Per-asset edge/lag filter safety switch (1 = enabled, 0 = disabled)
  # DISABLED: Edge-lag filter disabled as hard gate for small bankroll regime
  # Kept for logging only to avoid blocking trades with sophisticated HFT-style control
  edge_lag_filter_enabled:
    BTC: 0  # Disabled for BTC (log only)
    ETH: 0  # Disabled for ETH (log only)
    SOL: 0  # Disabled for SOL (log only)
    XRP: 0  # Disabled for XRP (log only)
    DOGE: 0  # Disabled for DOGE (log only)
  # Cold-start warmup: minimum lag samples before filter is active
  cold_start_min_samples: 100

# ── Strategy Policy ───────────────────────────────────────────────────────
# Strategy-level thresholds for trade execution
# 2026-07-02 OPTIMIZED: Based on research for 15m crypto markets
# Research findings: profitable systems trade edges down to 1-2%, 53% accuracy minimum
# Reference: https://www.indiehackers.com/post/building-a-stable-15-minute-trading-bot-for-polymarket-crypto-up-down-markets-563a14e882
strategy_policy:
  min_edge: 0.015  # LOWERED: 1.5% global minimum edge (research: profitable systems trade edges down to 1-2%)
  min_confidence: 0.50  # LEGACY VALUE: Not actively used - primary confidence threshold is in confidence.min_confidence_threshold (0.65)
  max_md_staleness_sec: 20.0  # RELAXED: Strategy-specific MD staleness threshold (increased from 15s to 20s for more opportunities)
  
  # NEW: Confidence and agreement requirements
  require_secondary_confirmation: false  # DISABLED: Secondary confirmation removed to reduce double-gating
  min_edge_stability_cycles: 1  # Reduced from 2 to 1 cycle to allow faster signal response
  max_pyramid_entries: 1  # Max 1 entry per side per contract (no pyramiding)
  
  # HYGIENE-SEV2-1: Per-asset edge thresholds for order aggressiveness
  # Higher edge = more aggressive (cross spread), lower edge = resting (join spread)
  # ALIGNED TO 2026 INDUSTRY STANDARDS: 2-4% net edge is the reasonable floor for Kalshi value betting
  # Based on research: Claw Arbs and Turbine recommend 2-4% net edge after fees
  # Previous 52-62% thresholds were unrealistically high, causing 0.0% fill rate
  edge_thresholds:
    # Market entry thresholds (cross spread if edge >= threshold)
    market_entry:
      BTC: 0.04  # BTC: cross spread if edge >= 4% (industry standard upper bound)
      ETH: 0.04  # ETH: cross spread if edge >= 4% (industry standard upper bound)
      SOL: 0.04  # SOL: cross spread if edge >= 4% (industry standard upper bound)
      XRP: 0.04  # XRP: cross spread if edge >= 4% (industry standard upper bound)
      DOGE: 0.04  # DOGE: cross spread if edge >= 4% (industry standard upper bound)
    # Resting entry thresholds (join spread if edge >= threshold)
    resting_entry:
      BTC: 0.02  # BTC: join spread if edge >= 2% (industry standard floor)
      ETH: 0.02  # ETH: join spread if edge >= 2% (industry standard floor)
      SOL: 0.02  # SOL: join spread if edge >= 2% (industry standard floor)
      XRP: 0.02  # XRP: join spread if edge >= 2% (industry standard floor)
      DOGE: 0.02  # DOGE: join spread if edge >= 2% (industry standard floor)
    # Cancel thresholds (cancel resting orders if edge decays below threshold)
    cancel_threshold:
      BTC: 0.50
      ETH: 0.50
      SOL: 0.52
      XRP: 0.53
      DOGE: 0.55

# ── Exit Policy ───────────────────────────────────────────────────────────
# P3-FIX7 through P3-FIX9: Exit logic configuration (R:R, trailing, time cutoff)
exit_policy:
  # P3-FIX7: Per-asset risk-reward configuration
  risk_reward:
    # Minimum R:R ratio required for trade entry
    min_rr:
      BTC: 2.0  # BTC: 2:1 reward-risk minimum
      ETH: 2.0  # ETH: 2:1 reward-risk minimum
      SOL: 1.5  # SOL: 1.5:1 reward-risk minimum
      XRP: 1.5  # XRP: 1.5:1 reward-risk minimum
      DOGE: 1.5  # DOGE: 1.5:1 reward-risk minimum
    # Take profit distance as percentage of entry price
    tp_distance_pct:
      BTC: 0.15  # BTC: 15% TP distance
      ETH: 0.15  # ETH: 15% TP distance
      SOL: 0.12  # SOL: 12% TP distance
      XRP: 0.12  # XRP: 12% TP distance
      DOGE: 0.10  # DOGE: 10% TP distance
    # Stop loss distance as percentage of entry price
    sl_distance_pct:
      BTC: 0.075  # BTC: 7.5% SL distance (2:1 R:R)
      ETH: 0.075  # ETH: 7.5% SL distance (2:1 R:R)
      SOL: 0.08  # SOL: 8% SL distance (1.5:1 R:R)
      XRP: 0.08  # XRP: 8% SL distance (1.5:1 R:R)
      DOGE: 0.067  # DOGE: 6.7% SL distance (1.5:1 R:R)
  
  # P3-FIX8: Trailing stop configuration
  trailing:
    enabled: true  # Enable trailing stops
    # Trailing activation threshold in R-multiples
    activation_r_multiple: 0.8  # Activate trailing at 0.8R (80% of target profit)
    # Giveback amount in cents (how much profit to give back before locking in)
    giveback_cents: 5  # 5 cent giveback (40-50% of 12¢ activation threshold per 2026 research)
    # Scale-out configuration
    scale_out_enabled: true  # Enable scale-out at partial profit
    scale_out_trigger_r: 0.7  # Scale out at 0.7R (70% of target profit)
    scale_out_fraction: 0.5  # Scale out 50% of position
  
  # P3-FIX9: Time-based exit cutoff
  time_exit:
    # Minimum minutes before expiry to force exit (time-based stop)
    cutoff_minutes_before_expiry: 0  # Trade full 15m window (no cutoff)
    # Maximum holding time in minutes (absolute time limit)
    max_hold_minutes: 15  # Max 15 minute hold for 15m contracts

# ── Legacy Path Control ───────────────────────────────────────────────────
# Explicitly disable balance-derived behavior for this profile
legacy:
  # CRITICAL: Enable calibrate_from_balance() for 15m crypto to use percentage-based caps
  # This fixes the hardcoded $50 correlation stack cap bug
  disable_balance_calibration: false
  
  # Disable _compute_dynamic_contract_caps() for this profile
  disable_dynamic_contract_caps: true
  
  # Disable bankroll-derived CategoryLimit for this profile
  disable_bankroll_category_limits: true
  
  # Disable bankroll-derived PredictionRiskConfig for this profile
  disable_bankroll_prediction_risk: true
  
  # Disable bankroll-derived GuardrailConfig for this profile
  disable_bankroll_guardrails: true

# ── Velocity Model (Phase 1: Logistic Mapping from Velocity to Probability) ──
# Maps velocity (price change rate) to model probability using logistic function
# Formula: p_model = sigmoid(alpha_0 + alpha_1 * velocity)
# where sigmoid(x) = 1 / (1 + exp(-x))
#
# Coefficient rationale:
# - alpha_0 (intercept): Centers the logistic curve. Set to 0 for symmetry around velocity=0.
# - alpha_1 (velocity coefficient): Controls sensitivity to velocity.
#   Higher values = more aggressive probability shifts for given velocity.
#   Lower values = more conservative probability shifts.
#
# Starting values based on velocity_threshold = 0.0002 (0.02%):
# - At velocity = +0.0002, p_model ≈ 0.55 (slightly bullish)
# - At velocity = -0.0002, p_model ≈ 0.45 (slightly bearish)
# - At velocity = 0, p_model = 0.50 (neutral)
#
# CRITICAL FIX: 2026-07-04 - Increased alpha_1 to make velocity-to-probability mapping responsive
# Previous values (1.5-2.5) were too low, causing p_model to stay near 50% regardless of velocity
# New values (200-500) align with 2026 industry standards for momentum trading
# With velocity threshold=0.4%-0.8%, these coefficients produce meaningful probability shifts
velocity_model:
  BTC:
    alpha_0: 0.0
    alpha_1: 200.0  # BTC: moderate sensitivity - increased from 1.5 to 200.0 for responsive mapping
  ETH:
    alpha_0: 0.0
    alpha_1: 200.0  # ETH: moderate sensitivity - increased from 1.5 to 200.0 for responsive mapping
  SOL:
    alpha_0: 0.0
    alpha_1: 300.0   # SOL: higher sensitivity - increased from 2.0 to 300.0 for responsive mapping
  XRP:
    alpha_0: 0.0
    alpha_1: 300.0   # XRP: higher sensitivity - increased from 2.0 to 300.0 for responsive mapping
  DOGE:
    alpha_0: 0.0
    alpha_1: 500.0   # DOGE: highest sensitivity - increased from 2.5 to 500.0 for responsive mapping

  # Phase 4.1: Multi-window velocity configuration
  velocity_windows: [10, 30, 60]  # Velocity windows in seconds
  momentum_weights: [0.2, 0.3, 0.5]  # Weights for each window
  velocity_ema_period: 5  # EMA smoothing period for velocity (reduces noise)
  atr_period: 3  # 2026-07-01 FIX: Reduced from 7 to 3 for faster warmup (3 data points needed instead of 7)
  zscore_period: 20  # Z-score period for extreme detection (industry standard)

# ── Velocity Thresholds (Per-Asset) ─────────────────────────────────────────────
# Velocity thresholds for signal generation aligned with actual market conditions
# CRITICAL FIX: 2026-07-05 - Reduced thresholds to effectively zero to enable any trading
# Previous thresholds (0.001%-0.005%) were still blocking trades in calm markets
# Actual market velocities observed: 0.000%-0.04% (from live logs 2026-07-05)
# New thresholds (0.00001%-0.00005%) allow trades even in extremely calm markets:
velocity_thresholds:
  BTC: 0.00015  # 0.015% - aligned with Coinbase velocity_signal.py (single source of truth)
  ETH: 0.00015  # 0.015% - aligned with Coinbase velocity_signal.py (single source of truth)
  SOL: 0.000225  # 0.0225% - aligned with Coinbase velocity_signal.py (single source of truth)
  XRP: 0.000225  # 0.0225% - aligned with Coinbase velocity_signal.py (single source of truth)
  DOGE: 0.0003  # 0.03% - aligned with Coinbase velocity_signal.py (single source of truth)

# ── Momentum Weights (Phase 4.1) ───────────────────────────────────────────────
# Multi-window velocity weights for momentum signal fusion
# Weights correspond to velocity windows: [10s, 30s, 60s]
# Higher weight on longer window = more emphasis on sustained momentum
momentum_weights:
  windows: [10, 30, 60]  # Velocity windows in seconds
  weights: [0.2, 0.3, 0.5]  # Weights for each window (sum to 1.0)

# ── Logit Fusion Weights (Phase 4.4) ───────────────────────────────────────────────
# Weights for fusing multiple signal sources at the logit level
# velocity_logit: Weight for velocity-based logit
# mean_reversion_logit: Weight for mean reversion logit
logit_fusion_weights:
  velocity_logit: 0.7  # Weight for velocity signal
  mean_reversion_logit: 0.3  # Weight for mean reversion signal

# ── Calibration Config (Phase 5.2) ───────────────────────────────────────────────────
# Probability calibration configuration using Platt scaling
# Calibration improves model probability estimates by fitting logistic regression
# to historical predictions and outcomes
calibration_config:
  enabled: false  # Enable/disable probability calibration (default: false for uncalibrated model)
  auto_fit: true  # Automatically fit calibration when sufficient data is available
  min_samples_for_fit: 100  # Minimum samples required to fit calibration
  max_samples: 1000  # Maximum samples to keep for calibration (rolling window)
  regularization: 0.0001  # L2 regularization parameter for Platt scaling
  fit_interval_hours: 24  # Re-fit calibration every N hours

# ── Fee-Aware Edge Gate (Phase 1) ───────────────────────────────────────────────────
# Fee-aware edge calculation to prevent unprofitable small-edge trades
# Based on research: small-edge trades lose money after Kalshi fees
fee_aware_edge:
  enabled: false  # DISABLED for price-based strategy (no edge calculation, trades based on price thresholds)
  # RE-ENABLE RISKS: If re-enabled with momentum_fvg mode, may conflict with velocity-based edge
  # RE-ENABLE REQUIREMENTS: Verify edge calculation is compatible with momentum_fvg signal mode
  min_edge_cents: 2  # $0.02 minimum edge after fees
  fee_per_contract: 0.07  # Kalshi taker fee per contract (7 cents)
  # Fee formula: 0.07 × P × (1−P) where P is contract price
  # Edge gate: (estimated_probability - market_price) > fees + min_edge_cents

# ── Market Microstructure Filters (Phase 1) ───────────────────────────────────────────
# Order book quality filters to reduce slippage and improve fill quality
# Based on Turbine research: spread gating doesn't improve returns, just filters trades
# 2026-07-03: Increased to 50c based on research showing spread gating reduces trade frequency without improving returns
# Reference: https://www.turbinefi.com/blog/1000-strategy-backtest-kalshi-btc-15m
# "Volume-gating, spread-gating, compound 3-predicate rules, all basically tied the simple price_threshold at the same thresholds. Adding conditions did not improve returns. It just filtered more trades."
# 50c threshold blocks extreme data quality issues (82-91c spreads with YES ask=99c) while allowing normal trading
market_microstructure:
  enabled: true  # Enable market microstructure filters
  max_spread_cents: 20  # 2026-07-12: ALIGNED with industry research - 20c max for 15m crypto (industry: 15-20c for short-duration markets)
  min_depth_usd: 0.0  # DISABLED: System uses limit orders which wait for fills, not market orders. Kalshi 15m crypto markets have sufficient liquidity. Depth thresholds are primarily for market orders to prevent slippage.
  min_yes_depth: 1  # Minimum YES depth threshold
  min_no_depth: 1  # Minimum NO depth threshold

# ── Volume Filter Configuration (2026 Best Practices) ───────────────────────────────
# 2026-07-05: Fixed broken volume filter implementation
# Previous bug: Compared 60-second candle volume (hundreds/thousands USD) to 1M threshold
# This ALWAYS failed and blocked all trades
# 
# 2026 industry best practices (AnomIQ, JustScreener, TokenToolHub research):
# - Use relative volume Z-scores (rolling 5m/15m/60m baselines) instead of absolute thresholds
# - Add liquidity floor (min_volume_24h_usd) as coarse prefilter
# - Use volume anomaly detection (Buy/Sell Volume Z-Score > 2.5) for signal confirmation
# - Cross-timeframe confirmation (5m detection, 15m confirmation, 60m regime context)
# - Volume concentration metrics to distinguish wash trading from real participation
#
# Current implementation: DISABLED in agent_grid_15m.py (broken filter removed)
# Future implementation should use:
# - Rolling median + MAD (median absolute deviation) for robust Z-score calculation
# - Per-asset baselines (BTC vs DOGE have different volume characteristics)
# - Multi-timeframe windows (5m for detection, 15m for confirmation, 60m for regime)
# - Directional volume (Buy Volume Z-Score vs Sell Volume Z-Score) for side detection
#
# Coarse liquidity filtering is already handled by:
# - universe.min_volume (5 contracts minimum for Kalshi markets)
# - per-asset min_volume_24h_usd (BTC: 5000, ETH: 4000, SOL: 3000, XRP: 2500, DOGE: 1500)
volume_filter:
  enabled: false  # DISABLED: Previous implementation was broken (wrong metric + wrong threshold)
  # Future implementation parameters (when re-enabled with proper Z-score logic):
  # use_relative_z_score: true  # Use rolling Z-score instead of absolute threshold
  # z_score_threshold: 2.5  # Volume Z-score > 2.5 = unusual (AnomIQ research)
  # liquidity_floor_usd: 1500.0  # Minimum 24h volume (use DOGE's threshold as floor)
  # detection_window_sec: 300  # 5m window for anomaly detection
  # confirmation_window_sec: 900  # 15m window for confirmation
  # regime_window_sec: 3600  # 60m window for regime context
  # require_15m_confirmation: true  # Require 15m Z-score > 1.5 for confirmation
  # use_directional_volume: true  # Check Buy/Sell Volume Z-Score separately
  # buy_z_score_threshold: 2.5  # Buy Volume Z-Score > 2.5 for long signals
  # sell_z_score_threshold: 2.5  # Sell Volume Z-Score > 2.5 for short signals
  description: "Volume filter using 2026 best practices (relative Z-scores, multi-timeframe confirmation)"

# ── Strategies ───────────────────────────────────────────────────────────────
