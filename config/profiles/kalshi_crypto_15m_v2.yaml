    # CRITICAL FIX: Set to 1 contract since we only trade 1 contract per 15m window per asset
    # The gating condition is "can I fill 1 contract within slippage budget?" not "does book have 2-3 contracts"
    min_depth_yes: 1  # Minimum YES depth at best bid (contracts) - aligned with 1 contract per order
    min_depth_no: 1  # Minimum NO depth at best ask (contracts) - aligned with 1 contract per order

# ── Per-Agent Caps ─────────────────────────────────────────────────────────
# Default limits for agents using this profile (can be overridden per-agent).
# Max notional is derived as percentage of capital, NOT hardcoded USD value.
# UNIFIED RISK: All assets (BTC/ETH/SOL/XRP/DOGE) use the same 1-3% per-trade risk range
# based on market conditions, not per-asset fixed percentages.
agent_defaults:
  max_notional_pct: 0.02  # 2% of capital per agent (midpoint of 1-3% range)
  max_orders_per_window: 20  # Max orders per trading window (increased for edge audit)
  max_yes_position: 3  # Max YES contracts per side
  max_no_position: 3  # Max NO contracts per side
  max_concurrent_trades: 5  # INCREASED: Max 5 concurrent trades (was 3, too restrictive for 5 assets)
  
  # Entry window (time before expiry to start trading)
  # Kalshi 15m markets only exist ~15 minutes before expiry
  # Realistic trading window is 2-12 minutes (sweet spot: 5-10 minutes)
  minutes_before_expiry: 12
  cutoff_minutes_before_expiry: 2  # Stop trading 2 minutes before expiry

# ── Edge / Confidence Thresholds ────────────────────────────────────────────
# Edge thresholds are defined per-asset in the assets section above.
# For kalshi_crypto_15m_v2, crypto_threshold_matrix.yaml is profile-guarded and NOT used.
# All edge configuration comes from this YAML file only.
confidence:
  # PROFILE-GUARD: crypto_threshold_matrix.yaml is disabled for kalshi_crypto_15m_v2
  use_crypto_threshold_matrix: false
  profile_name: null  # Not used when use_crypto_threshold_matrix=false

# ── Tiered Edge Band Configuration ───────────────────────────────────────────
# TIERED STRUCTURE: 1-2% watch, 2-4% small, ≥4% standard
# Lowered thresholds for small bankroll regime to increase throughput
# Based on peer-reviewed prediction-market systems that trade edges down to 1-2%
edge_bands:
  enabled: true  # Enable tiered edge band logic
  watch_band:
    min_edge_pct: 0.01  # 1% minimum edge for watch band (lowered from 2%)
    max_edge_pct: 0.02  # 2% maximum edge for watch band (lowered from 4%)
    action: "log_only"  # Log candidates but don't trade
    kelly_multiplier: 0.0  # No sizing in watch band
  small_band:
    min_edge_pct: 0.02  # 2% minimum edge for small band (lowered from 4%)
    max_edge_pct: 0.04  # 4% maximum edge for small band (lowered from 6%)
    action: "trade_small"  # Trade with reduced size
    kelly_multiplier: 0.25  # 0.25x Kelly for small band
  standard_band:
    min_edge_pct: 0.04  # 4% minimum edge for standard band (lowered from 6%)
    max_edge_pct: 1.0  # No upper limit
    action: "trade_standard"  # Trade with standard size
    kelly_multiplier: 0.50  # 0.5x Kelly for standard band
  
  # Optional: Override Kelly multipliers for this profile
  # If set, these override crypto_threshold_matrix.yaml
  kelly_multiplier_no_trade: 0.0
  kelly_multiplier_cautious: 0.5
  kelly_multiplier_quick_win: 0.6
  kelly_multiplier_confident: 1.0

# ── Guardrails ───────────────────────────────────────────────────────────
# Pre-trade checks (not bankroll-scaled)
# CONSERVATIVE SETTINGS: Tighter thresholds to reduce frequency and size
guardrails:
  max_spread_cents: 50  # RELAXED: Increased from 30c to 50c to allow more trades in current market conditions (50-100bp spreads common, aligns with industry 3-7c moderate-liquidity range)
  max_slippage_cents: 3  # Max 3 cents worse than best
  min_depth_contracts: 2  # RELAXED: Reduced from 5 to 2 for single-contract trading (1 contract per order, no need for 5x depth)
  min_post_fee_edge: 0.02  # LOWERED: Minimum post-fee edge 2% (hard floor for all trades, lowered from 4%)
  min_time_to_expiry_min: 2.5  # NORMAL: Minimum 2.5 minutes to expiry (150s, relaxed from 240s for normal regime)
  max_dist_pct_trade: 2.0  # RELAXED: Maximum spot-strike distance percentage for trading (2.0% for better market coverage - was 0.75%)
  min_contract_price_cents: 20  # CRITICAL: Minimum contract price floor (20 cents / $0.20) - blocks deep OTM longshots (10c allowed losing trades)
  max_same_side_per_strip: 4  # RELAXED: Maximum same-direction positions per strip (increased from 2 to 4 for small bankroll)
  max_orders_per_cycle: 1  # REDUCED: Maximum orders per 15m cycle (reduced from 3 to 1 for safer exposure - prevents rapid execution)
  min_edge_per_trade: 0.01  # Minimum edge percentage for priority queue scheduling (1% floor, aligned with watch band)
  # Time trap prevention (entry window narrowing)
  # Aligned with TTE regimes from risk.tte_regime:
  # - NORMAL: > 10 minutes (allow entry)
  # - APPROACHING: 5-10 minutes (allow entry with tighter constraints)
  # - CRITICAL: 2-5 minutes (allow entry with very tight constraints)
  # - TERMINAL: < 2 minutes (block entry)
  max_entry_mins: 15.0  # NORMAL: Maximum time to expiry for entry (15min - increased for better market coverage)
  min_entry_mins: 2.0   # TERMINAL: Minimum time to expiry for entry (2min - aligned with TTE TERMINAL < 2min)
  # Microstructure trap prevention
  # SIMPLIFIED: Single spread rule instead of complex edge-dependent mapping
  # For edge < 2%: do not trade (avoid low edge & wide spread)
  # For edge >= 2%: require spread <= 20c and edge >= 1.1x spread
  max_spread_for_edge:
    "default": 20  # Single rule: max spread = 20c for edge >= 2%
  depth_size_multiplier: 1.5  # Depth must be >= 1.5x order size (relaxed from 3.0x to reduce rejections)
  # Regime/drawdown trap prevention
  regime_cooldown_enabled: false  # DISABLED: Asset halting based on PnL performance (industry advises against variance-based changes, let drawdown limits handle risk)
  regime_cooldown_min_trades: 20  # RELAXED: Minimum trades before regime check (20 for more stable feedback - was 10)
  regime_cooldown_min_winrate: 0.45  # RELAXED: Minimum winrate threshold (45% - was 50%)
  regime_cooldown_max_loss_pct: 0.10  # RELAXED: Maximum loss percentage threshold (10% - was 5%)
  
  # Experimental slice configuration (DISABLED for fair asset treatment)
  # Previously applied only to BTC/ETH, creating asymmetric treatment
  experimental_price_band_enabled: false  # DISABLED: Fair treatment for all assets (was true for BTC/ETH only)
  experimental_tte_band_enabled: false  # DISABLED: Fair treatment for all assets (was true for BTC/ETH only)
  
  # NEW: Per-asset depth thresholds by tier
  # RELAXED: Tier 2 depth reduced from 5 to 2-3 contracts for thinner books
  min_depth_yes_tier1: 2  # Tier 1 (BTC/ETH): min 2 yes contracts (relaxed from 5 for single-contract trading)
  min_depth_no_tier1: 2   # Tier 1 (BTC/ETH): min 2 no contracts (relaxed from 5 for single-contract trading)
  min_depth_yes_tier2: 1   # Tier 2 (SOL/XRP/DOGE): min 1 yes contract (relaxed from 2 for thinner books)
  min_depth_no_tier2: 1    # Tier 2 (SOL/XRP/DOGE): min 1 no contract (relaxed from 2 for thinner books)
  
  # NEW: Spread guard with edge override
  spread_guard_enabled: true  # Enable spread guard
  spread_guard_edge_multiplier: 1.1  # Require edge >= 1.1x spread to trade (relaxed from 1.5x)
  min_spread_gate_cents: 40  # Minimum spread gate at 40 cents (was implicit 60c)
  
  # Drawdown limits (percentage-based, not bankroll-scaled)
  # Drawdown is the primary hard cap; daily loss is optional/soft
  drawdown_halt_pct:
    value: 0.20  # RELAXED: Halt at 20% drawdown (increased from 15% to align with industry 25% standard)
    static: profile
    description: "Drawdown halt percentage (static for this profile)"
  drawdown_unwind_pct:
    value: 0.25  # RELAXED: Unwind at 25% drawdown (increased from 20% to align with industry 25% standard)
    static: profile
    description: "Drawdown unwind percentage (static for this profile)"
  
  # Position limit (total position value across all assets)
  # This is a derived kill switch that auto-resets when position drops below limit
  # Set to 0 to disable (rely on per-asset and cycle limits instead)
  max_position_value_usd: 100000.0  # $100k total position limit (relaxed for 15m crypto)
  
  # Per-trade risk derived from drawdown (survive 15-20 consecutive full-risk losses)
  # BANKROLL-TIERED: Higher risk for small bankrolls to ensure tradable sizes
  # - bankroll < $100: 3-5% per trade (aggressive to overcome minimum lot granularity)
  # - bankroll $100-$1k: 1-2% per trade (moderate scaling)
  # - bankroll > $1k: 0.8% per trade (conservative for larger capital)
  per_trade_risk_pct:
    value: 0.008  # Default 0.8% (for bankroll > $1k)
    dynamic: bankroll_tiered  # Computed from live bankroll via RiskEnvelopeService with tiered logic
    description: "Per-trade risk as percentage of capital (bankroll-tiered: 3-5% for <$100, 1-2% for $100-$1k, 0.8% for >$1k)"
    # Bankroll tier thresholds (applied in RiskEnvelopeService)
    bankroll_tier_small_usd: 100.0  # Threshold for small bankroll regime
    bankroll_tier_medium_usd: 1000.0  # Threshold for medium bankroll regime
    per_trade_risk_small_pct: 0.04  # 4% per trade for bankroll < $100
    per_trade_risk_medium_pct: 0.015  # 1.5% per trade for bankroll $100-$1k
    per_trade_risk_large_pct: 0.008  # 0.8% per trade for bankroll > $1k
  
  # Daily loss cap (optional/soft)
  # Option A: Disable daily loss as separate hard cap (drawdown is single source of truth)
  # Option B: Set daily loss slightly below drawdown as soft stop (e.g., 12-14%)
  daily_loss_enabled: false  # DISABLED: Daily loss limit disabled for system fine-tuning (drawdown is primary guardrail)
  # Daily loss limits by operation mode (test vs prod)
  # CRITICAL FIX: Reduced for production safety and better risk control
  # - test: 8% of bankroll for realistic live testing (reduced from 10%)
  # - prod: 4% of bankroll for conservative production trading (reduced from 5%)
  max_daily_loss_pct:
    test: 0.08  # 8% daily loss limit for test mode (reduced from 10%)
    prod: 0.04  # 4% daily loss limit for prod mode (reduced from 5%)
  
  # NEW: Rolling PnL-based size reduction
  rolling_1h_pnl_halt_pct: 0.05  # RELAXED: Halt new entries if 1h PnL <= -5% of equity (was 3%)
  rolling_4h_pnl_halt_pct: 0.08  # RELAXED: Halt new entries if 4h PnL <= -8% of equity (was 5%)
  rolling_1h_pnl_reduce_pct: 0.02  # Reduce size by 50% if 1h PnL <= -2% of equity
  rolling_4h_pnl_reduce_pct: 0.03  # Reduce size by 50% if 4h PnL <= -3% of equity
  
  # ── Adaptive Risk Scaling ───────────────────────────────────────────────────
  # Risk scaling bands based on drawdown percentage.
  # As drawdown approaches halt, risk multiplier decreases to give recovery chance.
  # 
  # Example with $10,000 bankroll and 0.8% per-trade risk:
  # - 0-10% drawdown: $80 per trade (100% of normal)
  # - 10-12% drawdown: $40 per trade (50% of normal)
  # - 12-15% drawdown: $20 per trade (25% of normal)
  # - 15%+ drawdown: $0 per trade (halted)
  adaptive_risk_bands:
    - max_drawdown_pct: 0.10  # 10% - normal risk (100% multiplier)
      multiplier: 1.0
    - max_drawdown_pct: 0.12  # 12% - reduced risk (50% multiplier)
      multiplier: 0.5
    - max_drawdown_pct: 0.15  # 15% - critical risk (25% multiplier)
      multiplier: 0.25
    - max_drawdown_pct: 1.00  # halt (0% multiplier)
      multiplier: 0.0

# ── Reconciliation Thresholds ────────────────────────────────────────────────
# Thresholds for portfolio reconciliation against Kalshi API
# Drift beyond these tolerances triggers alerts; persistent discrepancies trigger errors
reconciliation:
  cash_tolerance_cents: 1  # Alert if cash drift > 1 cent
  pnl_tolerance_cents: 10  # Alert if PnL drift > 10 cents
  position_tolerance_contracts: 0  # Exact match required for positions
  discrepancy_persistence_cycles: 2  # Alert after 2 consecutive discrepancies
  reconciliation_interval_seconds: 300  # Reconcile every 5 minutes

# ── Clock Drift Detection ─────────────────────────────────────────────────────
# Clock drift detection thresholds for timestamp validation
# Detects when exchange timestamps are too far from local clock (indicates clock skew)
clock_drift:
  clock_skew_tolerance_seconds: 5.0  # Max acceptable clock skew (seconds)
  max_age_seconds: 30.0  # Max staleness threshold for timestamps

# ── Kelly Sizing ──────────────────────────────────────────────────────────
# Kelly fraction: maximum fraction of bankroll to risk per trade
# 0.05 = 5% of bankroll maximum (P1-FIX1: reduced from 0.30 to curb oversizing)
# This is a hard cap; actual sizing may be lower based on signal quality
kelly:
  kelly_fraction: 0.05  # P1-FIX1: 5% Kelly hard cap (reduced from 0.30)
  kelly_hard_cap: 0.05  # P1-FIX1: legacy field, kept in sync (reduced from 0.30)
  kelly_min_edge_pct: 0.02  # SINGLE SOURCE: Min 2% edge to trade (aligned with edge_bands small band, lowered from 4%)
  kelly_max_edge_pct: 0.25  # FIXED: Max 25% edge (was 25.0, normalized to 0.25 for consistency)
  kelly_min_win_prob: 0.01
  kelly_max_win_prob: 0.99
  kelly_global_notional_cap_pct: 0.05  # P2-FIX6: applied as equity*pct -> 5% of equity (tightened from 20.0=2000x non-binding; original 2.0 was 200%, not 2%)
  
  # P4-FIX11: Tiered Kelly caps by asset (volatility-based)
  # ALIGNED WITH INDUSTRY: 1/4 Kelly recommendation from BeatPoly/Market Math
  # Tier 1 assets (BTC, ETH): higher Kelly cap due to lower volatility
  # Tier 2 assets (SOL, XRP, DOGE): lower Kelly cap due to higher volatility
  tiered_kelly:
    tier1_fraction: 0.05  # 5% Kelly for BTC, ETH (reduced from 20% to align with 1/4 Kelly industry standard)
    tier2_fraction: 0.03  # 3% Kelly for SOL, XRP, DOGE (reduced from 10% to align with 1/4 Kelly industry standard)
    tier1_assets: ["BTC", "ETH"]  # Lower volatility assets
    tier2_assets: ["SOL", "XRP", "DOGE"]  # Higher volatility assets

# ── Contract Caps ─────────────────────────────────────────────────────────
# Hard caps on total contracts across all positions (not bankroll-scaled)
# These are venue-level limits to prevent excessive position concentration
contract_caps:
  max_contracts_total: 5000  # Max total contracts across all assets
  max_contracts_per_asset: 1750  # Max contracts per asset (BTC, ETH, etc.)
  max_contracts_per_cluster: 750  # Max contracts per asset/timeframe/overlap-window
  max_single_order_contracts: 10  # Max contracts per single order

# ── Risk Policy ───────────────────────────────────────────────────────────
# Risk limits that affect order acceptance and sizing
risk_policy:
  group_notional_cap_usd: 2000.0  # Max notional per group (asset/timeframe/overlap-window)
  max_fee_to_notional_pct: 15.0  # Max fee/notional ratio (circuit breaker)

# ── Venue Invariants ───────────────────────────────────────────────────────
# Kalshi venue-level constants (not configurable per profile)
venue_invariants:
  valid_price_cents_min:
    value: 1  # Kalshi binary contract minimum price (1 cent)
    static: invariant
    description: "Minimum valid price for Kalshi binary contracts (PRODUCTION INVARIANT)"
  valid_price_cents_max:
    value: 99  # Kalshi binary contract maximum price (99 cents)
    static: invariant
    description: "Maximum valid price for Kalshi binary contracts (PRODUCTION INVARIANT)"
  deep_otm_threshold_cents:
    value: 5  # Deep OTM threshold for deployment safety (5 cents)
    static: invariant
    description: "Deep OTM threshold for deployment safety (PRODUCTION INVARIANT)"
  deep_itm_threshold_cents:
    value: 99  # Deep ITM threshold for deployment safety (99 cents) - relaxed for 15m crypto
    static: invariant
    description: "Deep ITM threshold for deployment safety (PRODUCTION INVARIANT) - relaxed for 15m crypto markets"
  ioc_auto_below_seconds:
    value: 120  # IOC auto-below threshold: use IOC if expiry within N seconds
    static: invariant
    description: "IOC auto-below threshold in seconds (PRODUCTION INVARIANT)"
  max_book_staleness_ms:
    value: 30000  # 30 seconds maximum orderbook staleness
    static: invariant
    description: "Maximum orderbook staleness in milliseconds for 15m crypto (PRODUCTION INVARIANT)"
  # Time-in-force defaults for swing trading
  entry_tif_default:
    value: ioc  # IOC for entries (immediate fill or cancel)
    static: configurable
    description: "Default time-in-force for entry orders (IOC for capital efficiency)"
  exit_tif_default:
    value: gtc  # GTC for exits (allow resting to ensure fills)
    static: configurable
    description: "Default time-in-force for exit orders (GTC for fill assurance)"

# ── Market Discovery Freshness ───────────────────────────────────────────────
# Freshness cutoff disabled - we need ALL markets to find current 15m window
# The snapshot filter will pick the right ones based on end_date
market_discovery:
  kalshi_min_close_seconds_ago: null  # Disabled - get all markets

# ── Edge/Lag Filter Configuration ───────────────────────────────────────────
# Edge/lag ratio filter: rejects trades where edge is too small relative to lag
# Higher values = more conservative (require larger edge relative to lag)
# BTC/ETH are more efficient, so require higher edge/lag ratio
# SOL/XRP/DOGE are less efficient, allow lower edge/lag ratio
edge_lag_filter:
  # Per-asset minimum edge/lag ratio thresholds (edge per second of lag)
  min_edge_lag_ratio:
    BTC: 0.02   # 2 cents per second of lag
    ETH: 0.02
    SOL: 0.03
    XRP: 0.03
    DOGE: 0.04
  # Per-asset edge/lag filter safety switch (1 = enabled, 0 = disabled)
  # DISABLED: Edge-lag filter disabled as hard gate for small bankroll regime
  # Kept for logging only to avoid blocking trades with sophisticated HFT-style control
  edge_lag_filter_enabled:
    BTC: 0  # Disabled for BTC (log only)
    ETH: 0  # Disabled for ETH (log only)
    SOL: 0  # Disabled for SOL (log only)
    XRP: 0  # Disabled for XRP (log only)
    DOGE: 0  # Disabled for DOGE (log only)
  # Cold-start warmup: minimum lag samples before filter is active
  cold_start_min_samples: 100

# ── Strategy Policy ───────────────────────────────────────────────────────
# Strategy-level thresholds for trade execution
# TIERED STRUCTURE: 2% unified minimum edge (aligned with agent grid)
strategy_policy:
  min_edge: 0.02  # UNIFIED: 2% global minimum edge (aligned with agent grid)
  min_confidence: 0.55  # Phase 1: Lowered to 55% for uncalibrated model (was 60%)
  max_md_staleness_sec: 15.0  # Strategy-specific MD staleness threshold (stricter than venue invariant of 30s)
  
  # NEW: Confidence and agreement requirements
  require_secondary_confirmation: false  # DISABLED: Secondary confirmation removed to reduce double-gating
  min_edge_stability_cycles: 1  # Reduced from 2 to 1 cycle to allow faster signal response
  max_pyramid_entries: 1  # Max 1 entry per side per contract (no pyramiding)
  
  # HYGIENE-SEV2-1: Per-asset edge thresholds for order aggressiveness
  # Higher edge = more aggressive (cross spread), lower edge = resting (join spread)
  edge_thresholds:
    # Market entry thresholds (cross spread if edge >= threshold)
    market_entry:
      BTC: 0.55  # BTC: cross spread if edge >= 55%
      ETH: 0.55  # ETH: cross spread if edge >= 55%
      SOL: 0.58  # SOL: cross spread if edge >= 58% (more conservative)
      XRP: 0.60  # XRP: cross spread if edge >= 60% (more conservative)
      DOGE: 0.62  # DOGE: cross spread if edge >= 62% (most conservative)
    # Resting entry thresholds (join spread if edge >= threshold)
    resting_entry:
      BTC: 0.52  # BTC: join spread if edge >= 52%
      ETH: 0.52  # ETH: join spread if edge >= 52%
      SOL: 0.54  # SOL: join spread if edge >= 54%
      XRP: 0.55  # XRP: join spread if edge >= 55%
      DOGE: 0.57  # DOGE: join spread if edge >= 57%
    # Cancel thresholds (cancel resting orders if edge decays below threshold)
    cancel_threshold:
      BTC: 0.50
      ETH: 0.50
      SOL: 0.52
      XRP: 0.53
      DOGE: 0.55

# ── Exit Policy ───────────────────────────────────────────────────────────
# P3-FIX7 through P3-FIX9: Exit logic configuration (R:R, trailing, time cutoff)
exit_policy:
  # P3-FIX7: Per-asset risk-reward configuration
  risk_reward:
    # Minimum R:R ratio required for trade entry
    min_rr:
      BTC: 2.0  # BTC: 2:1 reward-risk minimum
      ETH: 2.0  # ETH: 2:1 reward-risk minimum
      SOL: 1.5  # SOL: 1.5:1 reward-risk minimum
      XRP: 1.5  # XRP: 1.5:1 reward-risk minimum
      DOGE: 1.5  # DOGE: 1.5:1 reward-risk minimum
    # Take profit distance as percentage of entry price
    tp_distance_pct:
      BTC: 0.15  # BTC: 15% TP distance
      ETH: 0.15  # ETH: 15% TP distance
      SOL: 0.12  # SOL: 12% TP distance
      XRP: 0.12  # XRP: 12% TP distance
      DOGE: 0.10  # DOGE: 10% TP distance
    # Stop loss distance as percentage of entry price
    sl_distance_pct:
      BTC: 0.075  # BTC: 7.5% SL distance (2:1 R:R)
      ETH: 0.075  # ETH: 7.5% SL distance (2:1 R:R)
      SOL: 0.08  # SOL: 8% SL distance (1.5:1 R:R)
      XRP: 0.08  # XRP: 8% SL distance (1.5:1 R:R)
      DOGE: 0.067  # DOGE: 6.7% SL distance (1.5:1 R:R)
  
  # P3-FIX8: Trailing stop configuration
  trailing:
    enabled: true  # Enable trailing stops
    # Trailing activation threshold in R-multiples
    activation_r_multiple: 0.8  # Activate trailing at 0.8R (80% of target profit)
    # Giveback amount in cents (how much profit to give back before locking in)
    giveback_cents: 3  # 3 cent giveback
    # Scale-out configuration
    scale_out_enabled: true  # Enable scale-out at partial profit
    scale_out_trigger_r: 0.7  # Scale out at 0.7R (70% of target profit)
    scale_out_fraction: 0.5  # Scale out 50% of position
  
  # P3-FIX9: Time-based exit cutoff
  time_exit:
    # Minimum minutes before expiry to force exit (time-based stop)
    cutoff_minutes_before_expiry: 2  # Force exit 2 minutes before expiry
    # Maximum holding time in minutes (absolute time limit)
    max_hold_minutes: 15  # Max 15 minute hold for 15m contracts

# ── Legacy Path Control ───────────────────────────────────────────────────
# Explicitly disable balance-derived behavior for this profile
legacy:
  # Disable calibrate_from_balance() for this profile
  disable_balance_calibration: true
  
  # Disable _compute_dynamic_contract_caps() for this profile
  disable_dynamic_contract_caps: true
  
  # Disable bankroll-derived CategoryLimit for this profile
  disable_bankroll_category_limits: true
  
  # Disable bankroll-derived PredictionRiskConfig for this profile
  disable_bankroll_prediction_risk: true
  
  # Disable bankroll-derived GuardrailConfig for this profile
  disable_bankroll_guardrails: true

# ── Velocity Model (Phase 1: Logistic Mapping from Velocity to Probability) ──
# Maps velocity (price change rate) to model probability using logistic function
# Formula: p_model = sigmoid(alpha_0 + alpha_1 * velocity)
# where sigmoid(x) = 1 / (1 + exp(-x))
#
# Coefficient rationale:
# - alpha_0 (intercept): Centers the logistic curve. Set to 0 for symmetry around velocity=0.
# - alpha_1 (velocity coefficient): Controls sensitivity to velocity.
#   Higher values = more aggressive probability shifts for given velocity.
#   Lower values = more conservative probability shifts.
#
# Starting values based on velocity_threshold = 0.0002 (0.02%):
# - At velocity = +0.0002, p_model ≈ 0.55 (slightly bullish)
# - At velocity = -0.0002, p_model ≈ 0.45 (slightly bearish)
# - At velocity = 0, p_model = 0.50 (neutral)
#
# These are conservative starting values. Calibrate with historical data after deployment.
velocity_model:
  BTC:
    alpha_0: 0.0
    alpha_1: 1000.0  # BTC: moderate sensitivity (lower volatility)
  ETH:
    alpha_0: 0.0
    alpha_1: 1000.0  # ETH: moderate sensitivity (lower volatility)
  SOL:
    alpha_0: 0.0
    alpha_1: 800.0   # SOL: higher sensitivity (higher volatility)
  XRP:
    alpha_0: 0.0
    alpha_1: 800.0   # XRP: higher sensitivity (higher volatility)
  DOGE:
    alpha_0: 0.0
    alpha_1: 600.0   # DOGE: highest sensitivity (higher volatility)

# ── Velocity Thresholds (Per-Asset) ─────────────────────────────────────────────
# Velocity thresholds for signal generation aligned with industry standards
# Updated 2026-06-28 based on Turbine research: thresholds barely mattered (0.0002-0.002 both worked)
# Further lowered to 0.0002-0.0004 range to capture more trades while maintaining signal quality
velocity_thresholds:
  BTC: 0.0002  # 0.02% - further reduced from 0.0005 based on Turbine research (0.0002-0.002 both worked)
  ETH: 0.0002  # 0.02% - further reduced from 0.0005 based on Turbine research (0.0002-0.002 both worked)
  SOL: 0.0003  # 0.03% - further reduced from 0.001 for higher volatility assets
  XRP: 0.0003  # 0.03% - further reduced from 0.001 for higher volatility assets
  DOGE: 0.0004 # 0.04% - further reduced from 0.0015 for highest volatility assets

# ── Momentum Weights (Phase 4.1) ───────────────────────────────────────────────
# Multi-window velocity weights for momentum signal fusion
# Weights correspond to velocity windows: [10s, 30s, 60s]
# Higher weight on longer window = more emphasis on sustained momentum
momentum_weights:
  windows: [10, 30, 60]  # Velocity windows in seconds
  weights: [0.2, 0.3, 0.5]  # Weights for each window (sum to 1.0)

# ── Logit Fusion Weights (Phase 4.4) ───────────────────────────────────────────────
# Weights for fusing multiple signal sources at the logit level
# velocity_logit: Weight for velocity-based logit
# mean_reversion_logit: Weight for mean reversion logit
logit_fusion_weights:
  velocity_logit: 0.7  # Weight for velocity signal
  mean_reversion_logit: 0.3  # Weight for mean reversion signal

# ── Calibration Config (Phase 5.2) ───────────────────────────────────────────────────
# Probability calibration configuration using Platt scaling
# Calibration improves model probability estimates by fitting logistic regression
# to historical predictions and outcomes
calibration_config:
  enabled: false  # Enable/disable probability calibration (default: false for uncalibrated model)
  auto_fit: true  # Automatically fit calibration when sufficient data is available
  min_samples_for_fit: 100  # Minimum samples required to fit calibration
  max_samples: 1000  # Maximum samples to keep for calibration (rolling window)
  regularization: 0.0001  # L2 regularization parameter for Platt scaling
  fit_interval_hours: 24  # Re-fit calibration every N hours

# ── Fee-Aware Edge Gate (Phase 1) ───────────────────────────────────────────────────
# Fee-aware edge calculation to prevent unprofitable small-edge trades
# Based on research: small-edge trades lose money after Kalshi fees
fee_aware_edge:
  enabled: false  # DISABLED for price-based strategy (no edge calculation, trades based on price thresholds)
  min_edge_cents: 2  # $0.02 minimum edge after fees
  fee_per_contract: 0.07  # Kalshi taker fee per contract (7 cents)
  # Fee formula: 0.07 × P × (1−P) where P is contract price
  # Edge gate: (estimated_probability - market_price) > fees + min_edge_cents

# ── Market Microstructure Filters (Phase 1) ───────────────────────────────────────────
# Order book quality filters to reduce slippage and improve fill quality
# Based on research: avoid wide spreads and thin books
market_microstructure:
  enabled: true  # Enable market microstructure filters
  max_spread_cents: 15  # Avoid spreads > 15 cents (increased from 8c based on industry research - 5c problematic, 15c reasonable for illiquid markets)
  min_depth_usd: 200  # Require >$200 within 3 cents of mid price
  min_yes_depth: 1  # Minimum YES depth threshold
  min_no_depth: 1  # Minimum NO depth threshold

# ── Strategies ───────────────────────────────────────────────────────────────
# Phase 2: Strategy definitions for multi-strategy support
# Each strategy has a unique ID, type, and policy configuration
strategies:
  heuristic_velocity:
    id: "heuristic_velocity"
    type: "heuristic_velocity"
    description: "Velocity-based logistic mapping strategy for 15m crypto contracts"
    enabled: true
    # Policy configuration for this strategy
    policy:
      min_edge: 0.02  # 2% minimum edge (from strategy_policy)
      min_confidence: 0.55  # 55% minimum confidence (from strategy_policy)
      max_md_staleness_sec: 15.0  # MD staleness threshold
      # Per-asset overrides (optional)
      asset_overrides:
        BTC:
          min_edge: 0.02
          min_confidence: 0.55
        ETH:
          min_edge: 0.02
          min_confidence: 0.55
        SOL:
          min_edge: 0.02
          min_confidence: 0.55
        XRP:
          min_edge: 0.02
          min_confidence: 0.55
        DOGE:
          min_edge: 0.02
          min_confidence: 0.55

