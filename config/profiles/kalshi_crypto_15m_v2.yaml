# ── Operation Mode (test vs prod) ────────────────────────────────────────────
# Controls daily loss limit and other risk parameters for testing vs production.
# - test: Relaxed daily loss limit for realistic live testing (e.g., 10% of bankroll)
# - prod: Conservative daily loss limit for production (e.g., 5% of bankroll)
# Set via environment variable MERID_OPERATION_MODE (default: prod)
operation_mode: prod  # Options: test, prod

# ── Sandbox/Dry-Run Mode (Extra 1) ─────────────────────────────────────────
# When enabled, orders are logged but NOT submitted to Kalshi API.
# Useful for testing strategies without risking real capital.
# Set to true for paper/demo mode, false for live trading.
dry_run: false

# ── Catalog Staleness Enforcement ───────────────────────────────────────────
# Controls whether catalog staleness (catalog_age > 60s) can halt trading.
# For kalshi_crypto_15m_v2, catalog is updated every cycle and per-market
# expiry/MD/depth checks provide sufficient safety. Catalog staleness is
# purely informational for this profile.
catalog_staleness_enforced: false

# ── Signal Mode Configuration ───────────────────────────────────────────────
# Controls the signal generation mode for trading decisions.
# - mean_reversion: Trade against overextensions (RSI overbought/oversold zones)
# - momentum_fvg: Trade with trend using Fair Value Gaps and Order Book Imbalance
# - hybrid: Allow both modes (default for maximum opportunity capture)
# - price_based: Turbine research winner - buy YES when price <= 0.50, sell when price >= 0.70
# 2026 OPTIMIZATION: Switch to hybrid mode for maximum opportunity capture
# Hybrid mode combines mean_reversion and momentum_fvg for better signal diversity
signal_mode: momentum_fvg  # Options: mean_reversion, momentum_fvg, hybrid, price_based - SWITCHED from hybrid based on 2026 research (panic_fade only profitable strategy)

# ── Phase 1 Profitability Enhancements ─────────────────────────────────────────
# YES/NO Sum Arbitrage, Market Making, and Correlation Tracking

# YES/NO Sum Arbitrage Configuration
# When YES+NO < 100c, buy both sides for risk-free profit
yes_no_arbitrage:
  enabled: true  # Set to true to enable arbitrage execution
  threshold_cents: 3  # Minimum arbitrage edge to execute (3c = 3%)
  max_size_contracts: 10  # Max contracts per arbitrage trade
  execution_timeout_ms: 500  # Max time to execute both sides (milliseconds)
  description: "YES/NO sum arbitrage: buy both sides when YES_ask + NO_bid < 100c"

# Market Making Configuration
# Liquidity provision to earn spread income
market_making:
  enabled: true  # Set to true to enable market making
  quoting_mode: "two_sided"  # Options: one_sided, two_sided
  spread_cents: 2  # Target spread in cents
  inventory_limit_contracts: 50  # Max inventory per asset
  skew_adjustment: true  # Adjust quotes based on inventory imbalance
  description: "Market making: provide liquidity and earn spread income"

# Correlation Tracking Configuration
# Reduce exposure when assets are highly correlated
correlation_tracking:
  enabled: true  # Set to true to enable correlation tracking
  threshold: 0.5  # Correlation threshold for exposure reduction
  max_reduction: 0.4  # Reduce to 40% of combined cap at perfect correlation
  window_days: 30  # Rolling window for correlation calculation
  description: "Correlation tracking: reduce exposure when assets are highly correlated"

# Offset Hedging Configuration
# When holding YES, buy NO in same market to cap downside while preserving upside
offset_hedging:
  enabled: true  # Set to true to enable offset hedging
  hedge_ratio: 0.30  # 30% hedge, 70% conviction (0.30 = 30%)
  min_edge_for_hedge: 0.03  # Only hedge when edge >= 3% (0.03 = 3%)
  max_hedge_notional_pct: 0.02  # Max 2% of equity for hedge (0.02 = 2%)
  rebalance_threshold: 0.05  # Rebalance when probability drifts > 5% (0.05 = 5%)
  min_hedge_contracts: 1  # Minimum 1 contract for hedge
  max_hedge_contracts: 3  # Maximum 3 contracts for hedge
  description: "Offset hedge: buy NO when holding YES to cap downside"

# Trailing Stop Configuration
# Dynamic stop-loss that follows price to lock in profits
trailing_stop:
  enabled: true  # Set to true to enable trailing stop
  trailing_distance_cents: 5  # 5 cents trailing distance
  min_profit_cents: 12  # Only activate after 12c profit (align with 2026 research: 10-15¢ threshold to avoid noise-triggered exits)
  activation_delay_sec: 30  # Wait 30s before activating
  description: "Trailing stop: lock in profits as price moves favorably"

# Staged Time-Based Exit Configuration
# Partial exits at time intervals for volatile markets
staged_time_exit:
  enabled: true  # Enable staged time-based exits
  # Staged exits: [minutes, percent_to_close]
  # Example: At 5 min close 40%, at 10 min close 30%, at 13 min close remaining 30%
  stages:
    - minutes: 5
      percent: 40
    - minutes: 10
      percent: 30
    - minutes: 13
      percent: 30
  description: "Staged time exits: partial liquidation at time intervals"

# Dynamic Position Sizing Configuration
# Scale position size based on edge and confidence
dynamic_sizing:
  enabled: true  # Set to true to enable dynamic sizing
  base_contracts: 1  # Base size
  edge_multiplier: 0.5  # 0.5 contracts per 1% edge
  confidence_multiplier: 0.3  # 0.3 contracts per 1% confidence
  max_contracts: 3  # Max contracts per trade
  min_contracts: 1  # Min contracts per trade
  description: "Dynamic sizing: scale position based on edge and confidence"

# ── Momentum/FVG Mode Parameters ───────────────────────────────────────────
# Parameters for momentum_fvg signal mode (when enabled)
# Tuned specifically for Kalshi 15m crypto microstructure
momentum_fvg:
  # RSI thresholds for momentum (not overextended, but directional)
  momentum_rsi_long_min: 55  # Bullish momentum: RSI > 55
  momentum_rsi_short_max: 45  # Bearish momentum: RSI < 45
  
  # MACD histogram thresholds
  momentum_min_macd_hist_long: 0  # For longs: MACD histogram >= 0
  momentum_min_macd_hist_short: 0  # For shorts: MACD histogram <= 0
  
  # Order Book Imbalance (OBI) parameters - Kalshi-specific per-asset thresholds
  # OBI = (BidContracts_10c - AskContracts_10c) / (BidContracts_10c + AskContracts_10c)
  obi_min: 0.25  # Minimum absolute OBI to qualify as directional (not noise)
  obi_persistence_min: 0.6  # Minimum fraction of snapshots with consistent OBI sign (60%)
  obi_persistence_window_sec: 10  # Time window for persistence check (10 seconds)
  obi_ewma_alpha: 0.15  # EWMA smoothing factor (0.15 = ~7 snapshot effective window)
  
  # Per-asset OBI strong thresholds (Kalshi books are thinner than spot)
  obi_strong_btc: 0.55  # BTC: strong imbalance threshold
  obi_strong_eth: 0.55  # ETH: strong imbalance threshold
  obi_strong_sol: 0.45  # SOL: strong imbalance threshold (thinner book)
  obi_strong_xrp: 0.45  # XRP: strong imbalance threshold (thinner book)
  obi_strong_doge: 0.45  # DOGE: strong imbalance threshold (thinner book)
  
  # Per-asset EWMA alpha (tuned per asset depth/flicker)
  obi_ewma_alpha_btc: 0.15  # BTC: more depth, more flicker, smoother
  obi_ewma_alpha_eth: 0.15  # ETH: more depth, more flicker, smoother
  obi_ewma_alpha_sol: 0.20  # SOL: less depth, quicker reaction
  obi_ewma_alpha_xrp: 0.20  # XRP: less depth, quicker reaction
  obi_ewma_alpha_doge: 0.20  # DOGE: less depth, quicker reaction
  
  # Fair Value Gap (FVG) parameters - Kalshi 15m constraints
  fvg_max_age_bars: 4  # Maximum age of FVG in bars (15m bars, 4 bars = 60min)
  fvg_min_size_ticks: 3  # Minimum FVG size in ticks to consider valid
  fvg_min_time_to_expiry_min: 30  # Minimum time to expiry to use FVG for new entries (30min)
  
  # Trend confirmation
  require_ema_stack: true  # Require EMA stack alignment (fast > slow for longs)
  require_price_vs_ema50: true  # Require price above/below EMA50 for direction
  
  # Liquidity-aware size scaling (Kalshi-specific tiers)
  # Based on depth_yes_10c and depth_no_10c from orderbook
  liquidity_tiers:
    high_threshold: 200  # High liquidity: >=200 contracts (deep BTC 15m)
    high_size_factor: 1.0  # Use full profile risk
    medium_threshold: 80  # Medium liquidity: 80-200 contracts
    medium_size_factor: 0.75  # 75% of profile risk
    low_threshold: 40  # Low liquidity: 40-80 contracts
    low_size_factor: 0.5  # 50% of profile risk
    ultra_low_threshold: 25  # Ultra-low liquidity: 25-40 contracts
    ultra_low_size_factor: 0.25  # 25% of profile risk
    min_threshold: 25  # Below this: no new entries
    min_size_factor: 0.0  # No new entries
  
  # Spread guard interaction with momentum
  # If spread exceeds this, require higher OBI persistence for momentum entries
  spread_gate_cents: 50  # INCREASED: Aligned with guardrails_max_spread_cents (50c for realistic 15m market spreads)
  spread_gate_obi_persistence_boost: 0.75  # Require 75% persistence if spread is wide

# ── Price-Based Strategy Parameters (2026 Optimized for Swing Trading) ───────────
# Optimized for swing trading: wider entry range to capture YES/NO reversals
# 2026 findings: swing trading requires wider entry zones to maximize reversal opportunities
# Previous 0.52/0.68 range (16¢ no-trade zone) was too restrictive for swing mode
# OPTIMIZED: 0.48/0.72 range (12¢ no-trade zone) for better swing opportunity capture
# This allows entering YES at 48¢ and NO at 72¢, maximizing swing potential
price_based:
  buy_threshold: 0.48  # Buy YES when price <= 0.48 (lowered from 0.52 for swing mode)
  sell_threshold: 0.72  # Buy NO when price >= 0.72 (raised from 0.68 for swing mode)

# ── Hybrid Mode Price Caps (2026 Optimized) ───────────────────────────────
# Hybrid mode combines momentum signals with price discipline
# Research: Buying at 90-99¢ for 4-33¢ profit is poor risk/reward (9.6% return)
# Industry standard: Minimum 20% edge required for viable trading
# Kalshi guide: "An Up contract for $0.85 means you will only make $0.15 profit"
# Solution: Enforce price caps to prevent overpriced entries while keeping momentum signals
hybrid:
  max_entry_price_yes: 0.80  # Maximum price to buy YES (relaxed from 70¢ based on 2026 research - allows trading at common 70-80¢ range while still avoiding extreme 90-99¢ entries)
  min_entry_price_no: 0.20  # Minimum price to buy NO (relaxed from 30¢ - symmetric cap for NO side)
  # Rationale: Based on Kalshi 2026 guide, 85¢ is typical market price. 80¢ cap allows trading while still avoiding extreme 90-99¢ poor risk/reward entries

# ── Sentiment Isolation (Single Source of Truth) ────────────────────────────
# For kalshi_crypto_15m_v2 profile, sentiment-based trading is disabled.
# This is the single source of truth for sentiment configuration in the 15m stack.
# All other sentiment-related code paths (env vars, trading_agent nulling, etc.)
# are considered redundant and should defer to this configuration.
sentiment_isolation:
  enable_sentiment_execution: false  # Sentiment-based trading disabled for 15m crypto
  sentiment_mode: disabled  # Explicitly set to disabled

# ── Drawdown Semantics ───────────────────────────────────────────────────────
# Time horizon: "since process start" (not rolling window)
# - Peak equity tracks highest equity since FastAPI startup
# - Drawdown is computed as (peak - current) / peak
# - Fresh start resets peak equity to current equity
#
# PnL basis: "equity including open positions" (realized + unrealized)
# - Uses Kalshi account balance (total equity)
# - Not based on realized PnL only
#
# Deposits/Withdrawals:
# - Deposits: treated as PnL (increase equity, may update peak)
# - Withdrawals: treated as PnL (decrease equity, peak unchanged)
# - This ensures drawdown reflects actual account performance
#
# Fresh Start Behavior:
# - When MERID_FRESH_START=1, peak_equity resets to current_equity
# - This prevents old drawdown state from persisting across sessions
drawdown_semantics:
  time_horizon: "since_process_start"
  pnl_basis: "equity_including_positions"
  deposit_withdrawal_treatment: "as_pnl"

# ── Global Capital and Cycle Risk ────────────────────────────────────────
# Capital for this strategy. Set to 0 to derive from live Kalshi bankroll API.
# For paper/demo mode, you can set a fixed value (e.g., 10000.0).
# For live trading, set to 0 to use actual account balance.
# For validation/calibration mode, set to fixed value (e.g., 50.0) to ensure consistent caps regardless of live balance.
capital_usd: 0  # Live mode: derive from live Kalshi equity via router/bankroll engine

# Minimum trade size (floor) - single source of truth for all agents
min_notional_usd: 0.50  # INCREASED: $0.50 minimum notional per trade (was $0.05, too low for meaningful sizing)
min_contracts: 1  # Minimum 1 contract per trade (Kalshi venue invariant)

# Fallback pricing configuration
# When live market data is unavailable, the system can use a fallback price (50c)
# DISABLED: Fallback trades are not allowed in production (Task 32: Remove temporary flag)
# Live market data is required for all trading decisions
allow_fallback_trades: false  # DISABLED: Require live market data
max_fallback_notional_usd: 0.35  # If fallback allowed, cap at min_notional (unused when disabled)
max_fallback_cycles: 0  # DISABLED: No fallback cycles allowed

# Maximum risk per cycle as percentage of capital
# 2026 BEST PRACTICE: 0.5% per cycle for 5-second HFT (aligned with Quarter Kelly research)
# With 180 cycles/hour, even 0.5% compounds to significant exposure
# This is the SINGLE SOURCE OF TRUTH - core.settings.py must match this value
max_cycle_risk_pct:
  value: 0.005  # 0.5% of capital per cycle (conservative for 5-second cycles)
  dynamic: bankroll  # Computed from live bankroll via RiskEnvelopeService
  description: "Maximum risk per cycle as percentage of capital (computed from bankroll)"
  
# CRITICAL FIX: Added maximum total risk cap for production safety
max_total_risk_pct:
  value: 0.15  # 15% total risk cap (conservative for production survival)
  description: "Maximum total risk as percentage of capital (production safety)"

# Optional absolute cap on cycle risk (overrides percentage if set)
# Set to 0 to use percentage-based only
max_cycle_risk_usd: 0.0

# ── Venue-Level Caps (Kalshi) ──────────────────────────────────────────────
# These caps are derived as percentages of capital, NOT hardcoded values.
# This ensures risk scales with actual account balance.
venue:
  name: kalshi
  # Conservative venue caps based on 2026 HFT best practices (Quarter Kelly)
  # Primary risk controls are now (2026 best practices):
  # - per_trade_risk_pct (0.8%): primary sizing control
  # - per-asset max_notional_pct (3%): secondary per-asset limits (conservative)
  # - max_cycle_risk_pct (0.5%): aggregate cycle-level control (conservative for 5-second cycles)
  # - max_total_risk_pct (15%): aggregate total exposure control (conservative for survival)
  max_total_notional_pct:
    value: 0.25  # 25% total venue cap (sum of 5% per asset × 5 assets)
    static: profile
    description: "Maximum total notional as percentage of capital (matches sum of per-asset caps)"
  
  # Bankroll cap percentage for order sizing (2026 best practice: 1% for crypto)
  bankroll_cap_pct:
    value: 0.01  # 1% of bankroll per order (Quarter Kelly recommendation for crypto)
    static: profile
    description: "Maximum order notional as percentage of bankroll (conservative for crypto)"
  
  # REMOVED: Conflicting rate limits - now handled by throttling section (single source of truth)
  # - max_orders_per_minute: replaced by throttling.global_orders_limit (5/min)
  # - max_orders_per_hour: replaced by throttling.max_orders_per_15m_window (5 per 15m)

# ── Universe Liquidity Filters ───────────────────────────────────────────────
# Liquidity thresholds for the KalshiUniverse layer (coarse prefilter).
# These are tuned for the 15m crypto universe (exactly 5 markets per asset cycle).
# More stringent microstructure checks are applied downstream in candidate optimizer/risk layer.
universe:
  min_volume: 5  # Minimum 5 contracts volume (relaxed from default 50 for 15m crypto)
  min_open_interest: 1  # Minimum 1 contract open interest (relaxed from default 10)
  max_spread_cents: 10  # 2026-07-02: REVERTED from 100c - 82c spreads are data quality issue (YES ask=99c), not real market conditions
  description: "Coarse liquidity prefilter for 15m crypto markets - tuned for exactly 5 markets per asset"

# ── Throttling (Order Rate Limits) ───────────────────────────────────────────
# Global and per-asset throttling to prevent order spam and ensure orderly execution.
# These replace hardcoded values in agent_grid_15m.py with profile-driven configuration.
# BALANCED SETTINGS: Optimized based on industry comparison (Polymarket 15m bot uses 30s with 93% WR)
throttling:
  global_orders_window_sec: 60  # Rolling window for global order limit (seconds)
  global_orders_limit: 15  # INCREASED: Max 15 orders per minute globally (was 5 - too restrictive for 5 assets, allows 3 orders per asset on average)
  per_asset_cooldown_sec: 15  # REDUCED: 15s cooldown per asset (was 30s - too restrictive for 15m trading, allows 4 trades per 15m window per asset)
  per_strip_notional_usd: 0.0  # Max notional per strip (0.0 = disabled, set if needed)
  max_orders_per_15m_window: 15  # INCREASED: Max 15 orders total per 15m window across all assets (was 5 - too restrictive for 5 assets)
  
  # REMOVED: Conflicting top-N limits - now handled by guardrails section (single source of truth)
  # - per_strip_order_limit: replaced by guardrails.max_orders_per_cycle
  # - max_trades_per_cycle_global: replaced by guardrails.max_orders_per_cycle
  # - max_trades_per_cycle_asset: replaced by guardrails.max_orders_per_cycle
  
  cooldown_after_loss_cycles: 2  # No new entry for 2 cycles (30s) after a loss in that asset (relaxed from 4)

# ── Failsafe Configuration ───────────────────────────────────────────────────
# Emergency brake when market data is degraded (catalog stuck but MD fresh).
# This is separate from normal strip limits and should be clearly logged when active.
failsafe:
  max_contracts_per_order: 1  # Max contracts per order when in failsafe mode (emergency brake)

# ── Price Range Validation (Critical Risk Control) ─────────────────────────────
# Prevents degenerate trades at extreme prices (1 cent or 89-99 cents)
# This is the single source of truth for price validation across the system
# Orders outside this range will be rejected at the order router level
# UPDATED: min_price_cents raised from 20 to 50 based on 2026-07-03 trade history analysis
# Low-priced contracts (<30c) have 10.4% win rate (lottery tickets)
# Entry prices >=70c have 88.0% win rate (excellent)
# YES side has 56.8% win rate vs NO side 20.0%
price_range:
  min_price_cents: 55  # RAISED from 50 to 55 (aligns with GRDazzle research - avoids <30¢ lottery tickets with 10.4% win rate)
  max_price_cents: 75  # RAISED from 70 to 75 (allows more opportunities while preventing extreme >80¢ entries with poor risk/reward)
  description: "Valid price range in cents for order execution (prevents degenerate pricing)"

# ── Per-Asset Caps (BTC/ETH/SOL/XRP/DOGE) ─────────────────────────────────
# Each asset has its own notional as percentage of capital, NOT hardcoded USD values.
# Edge thresholds override crypto_threshold_matrix.yaml for this profile.
# MINIMUM FLOOR: max_notional_usd will be at least min_notional_usd regardless of bankroll size
# This ensures trades are possible even with small bankrolls (e.g., $31.36)
# Set to 0.0 to disable floor and use pure percentage-based sizing
# INCREASED to 0.50 to enable meaningful trading with small bankrolls
min_max_notional_usd: 0.50  # Minimum floor for per-asset max_notional (increased from 0.10 for $31.36 bankroll)

# 2026 OPTIMIZATION: Per-asset minimum decision minute (skip noisy early signals)
# Industry standard (GRDazzle bot): Skip first N minutes of 15m window to avoid noise
# This prevents low-quality signals from early price action
min_decision_minute:
  BTC: 2  # Skip first 2 minutes for BTC (deeper market, needs more time to settle)
  ETH: 2  # Skip first 2 minutes for ETH (similar to BTC)
  SOL: 3  # Skip first 3 minutes for SOL (thinner book, more noise)
  XRP: 3  # Skip first 3 minutes for XRP (thinner book, more noise)
  DOGE: 4  # Skip first 4 minutes for DOGE (thinnest book, most noise)

# 2026 OPTIMIZATION: Multi-timeframe trend filter (1h alignment)
# Industry standard: Only take 5m/15m setups that align with 1h trend
# This eliminates 40-50% of losing signals by filtering against-trend trades
# When 1h is bullish: only take long signals on 15m
# When 1h is bearish: only take short signals on 15m
# When 1h is neutral: allow both directions (reduced size)
multi_timeframe_filter:
  enabled: true  # Enable multi-timeframe trend filtering
  higher_timeframe: "1h"  # Higher timeframe to check (1h)
  alignment_mode: "strict"  # Options: strict (only with trend), relaxed (allow neutral with reduced size)
  neutral_size_multiplier: 0.5  # Reduce size by 50% when 1h is neutral

# 2026 OPTIMIZATION: Order Book Imbalance (OBI) Filter
# Industry standard: OBI is the strongest microstructure feature for short-horizon prediction
# Predictive horizon: 1-60 seconds, signal lives in tails (heavily lopsided books)
# Expected win rate boost: 5-7 percentage points when combined with momentum
# Reference: https://algos.pro/posts/2026-03-16-order-book-imbalance-alpha-signals/
# Research findings: Higher volatility instruments require stricter thresholds (80-90%) to filter noise
# Source: https://quantstrategy.io/blog/order-book-imbalances-a-practical-guide-for-day-traders/
order_book_imbalance_filter:
  enabled: true  # Enable OBI filtering
  strong_threshold: 0.85  # 2026-07-03: Increased to 85% for crypto volatility (research: 80-90% for high-volatility assets)
  moderate_threshold: 0.3  # Threshold for moderate signal
  consistency_window_size: 20  # Rolling window size for directional consistency
  min_consistency_pct: 0.60  # 2026-07-03: Restored to 60% (research standard: 60%+ directional consistency required)
  max_staleness_ms: 5000  # Max 5 seconds staleness for OBI data
  top_levels: 5  # Use top 5 levels (most predictive for fast moves)
  
  # Per-asset strong thresholds (crypto volatility varies by asset)
  # BTC/ETH: deeper books, higher threshold required
  # SOL/XRP/DOGE: thinner books, slightly lower threshold
  per_asset_strong_threshold:
    BTC: 0.85  # High volatility, deep book
    ETH: 0.85  # High volatility, deep book
    SOL: 0.80  # High volatility, thinner book
    XRP: 0.80  # High volatility, thinner book
    DOGE: 0.80  # High volatility, thinnest book

# 2026 OPTIMIZATION: News Event Avoidance
# Industry standard: Avoid trading 15 minutes before and after high-impact news
# Major economic releases (NFP, CPI, rate decisions) cause extreme volatility
# that invalidates technical analysis and increases risk
# Reference: https://www.binarybrokerhub.com/en/blog/5-minute-binary-options-strategy
news_event_avoidance:
  enabled: true  # Enable news event avoidance
  avoidance_window_min: 15  # Avoid trading 15 minutes before/after news
  high_impact_events:  # List of high-impact event types to avoid
    - "NFP"  # Non-Farm Payrolls
    - "CPI"  # Consumer Price Index
    - "FOMC"  # Federal Reserve rate decisions
    - "GDP"  # Gross Domestic Product
    - "PPI"  # Producer Price Index
    - "Retail Sales"
    - "ISM Manufacturing"
    - "ISM Services"

# FRACTIONAL CONTRACT OVERRIDE: Allow 1 contract if max_notional is close to contract cost
# This enables trading with small bankrolls where percentage caps are too restrictive
# Set to 0.0 to disable override and enforce strict percentage-based sizing
fractional_contract_override_threshold: 0.5  # Allow 1 contract if max_notional >= 50% of contract cost
assets:
  BTC:
    max_notional_pct:
      value: 0.05  # 5% of capital for BTC (increased to allow 2-3 trades per session)
      dynamic: bankroll  # Computed from live bankroll via RiskEnvelopeService
      description: "Maximum notional as percentage of capital for BTC (computed from bankroll)"
    max_contracts:
      value: 2  # REDUCED: Max 2 contracts for BTC 15m (was 5 - safer exposure)
      static: profile
      description: "Maximum contracts for BTC (static for this profile)"
    # Edge thresholds based on 2026 volatility research (BTC: 45-55% vol, 1.5-3% intraday range)
    # Tier 1 (core assets): 4-5% min edge (INCREASED from 3-4% based on industry 20% edge standard)
    min_edge_early: 0.04  # INCREASED from 3% to 4% early edge
    min_edge_mid: 0.04  # INCREASED from 3% to 4% mid edge
    min_edge_late: 0.04  # INCREASED from 3% to 4% late edge
    min_edge_terminal: 0.05  # INCREASED from 4% to 5% terminal edge (tighter near expiry)
    # Distance-from-target filter
    max_distance_pct: 0.015  # 1.5% max distance for BTC (deep liquidity allows tighter bounds)
    # Liquidity and microstructure filters
    min_order_book_depth_usd: 1000.0  # Minimum order book depth in USD
    min_volume_24h_usd: 5000.0  # Minimum 24h volume in USD
    max_skew_ratio: 0.70  # Max price skew (avoid extreme 0.01/0.99 unless large edge)
    # NEW: Asset tier configuration
    asset_tier: 1  # Tier 1 (core assets: BTC, ETH)
    # Depth thresholds (contracts at best price) - single source of truth for 15m stack
    # CRITICAL FIX: Set to 1 contract since we only trade 1 contract per 15m window per asset
    # The gating condition is "can I fill 1 contract within slippage budget?" not "does book have 2-3 contracts"
    min_depth_yes: 1  # Minimum YES depth at best bid (contracts) - aligned with 1 contract per order
    min_depth_no: 1  # Minimum NO depth at best ask (contracts) - aligned with 1 contract per order
    
  ETH:
    max_notional_pct:
