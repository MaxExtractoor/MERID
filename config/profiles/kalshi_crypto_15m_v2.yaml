    rolling_1h_halt_pct: 0.04  # 4% halt (more stable)
    rolling_4h_halt_pct: 0.07  # 7% halt
  ETH:
    rolling_1h_halt_pct: 0.04  # 4% halt (more stable)
    rolling_4h_halt_pct: 0.07  # 7% halt
  # SOL/XRP: Moderate volatility
