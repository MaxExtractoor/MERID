    # Edge thresholds based on 2026 volatility research (DOGE: ~100% vol, sentiment-driven, highest beta 2.70)
    # Tier 2 (alt assets): 6-7% min edge (INCREASED from 5-6% based on industry 20% edge standard)
    min_edge_early: 0.06  # INCREASED from 5% to 6% early edge (highest for most volatile asset)
    min_edge_mid: 0.06  # INCREASED from 5% to 6% mid edge
    min_edge_late: 0.06  # INCREASED from 5% to 6% late edge
    min_edge_terminal: 0.07  # INCREASED from 6% to 7% terminal edge (tightest for most volatile asset)
    # Distance-from-target filter
    max_distance_pct: 0.030  # 3.0% max distance for DOGE (tightened from 4.0% - sentiment-driven needs precision)
