# ── Operation Mode (test vs prod) ────────────────────────────────────────────
# Controls daily loss limit and other risk parameters for testing vs production.
# - test: Relaxed daily loss limit for realistic live testing (e.g., 10% of bankroll)
# - prod: Conservative daily loss limit for production (e.g., 5% of bankroll)
# Set via environment variable MERID_OPERATION_MODE (default: prod)
operation_mode: prod  # Options: test, prod

# ── Sandbox/Dry-Run Mode (Extra 1) ─────────────────────────────────────────
# When enabled, orders are logged but NOT submitted to Kalshi API.
# Useful for testing strategies without risking real capital.
# Set to true for paper/demo mode, false for live trading.
dry_run: false

# ── Catalog Staleness Enforcement ───────────────────────────────────────────
# Controls whether catalog staleness (catalog_age > 60s) can halt trading.
# For kalshi_crypto_15m_v2, catalog is updated every cycle and per-market
# expiry/MD/depth checks provide sufficient safety. Catalog staleness is
# purely informational for this profile.
catalog_staleness_enforced: false

# ── Signal Mode Configuration ───────────────────────────────────────────────
# Controls the signal generation mode for trading decisions.
# - mean_reversion: Trade against overextensions (RSI overbought/oversold zones)
# - momentum_fvg: Trade with trend using Fair Value Gaps and Order Book Imbalance
# - hybrid: Allow both modes (default for maximum opportunity capture)
# - price_based: Turbine research winner - buy YES when price <= 0.50, sell when price >= 0.70
# 2026-07-05: Switched to momentum_fvg based on Turbine research - momentum was the only profitable family (78 of 100 strategies)
# Turbine research showed mean reversion failed completely (0 for 432 variants) on 15-minute markets
signal_mode: momentum_fvg  # Options: mean_reversion, momentum_fvg, hybrid, price_based, trend - 2026-07-05: Changed from trend to momentum_fvg based on Turbine research

# ── Phase 1 Profitability Enhancements ─────────────────────────────────────────
# YES/NO Sum Arbitrage, Market Making, and Correlation Tracking

# YES/NO Sum Arbitrage Configuration
# When YES+NO < 100c, buy both sides for risk-free profit
yes_no_arbitrage:
  enabled: true  # Set to true to enable arbitrage execution
  threshold_cents: 3  # Minimum arbitrage edge to execute (3c = 3%)
  max_size_contracts: 10  # Max contracts per arbitrage trade
  execution_timeout_ms: 500  # Max time to execute both sides (milliseconds)
  description: "YES/NO sum arbitrage: buy both sides when YES_ask + NO_bid < 100c"

# Market Making Configuration
# Liquidity provision to earn spread income
market_making:
  enabled: true  # Set to true to enable market making
  quoting_mode: "two_sided"  # Options: one_sided, two_sided
  spread_cents: 2  # Target spread in cents
  inventory_limit_contracts: 50  # Max inventory per asset
  skew_adjustment: true  # Adjust quotes based on inventory imbalance
  description: "Market making: provide liquidity and earn spread income"

# Correlation Tracking Configuration
# Reduce exposure when assets are highly correlated
# CRITICAL FIX: DISABLED for 15m crypto prediction markets
# These are prediction markets on crypto price movements, not spot crypto assets
# Correlation between prediction market outcomes differs from spot crypto correlation
# This was blocking multiple assets from trading in the same 15m window
correlation_tracking:
  enabled: false  # DISABLED: Was blocking multi-asset trading in 15m window
  threshold: 0.5  # Correlation threshold for exposure reduction
  max_reduction: 0.4  # Reduce to 40% of combined cap at perfect correlation
  window_days: 30  # Rolling window for correlation calculation
  description: "Correlation tracking: DISABLED for 15m crypto prediction markets"
  # 2026 RESEARCH-BASED: Correlation-aware risk management
  real_time_monitoring: true  # Real-time correlation monitoring (not static intervals)
  threshold_high: 0.80  # Treat as ONE position when >0.80 correlation
  threshold_moderate: 0.50  # Reduce size by correlation % when 0.50-0.80
  threshold_alert: 0.85  # Alert + 50% size reduction at 0.85
  max_correlated_assets: 3  # Never exceed 3 assets with >0.80 correlation
  position_sizing_rules:
    highly_correlated: "treat_as_one_position"  # >0.80
    moderate_correlated: "reduce_by_correlation_pct"  # 0.50-0.80
    low_correlated: "full_size_allowed"  # <0.50

# Offset Hedging Configuration
# When holding YES, buy NO in same market to cap downside while preserving upside
# 2026-07-05: Disabled based on research - binary contracts are inefficient for hedging crypto
# Research findings: Binary payouts are structurally mismatched for linear loss hedging
# For assets with public markets (BTC/ETH/SOL/XRP/DOGE), options are more efficient
# Prediction markets are better suited for events without corresponding public market prices
offset_hedging:
  enabled: false  # DISABLED: Binary hedging inefficient for crypto with public markets
  hedge_ratio: 0.30  # 30% hedge, 70% conviction (0.30 = 30%)
  min_edge_for_hedge: 0.03  # Only hedge when edge >= 3% (0.03 = 3%)
  max_hedge_notional_pct: 0.02  # Max 2% of equity for hedge (0.02 = 2%)
  rebalance_threshold: 0.05  # Rebalance when probability drifts > 5% (0.05 = 5%)
  min_hedge_contracts: 1  # Minimum 1 contract for hedge
  max_hedge_contracts: 3  # Maximum 3 contracts for hedge
  description: "Offset hedge: buy NO when holding YES to cap downside (DISABLED - inefficient for crypto)"

# Trailing Stop Configuration
# Dynamic stop-loss that follows price to lock in profits
trailing_stop:
  enabled: true  # Set to true to enable trailing stop
  trailing_distance_cents: 5  # 5 cents trailing distance (normal)
  trailing_distance_cents_profit_zone: 2  # 2 cents trailing distance in 80-85c profit zone (aggressive)
  min_profit_cents: 12  # Only activate after 12c profit (align with 2026 research: 10-15¢ threshold to avoid noise-triggered exits)
  activation_delay_sec: 30  # Wait 30s before activating
  profit_zone_activation_cents: 80  # Activate aggressive trailing when price crosses 80c
  description: "Trailing stop: lock in profits as price moves favorably (tightens to 2c in 80-85c zone)"

# Dynamic Risk Configuration
# Volatility-regime based stop-loss cents for dynamic risk engine
dynamic_risk:
  sl_cents_low_vol: 6  # Tight SL in low volatility (6 cents)
  sl_cents_normal_vol: 8  # Standard SL in normal volatility (8 cents)
  sl_cents_high_vol: 10  # Wide SL in high volatility (10 cents)
  description: "Dynamic risk: volatility-regime based stop-loss cents"

# Ratchet Profit Floor Configuration
# Research-backed mechanism to lock in profits when price reaches high threshold
# Prevents giving back significant gains when 99¢ TP is not guaranteed
# 2026-07-05: Added position trimming to derisk when >1 contract and price >80c
# CRITICAL FIX: 2026-07-06 - Removed mandatory_exit_at_99c (redundant, handled by position-level extreme profit)
ratchet_profit_floor:
  enabled: true  # Enable ratchet profit floor mechanism
  activation_threshold_cents: 85  # Activate ratchet when price hits this threshold
  floor_offset_cents: 5  # Set floor X cents below activation (e.g., 85¢ activation → 80¢ floor)
  force_exit_on_floor_breach: true  # Mandatory exit if price drops to floor
  min_hold_after_activation_sec: 30  # Prevent immediate exit on noise (seconds)
  trim_position_enabled: true  # Trim position when >1 contract and price >80c
  trim_threshold_cents: 80  # Trim when price crosses this threshold
  trim_to_contracts: 1  # Trim to 1 contract to lock in profits
  description: "Ratchet profit floor: lock in profits at high price thresholds to prevent giving back gains"

# Staged Time-Based Exit Configuration
# Partial exits at time intervals for volatile markets
staged_time_exit:
  enabled: false  # DISABLED: Bypasses PositionMonitor - TODO: Re-implement in PositionMonitor
  # Staged exits: [minutes, percent_to_close]
  # Example: At 5 min close 40%, at 10 min close 30%, at 13 min close remaining 30%
  stages:
    - minutes: 5
      percent: 40
    - minutes: 10
      percent: 30
    - minutes: 13
      percent: 30
  description: "Staged time exits: partial liquidation at time intervals (DISABLED - bypasses PositionMonitor)"

# Dynamic Take Profit Zones Configuration
# Laddered exit targets based on entry price for consistent profit taking
# This strategy ensures frequent small wins and reduces all-or-nothing risk
dynamic_take_profit:
  enabled: true  # Enable dynamic take profit zones
  # Zones: [entry_min, entry_max, exit_target, exit_type]
  # exit_type: "limit" (resting order) or "market" (immediate execution)
  zones:
    - entry_min: 25
      entry_max: 30
      exit_target: 55  # 25-30c profit
      exit_type: "limit"
    - entry_min: 30
      entry_max: 40
      exit_target: 65  # 25-35c profit
      exit_type: "limit"
    - entry_min: 40
      entry_max: 50
      exit_target: 75  # 25-35c profit
      exit_type: "limit"
    - entry_min: 50
      entry_max: 60
      exit_target: 85  # 25-35c profit
      exit_type: "limit"
    - entry_min: 60
      entry_max: 70
      exit_target: 95  # 25-35c profit
      exit_type: "limit"
  # Edge quality adjustment: Higher edge = higher exit target
  edge_adjustment_enabled: true
  edge_high_threshold: 0.05  # 5% edge = high quality
  edge_high_multiplier: 1.1  # Increase target by 10% for high edge
  edge_low_threshold: 0.02  # 2% edge = low quality
  edge_low_multiplier: 0.9  # Decrease target by 10% for low edge
  description: "Dynamic take profit: laddered exits based on entry price for consistent profits"

# Dynamic Position Sizing Configuration
# Scale position size based on edge and confidence
dynamic_sizing:
  enabled: false  # DISABLED: Dynamic sizing multipliers interfere with fixed $1 slot allocation model
  base_contracts: 1  # Base size
  edge_multiplier: 2.0  # 2026-07-05: Increased from 0.5 to 2.0 (4x) based on Turbine research - amplify edge impact for small velocity-based edges
  confidence_multiplier: 1.0  # 2026-07-05: Increased from 0.3 to 1.0 (3.3x) based on Turbine research - amplify confidence impact
  max_contracts: 1  # HARD RULE (2026-07-06): 1 contract per order (per-asset limits take precedence)
  min_contracts: 1  # Min contracts per trade
  description: "Dynamic sizing: scale position based on edge and confidence (2026 research-tuned) - DISABLED to prevent interference with fixed $1 slot allocation"

# Order Scaling Configuration
# Institutional-grade scaling strategies (TWAP, iceberg, adaptive)
# Splits large orders into child orders to reduce market impact and signaling
# 2026-07-09: DISABLED - conflicts with 1-contract-per-order slot-based model
# Order scaling requires orders >= 3 contracts, but slot model enforces 1 contract max
order_scaling:
  enabled: false  # DISABLED: Conflicts with 1-contract-per-order slot-based model
  strategy: "adaptive"  # Strategy: "twap", "iceberg", "adaptive"
  min_child_orders: 2  # Minimum number of child orders
  max_child_orders: 5  # Maximum number of child orders
  time_window_seconds: 300.0  # Time window for execution (5 minutes)
  participation_rate: 0.10  # Max 10% of market volume
  visible_pct: 0.10  # Iceberg: 10% visible
  edge_threshold: 0.02  # 2% edge minimum for scaling
  size_threshold_contracts: 1  # 2026-07-09: Reduced from 3 to 1 (but scaling is disabled)
  description: "Order scaling: TWAP/iceberg/adaptive for large orders - DISABLED for slot-based model"

# ── Momentum/FVG Mode Parameters ───────────────────────────────────────────
# Parameters for momentum_fvg signal mode (when enabled)
# Tuned specifically for Kalshi 15m crypto microstructure
momentum_fvg:
  # RSI thresholds for momentum (not overextended, but directional)
  momentum_rsi_long_min: 55  # Bullish momentum: RSI > 55
  momentum_rsi_short_max: 45  # Bearish momentum: RSI < 45
  
  # MACD histogram thresholds
  momentum_min_macd_hist_long: 0  # For longs: MACD histogram >= 0
  momentum_min_macd_hist_short: 0  # For shorts: MACD histogram <= 0
  
  # MACD histogram dead zone (2026 research-based optimization)
  # Prevents noise trading when histogram is near zero (no clear momentum)
  # CRITICAL FIX: 2026-07-08 - Set to 0.0 to disable dead zone during warmup
  # During warmup, MACD histogram values are very small (near zero) due to insufficient data
  # CRITICAL FIX: 2026-07-12 - Enable MACD dead zone to prevent noise trading
  # Dead zone prevents trading when MACD histogram is near zero (no clear momentum)
  # Set to 0.0001 (0.01% of price) to filter out weak signals while allowing valid momentum
  # Previous 0.0 was allowing noise trading on tiny MACD movements
  macd_dead_zone: 0.0001  # 0.01% of price - filter weak momentum signals
  
  # Order Book Imbalance (OBI) parameters - Kalshi-specific per-asset thresholds
  # OBI = (BidContracts_10c - AskContracts_10c) / (BidContracts_10c + AskContracts_10c)
  obi_min: 0.25  # Minimum absolute OBI to qualify as directional (not noise)
  obi_persistence_min: 0.6  # Minimum fraction of snapshots with consistent OBI sign (60%)
  obi_persistence_window_sec: 10  # Time window for persistence check (10 seconds)
  obi_ewma_alpha: 0.15  # EWMA smoothing factor (0.15 = ~7 snapshot effective window)
  
  # Per-asset OBI strong thresholds (Kalshi books are thinner than spot)
  obi_strong_btc: 0.55  # BTC: strong imbalance threshold
  obi_strong_eth: 0.55  # ETH: strong imbalance threshold
  obi_strong_sol: 0.45  # SOL: strong imbalance threshold (thinner book)
  obi_strong_xrp: 0.45  # XRP: strong imbalance threshold (thinner book)
  obi_strong_doge: 0.45  # DOGE: strong imbalance threshold (thinner book)
  
  # Per-asset EWMA alpha (tuned per asset depth/flicker)
  obi_ewma_alpha_btc: 0.15  # BTC: more depth, more flicker, smoother
  obi_ewma_alpha_eth: 0.15  # ETH: more depth, more flicker, smoother
  obi_ewma_alpha_sol: 0.20  # SOL: less depth, quicker reaction
  obi_ewma_alpha_xrp: 0.20  # XRP: less depth, quicker reaction
  obi_ewma_alpha_doge: 0.20  # DOGE: less depth, quicker reaction
  
  # Fair Value Gap (FVG) parameters - Kalshi 15m constraints
  # CRITICAL: These are the single source of truth for FVG configuration
  # Previously used environment variables (MERID_FVG_*), now consolidated to profile YAML
  fvg_window_size: 20  # Rolling window size for FVG detection (number of candles)
  fvg_min_gap_cents: 2.0  # Minimum gap size in cents to consider valid FVG
  fvg_fill_threshold_cents: 5.0  # Distance threshold to consider FVG as filling
  fvg_atr_period: 14  # ATR period for FVG strength calculation
  fvg_max_age_bars: 4  # Maximum age of FVG in bars (15m bars, 4 bars = 60min)
  fvg_min_size_ticks: 3  # Minimum FVG size in ticks to consider valid
  fvg_min_time_to_expiry_min: 30  # Minimum time to expiry to use FVG for new entries (30min)
  
  # Trend confirmation
  require_ema_stack: true  # Require EMA stack alignment (fast > slow for longs)
  require_price_vs_ema50: true  # Require price above/below EMA50 for direction
  require_price_vs_ema200: true  # Require price above/below EMA200 for macro regime (2026 research)
  
  # 2026 research-based indicator enhancements
  # EMA(200) macro trend filter
  ema_200_period: 200  # EMA(200) period for macro regime classification
  
  # Regime-based RSI threshold shifting
  # CRITICAL FIX: 2026-07-12 - Scaled thresholds for RSI(14) instead of RSI(8)
  # RSI(14) is less sensitive than RSI(8), so thresholds adjusted accordingly
  # Standard (range regime): 70/30 (optimal for 15-minute charts per research)
  # Bull regime: 75/35 (slightly wider to stay in trades longer during uptrends)
  # Bear regime: 65/25 (slightly tighter to exit faster during downtrends)
  regime_based_rsi_enabled: true  # Enable regime-based RSI threshold shifting
  rsi_bull_oversold: 35.0  # Bull regime oversold threshold (shifted up to stay in trades longer)
  rsi_bull_overbought: 75.0  # Bull regime overbought threshold (shifted up)
  rsi_bear_oversold: 25.0  # Bear regime oversold threshold (shifted down to exit faster)
  rsi_bear_overbought: 65.0  # Bear regime overbought threshold (shifted down)
  
  # MACD zero-line filter
  # CRITICAL FIX: 2026-07-12 - Disabled to allow mean-reversion signals
  # Zero-line filter was blocking all signals when MACD was negative, even with oversold RSI
  # For 15-minute prediction markets, use MACD as confirmation, not a hard gate
  macd_zero_line_filter_enabled: false  # Disabled - use MACD as confirmation, not hard gate
  
  # MACD histogram momentum filter
  macd_histogram_momentum_filter_enabled: true  # Enable MACD histogram momentum filter
  macd_histogram_expansion_bars: 2  # Require N bars of histogram expansion for confirmation
  
  # RSI+MACD confluence scoring
  rsi_macd_confluence_enabled: true  # Enable RSI+MACD confluence scoring (boost when both agree)
  
  # Liquidity-aware size scaling (Kalshi-specific tiers)
  # Based on depth_10c_yes and depth_10c_no from orderbook
  liquidity_tiers:
    high_threshold: 200  # High liquidity: >=200 contracts (deep BTC 15m)
    high_size_factor: 1.0  # Use full profile risk
    medium_threshold: 80  # Medium liquidity: 80-200 contracts
    medium_size_factor: 0.75  # 75% of profile risk
    low_threshold: 40  # Low liquidity: 40-80 contracts
    low_size_factor: 0.5  # 50% of profile risk
    ultra_low_threshold: 25  # Ultra-low liquidity: 25-40 contracts
    ultra_low_size_factor: 0.25  # 25% of profile risk
    min_threshold: 25  # Below this: no new entries
    min_size_factor: 0.0  # No new entries
  
  # Spread guard interaction with momentum
  # If spread exceeds this, require higher OBI persistence for momentum entries
  spread_gate_cents: 10  # 2026-07-12: ALIGNED with industry research - 10c gate for momentum (industry: 8-10c quality filter for 15m crypto)
  spread_gate_obi_persistence_boost: 0.75  # Require 75% persistence if spread is wide

# ── Price-Based Strategy Parameters (2026 Optimized for Swing Trading) ───────────
# Optimized for swing trading: wider entry range to capture YES/NO reversals
# 2026 findings: swing trading requires wider entry zones to maximize reversal opportunities
# Previous 0.52/0.68 range (16¢ no-trade zone) was too restrictive for swing mode
# OPTIMIZED: 0.48/0.72 range (12¢ no-trade zone) for better swing opportunity capture
# This allows entering YES at 48¢ and NO at 72¢, maximizing swing potential
price_based:
  buy_threshold: 0.48  # Buy YES when price <= 0.48 (lowered from 0.52 for swing mode)
  sell_threshold: 0.72  # Buy NO when price >= 0.72 (raised from 0.68 for swing mode)

# ── Hybrid Mode Price Caps (2026 Optimized) ───────────────────────────────
# Hybrid mode combines momentum signals with price discipline
# Research: Buying at 90-99¢ for 4-33¢ profit is poor risk/reward (9.6% return)
# Industry standard: Minimum 20% edge required for viable trading
# Kalshi guide: "An Up contract for $0.85 means you will only make $0.15 profit"
# Solution: Enforce price caps to prevent overpriced entries while keeping momentum signals
hybrid:
  max_entry_price_yes: 0.70  # 2026-07-04: Reduced from 80¢ to avoid highest fee zone (fees peak at 50¢, lower at 70¢)
  min_entry_price_no: 0.30  # 2026-07-04: Increased from 20¢ for symmetry with 70¢ YES cap (avoids extreme low-fee but illiquid zone)
  # Rationale: Based on Kalshi 2026 guide, 85¢ is typical market price. 80¢ cap allows trading while still avoiding extreme 90-99¢ poor risk/reward entries

# ── Sentiment Isolation (Single Source of Truth) ────────────────────────────
# For kalshi_crypto_15m_v2 profile, sentiment-based trading is disabled.
# This is the single source of truth for sentiment configuration in the 15m stack.
# All other sentiment-related code paths (env vars, trading_agent nulling, etc.)
# are considered redundant and should defer to this configuration.
sentiment_isolation:
  enable_sentiment_execution: false  # Sentiment-based trading disabled for 15m crypto
  sentiment_mode: disabled  # Explicitly set to disabled

# ── Drawdown Semantics ───────────────────────────────────────────────────────
# Time horizon: "since process start" (not rolling window)
# - Peak equity tracks highest equity since FastAPI startup
# - Drawdown is computed as (peak - current) / peak
# - Fresh start resets peak equity to current equity
#
# PnL basis: "equity including open positions" (realized + unrealized)
# - Uses Kalshi account balance (total equity)
# - Not based on realized PnL only
#
# Deposits/Withdrawals:
# - Deposits: treated as PnL (increase equity, may update peak)
# - Withdrawals: treated as PnL (decrease equity, peak unchanged)
# - This ensures drawdown reflects actual account performance
#
# Fresh Start Behavior:
# - When MERID_FRESH_START=1, peak_equity resets to current_equity
# - This prevents old drawdown state from persisting across sessions
drawdown_semantics:
  time_horizon: "since_process_start"
  pnl_basis: "equity_including_positions"
  deposit_withdrawal_treatment: "as_pnl"

# ── Global Capital and Cycle Risk ────────────────────────────────────────
# Capital for this strategy. Set to 0 to derive from live Kalshi bankroll API.
# For paper/demo mode, you can set a fixed value (e.g., 10000.0).
# For live trading, set to 0 to use actual account balance.
# For validation/calibration mode, set to fixed value (e.g., 50.0) to ensure consistent caps regardless of live balance.
capital_usd: 0  # Live mode: derive from live Kalshi equity via router/bankroll engine

# Minimum trade size (floor) - single source of truth for all agents
min_notional_usd: 0.50  # Minimum notional per trade (uniform for all account sizes)
min_contracts: 1  # Minimum 1 contract per trade (Kalshi venue invariant)

# Fallback pricing configuration
# When live market data is unavailable, the system can use a fallback price (50c)
# DISABLED: Fallback trades are not allowed in production (Task 32: Remove temporary flag)
# Live market data is required for all trading decisions
allow_fallback_trades: false  # DISABLED: Require live market data
max_fallback_notional_usd: 0.35  # If fallback allowed, cap at min_notional (unused when disabled)
max_fallback_cycles: 0  # DISABLED: No fallback cycles allowed

# 2026-07-08 UPDATE: Percentage-based cycle risk limits DISABLED in favor of fixed $1 exposure model
# max_cycle_risk_pct DISABLED - using fixed $1 exposure cap instead
# guardrails_per_window_risk_pct DISABLED - using fixed $1 exposure cap instead
# guardrails_total_venue_risk_pct DISABLED - using fixed $1 exposure cap instead
# max_total_risk_pct DISABLED - using fixed $1 exposure cap instead
# max_cycle_risk_usd DISABLED - using fixed $1 exposure cap instead
max_cycle_risk_pct: 0.0  # DISABLED - set to 0.0 to satisfy profile validation (not used in fixed $1 model)

# Fixed $1 exposure cap is enforced via:
# - risk_policy.fixed_exposure_cap_usd: 1.00
# - Sequential trading (blocks new entries until positions exit)
# - Slot-based position management (sum of contract prices ≤ $1)

# ── Venue-Level Caps (Kalshi) ──────────────────────────────────────────────
# 2026-07-08 UPDATE: Percentage-based venue caps DISABLED in favor of fixed $1 exposure model
# max_total_notional_pct DISABLED - using fixed $1 exposure cap instead
# max_category_notional_pct DISABLED - using fixed $1 exposure cap instead
# max_single_order_pct DISABLED - using fixed $1 exposure cap instead
# bankroll_cap_pct DISABLED - using fixed $1 exposure cap instead
venue:
  name: kalshi
  # All percentage-based venue caps replaced with fixed $1 exposure model
  # Risk is now enforced via:
  # - risk_policy.fixed_exposure_cap_usd: 1.00
  # - Sequential trading (blocks new entries until positions exit)
  # - Slot-based position management (sum of contract prices ≤ $1)
  
  # REMOVED: Conflicting rate limits - now handled by throttling section (single source of truth)
  # - max_orders_per_minute: replaced by throttling.global_orders_limit (5/min)
  # - max_orders_per_hour: replaced by throttling.max_orders_per_15m_window (5 per 15m)

# ── Universe Liquidity Filters ───────────────────────────────────────────────
# Liquidity thresholds for the KalshiUniverse layer (coarse prefilter).
# These are tuned for the 15m crypto universe (exactly 5 markets per asset cycle).
# More stringent microstructure checks are applied downstream in candidate optimizer/risk layer.
universe:
  min_volume: 5  # Minimum 5 contracts volume (relaxed from default 50 for 15m crypto)
  min_open_interest: 1  # Minimum 1 contract open interest (relaxed from default 10)
  max_spread_cents: 20  # 2026-07-12: ALIGNED with industry research - 20c max for 15m crypto (industry: 15-20c for short-duration markets, 5-10c for liquid markets)
  description: "Coarse liquidity prefilter for 15m crypto markets - tuned for exactly 5 markets per asset"

# ── Throttling (Order Rate Limits) ───────────────────────────────────────────
# Global and per-asset throttling to prevent order spam and ensure orderly execution.
# These replace hardcoded values in agent_grid_15m.py with profile-driven configuration.
# BALANCED SETTINGS: Optimized based on industry comparison (Polymarket 15m bot uses 30s with 93% WR)
throttling:
  global_orders_window_sec: 60  # Rolling window for global order limit (seconds)
  global_orders_limit: 30  # INCREASED: Max 30 orders per minute globally (up from 15 - for more opportunities across 5 assets)
  per_asset_cooldown_sec: 3  # OPTIMIZED: 3s cooldown per asset (aligned with Polymarket 15m industry standard - was 8s, now 3s)
  per_strip_notional_usd: 0.0  # Max notional per strip (0.0 = disabled, set if needed)
  max_orders_per_15m_window: 24  # INCREASED: Max 24 orders per 15m window (up from 12 - allows 2.4 trades/asset/window for 15m opportunity capture)
  
  # REMOVED: Conflicting top-N limits - now handled by guardrails section (single source of truth)
  # - per_strip_order_limit: replaced by guardrails.max_orders_per_cycle
  # - max_trades_per_cycle_global: replaced by guardrails.max_orders_per_cycle
  # - max_trades_per_cycle_asset: replaced by guardrails.max_orders_per_cycle
  
  cooldown_after_loss_cycles: 2  # No new entry for 2 cycles (30s) after a loss in that asset (relaxed from 4)
  consecutive_loss_pause: 3  # Pause after 3 consecutive losses (industry standard for behavioral risk control)
  max_session_risk_pct: 0.10  # Max 10% session risk (prevents overexposure in single session)

# ── Failsafe Configuration ───────────────────────────────────────────────────
# Emergency brake when market data is degraded (catalog stuck but MD fresh).
# This is separate from normal strip limits and should be clearly logged when active.
failsafe:
  max_contracts_per_order: 1  # Max contracts per order when in failsafe mode (emergency brake)

# ── Price Range Validation (Critical Risk Control) ─────────────────────────────
# Prevents degenerate trades at extreme prices (1 cent or 89-99 cents)
# This is the single source of truth for price validation across the system
# Orders outside this range will be rejected at the order router level
# UPDATED: 10-70c range for momentum-based trading
# Research findings (2026-07-04):
# - Prediction markets have hidden liquidity problems - quoted price ≠ tradeable price for size
# - Mid-range prices (50-70c) have better depth to absorb scaled child orders
# - Low prices (<50c) = lottery tickets with 10.4% win rate, thin markets
# - 10-75c range matches actual market conditions (YES prices 60-97c observed in current market)
# - High prices (>70c) = low profit potential, thin markets, poor scaling effectiveness
# - Scaling requires sufficient liquidity to avoid excessive slippage on child orders
# - For momentum-based trading, conviction comes from velocity magnitude, not price level
# - 2026-07-12: Expanded to 75c max to match dynamic_take_profit zones (25-70c) and actual market conditions
price_range:
  min_price_cents: 10  # 2026-07-12: Lower bound (10c) maintained for low-profit trap prevention
  max_price_cents: 75  # 2026-07-12: Expanded from 50c to 75c - YES prices consistently 60-97c in current market conditions
  description: "Valid price range in cents for order execution (10-75c - aligned with dynamic_take_profit zones and actual market conditions)"

# ── Per-Asset Caps (BTC/ETH/SOL/XRP/DOGE) ─────────────────────────────────
# Each asset has its own notional as percentage of capital, NOT hardcoded USD values.
# Edge thresholds override crypto_threshold_matrix.yaml for this profile.
# MINIMUM FLOOR: max_notional_usd will be at least min_notional_usd regardless of bankroll size
# This ensures trades are possible even with small bankrolls (e.g., $31.36)
# Set to 0.0 to disable floor and use pure percentage-based sizing
# 2026-07-05: Reduced to 0.10 to remove blocking constraint on legitimate trades
min_max_notional_usd: 0.10  # Minimum floor for per-asset max_notional (reduced from 0.50 to allow sweet-spot trading)

# 2026 OPTIMIZATION: Per-asset minimum decision minute (skip noisy early signals)
# Industry standard (GRDazzle bot): Skip first N minutes of 15m window to avoid noise
# This prevents low-quality signals from early price action
# Phase 1B (2026-07-11): Reduced to 0 minutes for all assets to capture full 15-minute window
# With faster aggregation (15s) and spot refresh (3s), the system can now handle early window signals
# more effectively without excessive noise. This maximizes signal capture in fast-moving markets.
min_decision_minute:
  BTC: 0  # Phase 1B: Reduced from 0.5 to 0 - capture full window with optimized timing stack
  ETH: 0  # Phase 1B: Reduced from 0.5 to 0 - capture full window with optimized timing stack
  SOL: 0  # Phase 1B: Reduced from 0.5 to 0 - capture full window with optimized timing stack
  XRP: 0  # Phase 1B: Reduced from 0.5 to 0 - capture full window with optimized timing stack
  DOGE: 0  # Phase 1B: Reduced from 0.5 to 0 - capture full window with optimized timing stack

# 2026 OPTIMIZATION: Volatility-Regime Edge Adjustment
# Industry standard: Adjust edge thresholds based on volatility regime
# Low volatility: reduce min edge by 0.5% (more opportunities)
# High volatility: increase min edge by 1.0% (higher quality signals)
volatility_regime_edge_adjustment:
  enabled: false  # DISABLED: 2026-07-10 - Prevents edge crushing to 0.01%
  # Research shows DOGE with 100% annual vol should never be in low vol regime
  # The adjustment logic was incorrectly reducing edges below minimum viable thresholds
  # Per-asset edge thresholds in profile are already calibrated for asset volatility
  lookback_days: 30  # 30-day rolling window for volatility calculation
  low_volatility_threshold: 0.30  # Below 30-day avg = low volatility
  high_volatility_threshold: 0.70  # Above 30-day avg = high volatility
  # Edge adjustments (FIXED - smaller adjustments to avoid crushing edges)
  low_volatility_adjustment: -0.0025  # Reduce min edge by 0.25% in low vol (was 0.5% - too aggressive)
  high_volatility_adjustment: +0.005  # Increase min edge by 0.5% in high vol (was 1.0% - too aggressive)
  description: "Volatility-regime edge adjustment: adapt thresholds to market conditions (FIXED)"

# 2026 OPTIMIZATION: Portfolio Heat Tracking
# Industry standard: Track aggregate exposure considering correlation
# Prevents concentration risk and correlation convergence disasters
portfolio_heat:
  enabled: true  # Enable portfolio heat tracking
  calculation_method: "correlation_adjusted_exposure"  # Account for correlation in exposure
  heat_threshold_warning: 0.70  # 70% of max adjusted exposure = warning
  heat_threshold_critical: 0.85  # 85% of max adjusted exposure = critical
  # Heat response
  warning_response: "reduce_new_positions_by_25pct"  # Reduce new positions by 25%
  critical_response: "reduce_new_positions_by_50pct"  # Reduce new positions by 50%
  description: "Portfolio heat tracking: correlation-adjusted exposure monitoring"

# 2026 OPTIMIZATION: Time-of-Day Risk Scaling
# DISABLED: Time-of-day scaling interferes with fixed $1 slot allocation model
# Industry standard: Adjust risk based on session liquidity
# US market hours: 100% risk, Asian: 80%, European: 90%, Weekend: 50%
time_of_day_risk_scaling:
  enabled: false  # DISABLED: interferes with fixed $1 slot allocation model
  # RE-ENABLE RISKS: If re-enabled, must update risk envelope to account for time-based scaling
  # and ensure fixed $1 exposure cap is still respected after multiplier
  # RE-ENABLE REQUIREMENTS: Update kalshi_crypto_15m_risk_envelope.py to apply time_of_day_multiplier
  # to risk limits, not just order sizes
  us_market_hours: "09:30-16:00 ET"  # US market hours
  asian_session: "20:00-02:00 ET"  # Asian session
  european_session: "02:00-09:30 ET"  # European session
  # Risk multipliers (REGIME-BASED: volatility-aware instead of fixed weekend)
  us_market_multiplier: 1.0  # 100% risk during US hours
  asian_multiplier: 0.8  # 80% risk during Asian session (lower liquidity)
  european_multiplier: 0.9  # 90% risk during European session
  weekend_multiplier: 0.8  # 80% risk during weekend (relaxed from 0.5 - use volatility regime instead)
  description: "Time-of-day risk scaling: DISABLED - interferes with fixed $1 slot allocation"

# 2026 OPTIMIZATION: Per-Asset Rolling PnL Limits
# Industry standard: Asset-specific rolling PnL limits based on volatility
# More volatile assets get tighter limits, stable assets get looser limits
