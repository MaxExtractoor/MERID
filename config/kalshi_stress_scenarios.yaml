# Kalshi-Specific Stress Scenarios for 15m Crypto Pipelines
#
# These scenarios target actual edge cases in Kalshi prediction markets:
# - CPI/FOMC days (high volatility, regime shifts)
# - ETF announcements (binary outcome events)
# - Regulatory news (sentiment shocks)
# - Market dislocations (liquidity crunches)
#
# Each scenario includes modifiers to historical data that simulate these conditions.

version: "1.0"

scenarios:
  # CPI Announcement Day
  - name: cpi_announcement_day
    description: "CPI release causes sharp volatility spike and regime shift"
    asset: BTC
    event_type: macro_economic
    event_window_minutes: 30  # 15m before and after announcement
    modifiers:
      volatility_multiplier: 3.0  # 3x normal volatility
      regime_shift: true  # Trend reversal likely
      sentiment_shock: -0.3  # Initial bearish shock
      liquidity_reduction: 0.4  # 40% less liquidity
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT  # News API overwhelmed
        - CRYPTO_SOCIAL_FLOW  # Social sentiment delayed
    expected_behavior:
      pipeline_should: "degrade_gracefully"  # Use reduced feature bundle
      risk_check_should: "veto_large_positions"  # Size down on uncertainty
      confidence_should: "decrease_by_0.3"  # Lower confidence on high vol

  # FOMC Meeting
  - name: fomc_decision_day
    description: "Fed rate decision causes cross-asset correlation spike"
    asset: BTC
    event_type: macro_economic
    event_window_minutes: 45
    modifiers:
      volatility_multiplier: 2.5
      cross_asset_correlation: 0.9  # BTC moves with USD assets
      regime_shift: true
      sentiment_shock: 0.2  # Initial bullish shock if dovish
      liquidity_reduction: 0.3
      feature_agent_failures:
        - CRYPTO_MACRO_CONTEXT  # Macro signals delayed
    expected_behavior:
      pipeline_should: "use_macro_features_as_primary"
      risk_check_should: "reduce_exposure"
      confidence_should: "decrease_by_0.2"

  # Bitcoin ETF Approval/Rejection
  - name: btc_etf_announcement
    description: "Binary ETF outcome causes extreme sentiment swing"
    asset: BTC
    event_type: binary_event
    event_window_minutes: 60
    modifiers:
      volatility_multiplier: 5.0  # Extreme volatility
      sentiment_shock: 0.8  # Massive bullish or bearish shock
      regime_shift: true
      liquidity_reduction: 0.5  # Liquidity crunch
      orderbook_imbalance: true  # One-sided orderbook
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT  # News API rate limited
        - SENTIMENT_VOL_BREAKOUT_CRYPTO  # Volatility model breaks
    expected_behavior:
      pipeline_should: "fail_closed_if_confidence_low"  # No trade if uncertain
      risk_check_should: "veto_all_trades"  # Extreme risk
      confidence_should: "decrease_by_0.5"

  # SEC Regulatory Action
  - name: sec_regulatory_enforcement
    description: "SEC enforcement causes sentiment crash"
    asset: BTC
    event_type: regulatory
    event_window_minutes: 90
    modifiers:
      volatility_multiplier: 2.0
      sentiment_shock: -0.7  # Severe bearish shock
      regime_shift: true
      liquidity_reduction: 0.6
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT  # News API overwhelmed
        - CRYPTO_SOCIAL_FLOW  # Social sentiment delayed
    expected_behavior:
      pipeline_should: "use_sentiment_as_primary_signal"
      risk_check_should: "veto_long_positions"
      confidence_should: "decrease_by_0.4"

  # Stablecoin Depeg Event
  - name: stablecoin_depeg
    description: "Major stablecoin depeg causes cross-crypto contagion"
    asset: BTC
    event_type: contagion
    event_window_minutes: 120
    modifiers:
      volatility_multiplier: 4.0
      cross_crypto_correlation: 0.95  # All cryptos move together
      sentiment_shock: -0.6
      liquidity_reduction: 0.7
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT
        - CRYPTO_SOCIAL_FLOW
        - CRYPTO_VOL_REGIME  # Volatility model breaks
    expected_behavior:
      pipeline_should: "use_volatility_features_as_primary"
      risk_check_should: "veto_all_trades"
      confidence_should: "decrease_by_0.6"

  # Exchange Outage
  - name: major_exchange_outage
    description: "Binance or Coinbase outage causes data gaps"
    asset: BTC
    event_type: infrastructure
    event_window_minutes: 60
    modifiers:
      data_gaps: true  # Missing OHLCV data
      price_feed_delay: 5000  # 5 second delay
      liquidity_reduction: 0.8
      feature_agent_failures:
        - BTC_MICROSTRUCTURE_1M  # No microstructure data
        - CRYPTO_VOL_REGIME  # No volatility data
    expected_behavior:
      pipeline_should: "proceed_with_higher_tf_only"
      risk_check_should: "reduce_size_by_50_percent"
      confidence_should: "decrease_by_0.3"

  # Flash Crash
  - name: flash_crash
    description: "Sudden 15% drop in 5 minutes"
    asset: BTC
    event_type: market_structure
    event_window_minutes: 15
    modifiers:
      volatility_multiplier: 10.0  # Extreme
      price_shock: -0.15  # 15% drop
      liquidity_evaporation: true  # No liquidity at bottom
      feature_agent_failures:
        - CRYPTO_VOL_REGIME  # Volatility model breaks
        - SENTIMENT_VOL_BREAKOUT_CRYPTO  # Breakout signal triggers falsely
    expected_behavior:
      pipeline_should: "fail_closed"
      risk_check_should: "veto_all_trades"
      confidence_should: "decrease_by_0.8"

  # ETH-Specific: Merge/Upgrade Event
  - name: eth_merge_upgrade
    description: "Ethereum protocol upgrade causes technical uncertainty"
    asset: ETH
    event_type: protocol
    event_window_minutes: 120
    modifiers:
      volatility_multiplier: 2.5
      sentiment_shock: 0.3  # Bullish on success
      regime_shift: true
      liquidity_reduction: 0.3
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT
    expected_behavior:
      pipeline_should: "use_sentiment_as_primary"
      risk_check_should: "normal_operation"
      confidence_should: "maintain"

  # SOL-Specific: FTX Contagion
  - name: sol_exchange_contagion
    description: "Exchange failure causes SOL-specific crash"
    asset: SOL
    event_type: exchange_risk
    event_window_minutes: 180
    modifiers:
      volatility_multiplier: 6.0
      sentiment_shock: -0.8
      liquidity_reduction: 0.9
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT
        - CRYPTO_SOCIAL_FLOW
        - CRYPTO_VOL_REGIME
    expected_behavior:
      pipeline_should: "fail_closed"
      risk_check_should: "veto_all_trades"
      confidence_should: "decrease_by_0.7"

  # XRP-Specific: Regulatory Ruling
  - name: xrp_regulatory_ruling
    description: "Court ruling on XRP status causes binary outcome"
    asset: XRP
    event_type: regulatory
    event_window_minutes: 60
    modifiers:
      volatility_multiplier: 4.0
      sentiment_shock: 0.6  # Bullish if favorable
      liquidity_reduction: 0.5
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT
    expected_behavior:
      pipeline_should: "use_sentiment_as_primary"
      risk_check_should: "normal_operation"
      confidence_should: "increase_by_0.2"

  # DOGE-Specific: Elon Musk Tweet
  - name: doge_celebrity_tweet
    description: "Celebrity endorsement causes meme coin pump"
    asset: DOGE
    event_type: social_viral
    event_window_minutes: 30
    modifiers:
      volatility_multiplier: 3.0
      sentiment_shock: 0.7
      liquidity_reduction: 0.2
      feature_agent_failures:
        - CRYPTO_NEWS_SENTIMENT  # News API doesn't capture tweets fast enough
    expected_behavior:
      pipeline_should: "use_social_features_as_primary"
      risk_check_should: "reduce_size"
      confidence_should: "decrease_by_0.3"

  # Gradual Drift: Low Volatility Regime
  - name: low_volatility_regime
    description: "Extended period of low volatility and low signal"
    asset: BTC
    event_type: regime
    event_window_minutes: 1440  # 24 hours
    modifiers:
      volatility_multiplier: 0.3  # 30% of normal
      signal_strength: 0.2  # Weak signals
      feature_agent_failures: []  # No failures
    expected_behavior:
      pipeline_should: "maintain_normal_operation"
      risk_check_should: "reduce_size"
      confidence_should: "decrease_by_0.1"

  # Gradual Drift: High Volatility Regime
  - name: high_volatility_regime
    description: "Extended period of elevated volatility"
    asset: BTC
    event_type: regime
    event_window_minutes: 1440
    modifiers:
      volatility_multiplier: 1.8
      signal_strength: 0.6
      feature_agent_failures: []
    expected_behavior:
      pipeline_should: "maintain_normal_operation"
      risk_check_should: "reduce_size"
      confidence_should: "maintain"

# Scenario Execution Settings
execution_settings:
  default_replay_speed: "realtime"  # realtime, 2x, 5x, 10x
  max_concurrent_scenarios: 3
  fail_on_scenario_error: false
  generate_report: true
  report_format: "json"  # json, html, pdf

# Performance Thresholds for Scenario Validation
performance_thresholds:
  max_sharpe_degradation: 0.15
  max_drawdown_increase: 0.03  # 3%
  min_decision_rate: 0.5  # At least 50% of cycles should generate decisions
  max_execution_failure_rate: 0.05  # Max 5% execution failures
  max_feature_sparsity: 0.5  # Max 50% missing features acceptable
