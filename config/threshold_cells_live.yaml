# Threshold-cell live registry — the ONLY cells the threshold-cell lane may admit.
#
# Promotion path (fail-closed):
#   scripts/cell_discovery_report.py      -> data/cell_discovery.json
#   scripts/cell_promotion_compiler.py    -> data/threshold_cell_candidates.json
#                                          + config/threshold_cells_candidates.yaml
#   explicit human/operator approval      -> THIS FILE (with approval block)
#
# A cell that is discovered or promoted-candidate but not listed here is NOT
# tradable.  Removing a row disables the cell at next process start; edits are
# picked up at import time (MERID_THRESHOLD_CELLS_CONFIG overrides the path).
#
# Lane contract applied to every row (immutable ExecutionPolicy):
#   required_post_only=True, allow_taker_fallback=False, max_reprice_attempts=1,
#   one open order per cell, per-cell daily fill/submission caps,
#   first-fill + rolling-markout suspension.

