      max_orders_per_window: 5
      max_notional_usd: 3000
      max_slippage_cents: 5
      min_depth_contracts: 3
      max_spread_cents: 20
    entry_window:
      minutes_before_expiry: 1440
      cutoff_minutes_before_expiry: 60

  - name: BTC_MONTHLY
    assets: [BTC]
    timeframes: [monthly]
    archetype: directional
    risk_limits:
      max_orders_per_window: 5
      max_notional_usd: 4000
      max_slippage_cents: 5
      min_depth_contracts: 2
      max_spread_cents: 25
    entry_window:
      minutes_before_expiry: 10080      # 1 week
