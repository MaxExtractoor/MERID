venue:
  name: kalshi
  base_url: https://api.elections.kalshi.com/trade-api/v2
  use_demo: false
  max_notional_per_expiry_usd: 1000
  max_open_markets_per_asset: 20
session:
  maintenance_day: 3
  maintenance_start_et: 03:00
  maintenance_end_et: 05:00
agents:
- name: BTC_15M
  assets:
  - BTC
  timeframes:
  - 15m
  archetype: directional
  strategy:
    # Aggressively conservative: 15m BTC is highest-frequency, highest noise.
    # Terminal phase kept at 3% to avoid chasing near-expiry momentum traps.
    min_edge_early: 0.08   # 8% — matches market_filter global floor
    min_edge_mid:   0.07   # 7%
    min_edge_late:  0.06   # 6%
    min_edge_terminal: 0.05  # 5%
  market_filter:
    category: crypto
    frequency: fifteen_min
  risk_limits:
    max_yes_position: 500
    max_no_position: 500
    max_orders_per_window: 10
    max_notional_usd: 250
  entry_window:
    minutes_before_expiry: 10
    cutoff_minutes_before_expiry: 2
  take_profit:
    enabled: true
    r_multiple_primary: 0.5         # close at +50% of entry risk
    min_cents: 5                    # need at least 5¢ profit to trigger
    scale_out_fraction: 0.5         # sell half at primary TP
    trailing_enabled: true
    trailing_activation_r_multiple: 0.5
    trailing_giveback_cents: 5      # close remainder if price gives back 5¢
    max_round_trips_per_contract: 2
    min_price_move_for_reentry: 5
    min_edge_after_fees_cents: 2.0
  strike_selection:
    max_spot_to_strike_pct: 0.15   # 15% max distance for 15m BTC (calibrated v2)
    target_spot_band_pct: 0.06     # prefer contracts within 6% of spot
    deep_otm_allowed: false
- name: BTC_HOURLY
  assets:
  - BTC
  timeframes:
  - 1h
  archetype: directional
  strategy:
    # Slightly relaxed vs 15m (hourly contracts are less noisy).
    min_edge_early: 0.07
    min_edge_mid:   0.06
    min_edge_late:  0.05
    min_edge_terminal: 0.04
  market_filter:
    category: crypto
    frequency: hourly
  risk_limits:
    max_yes_position: 500
    max_no_position: 500
    max_orders_per_window: 10
    max_notional_usd: 250
