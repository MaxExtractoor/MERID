# ─── Kalshi Agent Grid Configuration ───────────────────────────────────
# Full crypto surface: BTC/ETH/SOL/XRP/DOGE × 15m/hourly/daily/weekly
# Plus market-maker, arbitrage, macro, and catch-all agents.
# The orchestrator resolves market_filter into live Kalshi tickers via GET /markets.

venue:
  name: kalshi
  base_url: "https://trading-api.kalshi.com/trade-api/v2"
  use_demo: false                      # PRODUCTION MODE - Real Kalshi trading
  max_notional_per_expiry_usd: 5000
  max_open_markets_per_asset: 20

session:
  # Kalshi is 24/7 except Thu 3–5 AM ET maintenance
  maintenance_day: 3                   # 0=Mon … 6=Sun → 3=Thu
  maintenance_start_et: "03:00"
  maintenance_end_et: "05:00"

# ── Per-agent definitions ──────────────────────────────────────────────
# Archetypes: directional, market_maker, arbitrage
agents:

  # ═══════════════════════════════════════════════════════════════════
  # BTC — Full timeframe coverage
  # ═══════════════════════════════════════════════════════════════════
  - name: BTC_15M
    assets: [BTC]
    timeframes: [15m]
    archetype: directional
    market_filter:
      category: crypto
      frequency: fifteen_min
    risk_limits:
      max_yes_position: 2000
      max_no_position: 2000
      max_orders_per_window: 20
      max_notional_usd: 500
    entry_window:
      minutes_before_expiry: 10
      cutoff_minutes_before_expiry: 1

  - name: BTC_HOURLY
    assets: [BTC]
    timeframes: [1h]
    archetype: directional
    market_filter:
      category: crypto
      frequency: hourly
    risk_limits:
      max_yes_position: 5000
      max_no_position: 5000
      max_orders_per_window: 15
      max_notional_usd: 1000
    entry_window:
      minutes_before_expiry: 30
      cutoff_minutes_before_expiry: 2

  - name: BTC_DAILY
    assets: [BTC]
    timeframes: [daily]
    archetype: directional
    market_filter:
      category: crypto
      frequency: daily
    risk_limits:
      max_yes_position: 10000
      max_no_position: 10000
      max_orders_per_window: 10
      max_notional_usd: 2000
    entry_window:
      minutes_before_expiry: 120
      cutoff_minutes_before_expiry: 15

  - name: BTC_WEEKLY
    assets: [BTC]
    timeframes: [weekly]
    archetype: directional
    market_filter:
      category: crypto
      frequency: weekly
    risk_limits:
      max_yes_position: 15000
      max_no_position: 15000
      max_orders_per_window: 5
      max_notional_usd: 3000
    entry_window:
      minutes_before_expiry: 1440
      cutoff_minutes_before_expiry: 60

