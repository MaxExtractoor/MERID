# ─── Kalshi Agent Grid Configuration ───────────────────────────────────
# Complete crypto surface: BTC/ETH/SOL/XRP/DOGE × 15m/1h/daily/weekly/monthly/annual (30 cells)
# Plus market-maker, arbitrage, macro, and catch-all agents.
# Production-ready configuration with all 30 crypto timeframe combinations.

venue:
  name: kalshi
  base_url: "https://trading-api.kalshi.com/trade-api/v2"
  use_demo: false                      # PRODUCTION MODE - Real Kalshi trading
  agent_stagger_seconds: 0.5           # Delay between agent starts to avoid API thundering herd

session:
  # Kalshi is 24/7 except Thu 3–5 AM ET maintenance
  maintenance_day: 3                   # 0=Mon … 6=Sun → 3=Thu
  maintenance_start_et: "03:00"
  maintenance_end_et: "05:00"

# ── Per-agent definitions ──────────────────────────────────────────────
# Archetypes: directional, market_maker, arbitrage, contrarian, regime_switch, vol_breakout
agents:

  # ═══════════════════════════════════════════════════════════════════
  # BTC — Full timeframe coverage (6 timeframes)
  # ═══════════════════════════════════════════════════════════════════
  - name: BTC_15M
    assets: [BTC]
    timeframes: [15m]
    archetype: directional
    risk_limits:
      max_orders_per_window: 20
      max_contracts_per_order: 5        # Small size for high-frequency 15m
      max_yes_position: 20               # Max 20 contracts YES per market
      max_no_position: 20                # Max 20 contracts NO per market
      max_notional_usd: 750              # ~0.75% of bankroll per market
      max_slippage_cents: 3
      min_depth_contracts: 5
      max_spread_cents: 10
    entry_window:
      minutes_before_expiry: 14
      cutoff_minutes_before_expiry: 0

  - name: BTC_HOURLY
    assets: [BTC]
    timeframes: [1h]
    archetype: directional
    risk_limits:
      max_orders_per_window: 15
      max_contracts_per_order: 10        # Larger size for 1h
      max_yes_position: 40               # Max 40 contracts YES per market
      max_no_position: 40                # Max 40 contracts NO per market
      max_notional_usd: 1500             # ~1.5% of bankroll per market
      max_slippage_cents: 3
      min_depth_contracts: 5
      max_spread_cents: 10
    entry_window:
      minutes_before_expiry: 55
      cutoff_minutes_before_expiry: 2

  - name: BTC_DAILY
    assets: [BTC]
    timeframes: [daily]
    archetype: directional
    risk_limits:
      max_orders_per_window: 10
      max_contracts_per_order: 15        # Moderate size for daily
      max_yes_position: 50               # Max 50 contracts YES per market
      max_no_position: 50                # Max 50 contracts NO per market
      max_notional_usd: 3000             # ~3% of bankroll per market
      max_slippage_cents: 5
      min_depth_contracts: 3
      max_spread_cents: 15
    entry_window:
      minutes_before_expiry: 480
      cutoff_minutes_before_expiry: 15

  - name: BTC_WEEKLY
    assets: [BTC]
    timeframes: [weekly]
