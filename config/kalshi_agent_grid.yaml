venue:
  name: kalshi
  base_url: https://api.elections.kalshi.com/trade-api/v2
  use_demo: false
  # DEPRECATED for kalshi_crypto_15m_v2 profile: Use config/profiles/kalshi_crypto_15m_v2.yaml instead
  # This venue-level setting is still used by other profiles (sports, paper, generic prediction)
  max_notional_per_expiry_usd: 0  # 0 = derive from actual Kalshi bankroll (was $1000)
  max_open_markets_per_asset: 20
session:
  maintenance_day: 3
  maintenance_start_et: 03:00
  maintenance_end_et: 05:00
agents:
# PROFILE-GATED: When MERID_PROFILE=kalshi_crypto_15m_v2, risk_limits and entry_window come from profile
# Single source of truth: config/profiles/kalshi_crypto_15m_v2.yaml
- name: BTC_15M
  enabled: true
  series_tickers:
  - KXBTC15M
  assets:
  - BTC
  timeframes:
  - 15m
  archetype: directional
  market_filter:
    category: crypto
    frequency: fifteen_min
  strategy_overrides:
    # Edge thresholds handled by profile edge_bands (kalshi_crypto_15m_v2.yaml)
    # Removed min_edge fields to use single source of truth
    # CRITICAL FIX 2026-07-24: Aligned signal_mode with profile YAML (momentum_fvg)
    # Profile YAML is single source of truth for signal_mode
    # momentum_fvg only - panic fade disabled due to losses by fading trend incorrectly
    signal_mode: momentum_fvg
  take_profit:
    enabled: true
    # CRITICAL FIX 2026-07-16: Updated time-based R-multiples to align with 2:1 risk/reward ratio
    # Previous values (1.0R, 0.75R, 0.5R) were based on old exit policy
    # New values (0.8R, 0.6R, 0.4R) align with 80% TP, 40% SL for positive expected value
    time_based_r_multiple:
      over_7_min: 0.8
      between_4_7_min: 0.6
      under_4_min: 0.4
    min_cents: 3
    scale_out_fraction: 0.5
    trailing_enabled: true
    trailing_activation_r_multiple: 0.8
    trailing_giveback_cents: 5  # CRITICAL FIX 2026-07-16: Updated from 3 to 5 to match profile
    max_round_trips_per_contract: 2
    min_price_move_for_reentry: 5
    min_edge_after_fees_cents: 2.0
  strike_selection:
    # Distance filtering handled by profile (max_distance_pct in kalshi_crypto_15m_v2.yaml)
    # Removed max_spot_to_strike_pct to use single source of truth
    target_spot_band_pct: 0.06     # prefer contracts within 6% of spot
    deep_otm_allowed: false
