# ── Portfolio-level risk agent ─────────────────────────────────────────
portfolio_risk:
  starting_bankroll_usd: 100000        # Initial bankroll for sizing calculations
  max_total_notional_usd: 25000        # Max 25% of bankroll deployed at once
  max_notional_per_asset_usd:
    BTC: 10000                         # BTC anchor gets highest allocation
    ETH: 7000                          # ETH core slightly lower
    SOL: 4000                          # SOL satellite
    XRP: 3000                          # XRP satellite
    DOGE: 3000                         # DOGE satellite
  max_open_markets: 40                 # Reduced from 200 for tighter control
  max_daily_loss_usd: 15000            # 15% of bankroll daily loss tolerance
  max_margin_utilization_pct: 50       # Conservative 50% margin cap
  rebalance_check_interval_seconds: 30

# ── Monitoring and operational settings ────────────────────────────────
monitoring:
  volume_poll_interval_seconds: 60     # How often to poll volume monitor
  reconciliation_interval_seconds: 300  # How often to run reconciliation (5 min)
  alert_daily_loss_threshold_pct: 5    # Alert when daily loss exceeds 5% of bankroll
  alert_margin_util_threshold_pct: 75  # Alert when margin utilization exceeds 75%
