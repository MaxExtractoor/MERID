# MERID Kalshi Strategy Catalog
# ────────────────────────────────────────────────────────────────────────────
# 30-cell matrix (5 assets × 6 timeframes) of tradeable strategy parameters.
#
# Each entry specifies:
#   enabled           — whether this cell is active (bool)
#   min_edge_bps      — minimum edge in basis points to place a trade
#   kelly_fraction    — fractional Kelly multiplier (0 < k ≤ 0.5)
#   max_risk_per_trade_pct — hard cap per trade as % of bankroll (independent of Kelly)
#   daily_loss_limit_pct   — per-cell daily loss cap as % of bankroll (0 = use global)
#   strategy_mode     — primary signal type: momentum | mean_revert | trend_carry |
#                         vol_surface | day_close | range_compress | regime_bet
#   profiles          — list of MERID profile names that enable this cell
#   tier              — asset tier: core | satellite (controls default Kelly scale)
#   notes             — human-readable commentary
#
# Global defaults (applied when a field is absent from a cell):
#   kelly_fraction:    0.25
#   max_risk_per_trade_pct: 1.0
#   daily_loss_limit_pct: 0.0  (use global MERID_DAILY_LOSS_LIMIT_PCT)
#   profiles: [kalshi-only, live]
#
# Promotion / pruning rules (evaluated by the StrategyGrid at the end of each
# evaluation period, typically weekly):
#   - Graduate to "core" when: trades >= 200, Sharpe > 0, realized_edge ≥ 0.5 × forecast_edge
#   - Increase cap +25% per period after graduation (never jump)
#   - Demote / disable when: hit_rate or pnl falls below thresholds for 2 periods
#
# See docs/STRATEGY_CATALOG_DESIGN.md for full spec.
# ────────────────────────────────────────────────────────────────────────────

assets:

  # ── BTC — core engine ───────────────────────────────────────────────────

  BTC:
    tier: core

    15m:
      enabled: true
      strategy_mode: momentum
      secondary_mode: mean_revert      # enabled when over-extension is detected
      min_edge_bps: 50                 # 0.5%  (initial_live profile)
      kelly_fraction: 0.25
      max_risk_per_trade_pct: 0.5
      liquidity_requirements:
        min_volume: 50
        min_open_interest: 10
      notes: >
        Microstructure momentum + mean-revert.  Skip when realized 15m vol is
        too low to cover Kalshi bid/ask + fee.  Fee-drag gated at execution time.

    1h:
      enabled: true
      strategy_mode: momentum
      min_edge_bps: 50
      kelly_fraction: 0.25
      max_risk_per_trade_pct: 0.5
      liquidity_requirements:
        min_volume: 50
        min_open_interest: 10
      notes: Short-term trend following; same as 15m with slightly wider windows.

    daily:
      enabled: true
      strategy_mode: day_close
      secondary_mode: range_compress
      min_edge_bps: 100                # 1%
      kelly_fraction: 0.30
      max_risk_per_trade_pct: 1.0
      liquidity_requirements:
        min_volume: 30
        min_open_interest: 5
      notes: >
        Day-close direction + range compression/expansion.  Trade when intraday
        drift, realized vol, and cross-coin confirmation agree.

    weekly:
      enabled: true
      strategy_mode: trend_carry
      secondary_mode: vol_surface
      min_edge_bps: 150                # 1.5%
      kelly_fraction: 0.35
      max_risk_per_trade_pct: 1.5
      liquidity_requirements:
        min_volume: 20
        min_open_interest: 5
      notes: Trend-follow + vol-tail mispricing.  All TFs must agree.

    monthly:
      enabled: true
      strategy_mode: trend_carry
      secondary_mode: vol_surface
      min_edge_bps: 200                # 2%
      kelly_fraction: 0.40
      max_risk_per_trade_pct: 2.0
      liquidity_requirements:
        min_volume: 10
        min_open_interest: 3
      notes: Terminal distribution mispricing; long horizon reduces churn.

    annual:
      enabled: true
      strategy_mode: regime_bet
      min_edge_bps: 200                # 2%
      kelly_fraction: 0.20             # Conservative: long horizon, illiquid
      max_risk_per_trade_pct: 1.0
      liquidity_requirements:
        min_volume: 5
        min_open_interest: 1
      notes: >
        Regime bets only (macro + on-chain trend confirmed).  CT stays flat
        unless all regime filters fire.

  # ── ETH — core engine ───────────────────────────────────────────────────

  ETH:
    tier: core

    15m:
      enabled: true
      strategy_mode: momentum
