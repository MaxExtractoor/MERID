# ── Global risk parameters ───────────────────────────────────────────────────
#
# These override per-cell settings at the system level.
# Values can also be set via environment variables (env vars take precedence).

global_risk:
  # Fractional Kelly multiplier applied on top of per-cell kelly_fraction.
  # Used as a portfolio-level dampener.  Set MERID_KELLY_FRACTION to override.
  kelly_multiplier: 1.0

  # Global daily loss limit as fraction of starting bankroll.
  # When realized loss ≥ this fraction, CT enters OBSERVE-ONLY mode.
  # Set MERID_DAILY_LOSS_LIMIT_PCT to override.
  daily_loss_limit_pct: 0.05

  # Maximum notional per group (in USD).  Set MERID_GROUP_NOTIONAL_CAP to override.
  max_group_notional_usd: 50.0

  # Per-asset bankroll allocation (as % of total bankroll).
  # These determine how much of the bankroll each asset can absorb.
  asset_allocations:
    BTC: 0.25
    ETH: 0.25
    SOL: 0.10
    XRP: 0.10
    DOGE: 0.10
    reserve: 0.20

# ── Strategy promotion rules ─────────────────────────────────────────────────
#
# Strategies are promoted from "experimental" to "core" when these thresholds
# are met over the evaluation window.

promotion_rules:
  min_trades: 200
  min_sharpe: 0.0
  min_calmar: 0.0
  max_realized_edge_discount: 0.50    # realized_edge ≥ 0.5 × forecast_edge
  cap_increase_per_period_pct: 25     # +25% per evaluation period, never jump

demotion_rules:
  min_hit_rate: 0.40                  # below this → place under review
  max_drawdown_pct: 0.20              # > 20% drawdown → disable
  review_periods_before_disable: 2   # 2 consecutive bad periods → disabled
