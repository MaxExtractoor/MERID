# Kalshi 15m Pipeline Configuration
#
# Defines the feature graph for 15m crypto trading.
# Only 15m execution agents (BTC_15M, ETH_15M, etc.) can place orders.
# All other agents are feature producers.

version: "1.0"
description: "15m Kalshi crypto trading pipelines with feature graph architecture"

pipelines:
  # BTC 15m Pipeline
  - pipeline_id: btc_15m_pipeline
    asset: BTC
    timeframe: 15m
    enabled: true
    description: "BTC 15m execution with multi-tf and macro features"
    
    feature_agents:
      # Microstructure features (lower timeframe)
      - name: BTC_MICROSTRUCTURE_1M
        role: feature
        feature_namespace: microstructure
        enabled: false  # Disabled until implemented
        assets: [BTC]
      - name: CRYPTO_VOL_REGIME
        role: feature
        feature_namespace: volatility
        enabled: true
      
      # Regime / Trend features (higher timeframe)
      - name: BTC_HOURLY
        role: feature
        feature_namespace: regime
        enabled: false  # Signal-only, not execution
        assets: [BTC]
      - name: BTC_DAILY
        role: feature
        feature_namespace: regime
        enabled: true
        assets: [BTC]
      - name: BTC_WEEKLY
        role: feature
        feature_namespace: regime
        enabled: false  # Disabled for now
        assets: [BTC]
      
      # Macro / Cross-asset features
      - name: CRYPTO_MACRO_CONTEXT
        role: feature
        feature_namespace: macro
        enabled: false  # Disabled until implemented
        assets: [CRYPTO]
      
      # Confidence / Ensemble features
      - name: CRYPTO_ENSEMBLE_CONFIDENCE
        role: feature
        feature_namespace: confidence
        enabled: false  # Disabled until implemented
    
    decision_agent:
      name: BTC_15M
      role: execution
      asset: BTC
      timeframe: 15m
      allowed_assets: [BTC, ETH, SOL, XRP, DOGE]
    
    executor:
      series_ticker: KXBTC
      executor_type: kalshi_trading_agent
    
    risk_agents:
      - PortfolioRiskAgent
      - CryptoRTIMonitor
    
    max_feature_age_seconds: 60
    require_all_features: false

  # ETH 15m Pipeline
