name: Dev Swarm CI Integration

on: workflow_dispatch  # Legacy — use ci.yml for active CI

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MERID_ENV: ci
      RUN_MODE: simulation
      SIMULATION_MODE: synthetic_only
    
    steps:
      - uses: actions/checkout@v3

      - name: Inject secrets from Vault (if configured)
        if: env.VAULT_ADDR != ''
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/merid/ci KALSHI_API_KEY | KALSHI_API_KEY ;
            secret/data/merid/ci TELEGRAM_BOT_TOKEN | TELEGRAM_BOT_TOKEN ;
            secret/data/merid/ci TELEGRAM_CHAT_ID | TELEGRAM_CHAT_ID
        continue-on-error: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run tests
        id: tests
        run: |
          pytest tests/ -v --cov=core --cov=web --cov-report=json
          echo "COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Check coverage threshold
        id: coverage_check
        run: |
          COVERAGE=${{ steps.tests.outputs.COVERAGE }}
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80% threshold"
            echo "BELOW_THRESHOLD=true" >> $GITHUB_OUTPUT
          else
            echo "Coverage $COVERAGE% meets threshold"
            echo "BELOW_THRESHOLD=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Auto-fix with Dev Swarm (on failure)
        if: steps.tests.outcome == 'failure' || steps.coverage_check.outputs.BELOW_THRESHOLD == 'true'
        run: |
          # Start backend in background
          python -m uvicorn web.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          sleep 10
          
          # Wait for backend to be ready
          timeout 30 bash -c 'until curl -s http://localhost:8000/api/dev-swarm/health > /dev/null; do sleep 1; done'
          
          # Create task based on failure type
          if [ "${{ steps.tests.outcome }}" == "failure" ]; then
            # Test failures - create debug task
            cat > task.json << EOF
          {
            "description": "Fix failing tests in CI pipeline - investigate and resolve test failures",
            "target_files": ["tests/"],
            "success_criteria": "All tests pass",
            "priority": 1,
            "estimated_effort": "medium",
            "timeout_seconds": 1800,
            "max_cost_usd": 5.0
          }
          EOF
          else
            # Coverage below threshold - create coverage task
            COVERAGE=${{ steps.tests.outputs.COVERAGE }}
            cat > task.json << EOF
          {
            "description": "Improve test coverage from ${COVERAGE}% to 80% - add missing tests",
            "target_files": ["core/", "tests/"],
            "success_criteria": "Achieve 80% test coverage",
            "priority": 2,
            "estimated_effort": "medium",
            "timeout_seconds": 2400,
            "max_cost_usd": 5.0
          }
          EOF
          fi
          
          # Submit task
          TASK_ID=$(curl -s -X POST http://localhost:8000/api/dev-swarm/tasks \
            -H "Content-Type: application/json" \
            -d @task.json | jq -r '.task_id')
          
          echo "Dev Swarm task created: $TASK_ID"
          echo "TASK_ID=$TASK_ID" >> $GITHUB_OUTPUT
          
          # Monitor task (up to 30 minutes)
          for i in {1..180}; do
            STATUS=$(curl -s http://localhost:8000/api/dev-swarm/tasks/$TASK_ID | jq -r '.status')
            echo "Task status: $STATUS"
            
            if [ "$STATUS" == "completed" ]; then
              echo "✓ Dev Swarm task completed successfully"
              # Create PR with changes (if any)
              if [ -n "$(git status --porcelain)" ]; then
                git config user.name "MERID Dev Swarm"
                git config user.email "devswarm@merid.ai"
                git checkout -b "swarm/auto-fix-$TASK_ID"
                git add .
                git commit -m "🤖 Auto-fix by Dev Swarm: Task $TASK_ID

          Task: $(cat task.json | jq -r '.description')
          Status: $STATUS
          
          Automated fix generated by MERID Dev Swarm CI integration."
                git push origin "swarm/auto-fix-$TASK_ID"
                
                # Create PR (requires GH_TOKEN with repo permissions)
                gh pr create \
                  --title "🤖 Auto-fix: $(cat task.json | jq -r '.description' | cut -c1-50)" \
                  --body "Automated fix by Dev Swarm

          **Task ID**: $TASK_ID
          **Description**: $(cat task.json | jq -r '.description')
          **Status**: $STATUS

          This PR was automatically created by the Dev Swarm CI integration." \
                  --label "automated,dev-swarm" || true
              fi
              break
            elif [ "$STATUS" == "failed" ] || [ "$STATUS" == "timeout" ]; then
              echo "✗ Dev Swarm task failed: $STATUS"
              break
            fi
            
            sleep 10
          done
          
          # Cleanup
          kill $BACKEND_PID || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const coverage = '${{ steps.tests.outputs.COVERAGE }}';
            const taskId = '${{ steps.auto_fix.outputs.TASK_ID }}';
            
            let body = `## 🤖 Dev Swarm CI Report\n\n`;
            body += `- **Test Coverage**: ${coverage}%\n`;
            
            if (taskId) {
              body += `- **Auto-fix Task**: ${taskId}\n`;
              body += `- **Status**: Dev Swarm is working on fixes\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.json
      
      - name: Fail if tests failed and no auto-fix
        if: steps.tests.outcome == 'failure' && steps.auto_fix.outputs.TASK_ID == ''
        run: exit 1

  dev_swarm_validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate Dev Swarm
        run: |
          # Start backend
          python -m uvicorn web.main:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          sleep 10
          
          # Run validation
          python scripts/validate_dev_swarm.py
          RESULT=$?
          
          # Cleanup
          kill $BACKEND_PID || true
          
          exit $RESULT
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Dev Swarm Validation Failed',
              body: 'The nightly Dev Swarm validation check has failed. Please investigate.',
              labels: ['bug', 'dev-swarm', 'ci']
            });
