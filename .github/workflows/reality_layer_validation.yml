name: Reality Layer Validation
on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Stage 1: Commit & Build
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov prometheus-client
      
      - name: Lint and type-check
        run: |
          python -m flake8 core/ tests/ --max-line-length=120 --ignore=E501
          python -m mypy core/ --ignore-missing-imports
      
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov=core --cov-report=xml --cov-report=term --cov-fail-under=90
      
      - name: Build Docker image
        run: |
          docker build -t merid:${{ github.sha }} .
  
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Stage 2: Security & Compliance
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run SAST with CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python
      
      - name: Run dependency scan
        run: |
          python -m pip install safety
          safety check --json --output safety-report.json
          
      - name: Run secrets scan
        uses: trufflehog/trufflehog-action@v0.8.10
        with:
          base_path: .
          detection_depth: 3
          
      - name: Run license check
        run: |
          python -m pip install pip-audit
          pip-audit --requirements requirements.txt --output-format=json --output license-report.json

  # Stage 3: Risk/Reality Tests (New Lane)
  reality-layer-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          pip install pytest pytest-cov prometheus-client
      
      - name: Run domain priority unit tests
        run: |
          python -m pytest tests/test_domain_priority_system.py -v --cov=core/domain_priority_manager --cov-report=xml --cov-report=term --cov-fail-under=90
      
      - name: Run conflict resolution tests
        run: |
          python -m pytest tests/test_conflict_resolution.py -v --cov=core/domain_priority_manager --cov-report=xml --cov-report=term --cov-fail-under=90
      
      - name: Run degraded signal handling tests
        run: |
          python -m pytest tests/test_degraded_signal_handling.py -v --cov=core/reality_auditor --cov-report=xml --cov-report=term --cov-fail-under=90
      
      - name: Run fault injection tests
        run: |
          python -m pytest tests/test_fault_injection.py -v --tb=short
      
      - name: Run SIGHTED_DEGRADED integration test
        run: |
          python -m pytest test_production_sighted_degraded_activation.py -v
      
      - name: Run chaos experiments
        run: |
          python -m pytest tests/test_fault_injection.py -v -k "chaos" --tb=short

  # Stage 4: Staging Deploy
  staging-deploy:
    runs-on: ubuntu-latest
    needs: reality-layer-tests
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual staging deployment commands here
          
      - name: Run end-to-end scenarios
        run: |
          python -m pytest tests/test_e2e_scenarios.py -v --tb=short
      
      - name: Run security tests against staging
        run: |
          python -m pytest tests/test_security_scenarios.py -v --tb=short
      
      - name: Run DAST against staging
        run: |
          # Add DAST tool commands here
          echo "Running DAST against staging..."

  # Stage 5: Controlled Prod Deploy
  prod-deploy:
    runs-on: ubuntu-latest
    needs: staging-deploy
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production (canary)
        run: |
          echo "Deploying to production (canary)..."
          # Add actual production deployment commands here
          
      - name: Monitor metrics for 5 minutes
        run: |
          python scripts/monitor_deployment.py --duration=300
          
      - name: Run health checks
        run: |
          python scripts/health_check.py
          
      - name: Validate safety checks
        run: |
          python scripts/validate_safety_checks.py
          
      - name: Verify audit trail
        run: |
          python scripts/validate_audit_trail.py

  # Post-deployment validation
  post-deploy-validation:
    runs-on: ubuntu-latest
    needs: prod-deploy
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run post-deployment validation
        run: |
          python scripts/post_deploy_validation.py
          
      - name: Generate deployment report
        run: |
          python scripts/generate_deployment_report.py

# Environment-specific configurations
environments:
  staging:
    variables:
      ENVIRONMENT: staging
      API_BASE_URL: https://staging-api.merid.com
      FEATURE_FLAGS: "reality_layer_enabled=true,priority_system_enabled=true"
      RISK_LEVEL: medium
      
  production:
    variables:
      ENVIRONMENT: production
      API_BASE_URL: https://api.merid.com
      FEATURE_FLAGS: "reality_layer_enabled=true,priority_system_enabled=true"
      RISK_LEVEL: high

# Security policies
permissions:
  contents: read
  pull_request: read
  issues: read
  deployments: write
  repository_scanning: write

# Required status checks
status_checks:
  - name: All tests pass
    run: |
      python -m pytest tests/ --tb=short --exit-code=0
  
  - name: No critical security issues
    run: |
      python -m safety check --json --output safety-report.json
      python -m trufflehog --repo . --exit-code=0
  
  - name: Coverage threshold met
    run: |
      python -m pytest --cov=core --cov-fail-under=90 --exit-code=0
  
  - name: No critical failures in reality layer
    run: |
      python scripts/check_reality_layer_health.py --exit-code=0
