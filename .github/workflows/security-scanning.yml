# Security Scanning Configuration for MERID
# Implements Trivy, Snyk, and secrets scanning for fintech compliance

name: Security Scanning
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily security scans at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Trivy Container and Filesystem Scanning
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image for scanning
        run: |
          docker build -t merid:security-scan .
      
      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'merid:security-scan'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-container-results.sarif'
      
      - name: Upload Trivy filesystem results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-fs-results.sarif'
      
      - name: Generate Trivy report
        run: |
          trivy image --format json --output trivy-report.json merid:security-scan
          trivy fs --format json --output trivy-fs-report.json .
      
      - name: Upload Trivy reports
        uses: actions/upload-artifact@v3
        with:
          name: trivy-reports
          path: |
            trivy-report.json
            trivy-fs-report.json

  # Snyk Dependency and Container Scanning
  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Snyk Open Source scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on-error
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image for Snyk scanning
        run: |
          docker build -t merid:snyk-scan .
      
      - name: Run Snyk Container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: merid:snyk-scan
          args: --severity-threshold=high --fail-on-error
      
      - name: Generate Snyk monitoring report
        run: |
          snyk monitor --org=merid --project-name=merid-runtime-primitive

  # CodeQL Static Application Security Testing
  codeql-sast:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python
          queries: security-extended,security-and-quality
      
      - name: Autobuild CodeQL database
        uses: github/codeql-action/autobuild@v2
        with:
          language: python
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:python"

  # Secrets Detection
  secrets-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog secrets detection
        uses: trufflesecurity/trufflehog-action@master
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified --regex --entropy=False
      
      - name: Run GitGuardian secrets detection
        uses: GitGuardian/gg-action-secrets@v1.2.0
        env:
          GITHUB_PUSH_BASE_URL: ${{ github.server_url }}
          GITHUB_PUSH_HEAD_SHA: ${{ github.sha }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.number }}
          GITHUB_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          # Ignore common false positives
          ignore_paths: |
            *.md
            *.txt
            docs/
            .git/
            node_modules/
            __pycache__/
      
      - name: Run Gitleaks secrets detection
        uses: zricethezav/gitleaks-action@v2
        with:
          version: latest
          config: .gitleaks.toml

  # OWASP ZAP Dynamic Application Security Testing
  zap-dast:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start MERID application for DAST
        run: |
          docker run -d --name merid-dast \
            -p 8001:8001 \
            -e MERID_ENVIRONMENT=dast \
            merid:latest
          
          # Wait for application to start
          timeout 60 bash -c 'until curl -f http://localhost:8001/health; do sleep 2; done'
      
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8001'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
      
      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:8001'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
      
      - name: Stop MERID application
        run: |
          docker stop merid-dast
          docker rm merid-dast
      
      - name: Upload ZAP reports
        uses: actions/upload-artifact@v3
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json

  # Security Policy Validation
  policy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Open Policy Agent
        run: |
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/
      
      - name: Validate security policies
        run: |
          opa eval -d security/policies -i security/data "data.merid.security.compliance"
      
      - name: Run Conftest policy validation
        run: |
          pip install conftest
          conftest validate --policy security/policies --output json security/policy-results.json
      
      - name: Upload policy validation results
        uses: actions/upload-artifact@v3
        with:
          name: policy-validation
          path: security/policy-results.json

  # Container Security Scanning
  container-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Anchore image scanning
        uses: anchore/scan-action@v3
        with:
          image-reference: 'merid:latest'
          policy-bundle-path: '.anchore/policy_bundle.json'
          fail-build-on-policy-failure: true
      
      - name: Run Clair image scanning
        uses: aquasecurity/clair-action@v1.2.0
        with:
          image: 'merid:latest'
          severity: 'Critical,High'
      
      - name: Run Grype vulnerability scanning
        uses: anchore/grype-action@v0.6.0
        with:
          image: 'merid:latest'
          format: 'sarif'
          output: 'grype-results.sarif'
          fail-on: 'high'
      
      - name: Upload Grype results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'grype-results.sarif'

  # Security Metrics and Reporting
  security-reporting:
    runs-on: ubuntu-latest
    needs: [trivy-scan, snyk-scan, codeql-sast, secrets-detection]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests jinja2
      
      - name: Generate security report
        run: |
          python scripts/generate_security_report.py
      
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.html
      
      - name: Send security notification
        if: needs.trivy-scan.result == 'failure' || needs.snyk-scan.result == 'failure' || needs.codeql-sast.result == 'failure'
        run: |
          python scripts/send_security_notification.py --status=failure
      
      - name: Send security success notification
        if: needs.trivy-scan.result == 'success' && needs.snyk-scan.result == 'success' && needs.codeql-sast.result == 'success'
        run: |
          python scripts/send_security_notification.py --status=success
