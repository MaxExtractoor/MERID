name: Nightly Soak Tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC nightly (11pm ET)

jobs:
  soak-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MERID_ENV: ci
      RUN_MODE: simulation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Audit Trail Soak (5 min, 10K entries)
        run: |
          python scripts/audit_trail_soak.py \
            --entries 10000 \
            --output audit_soak_results.json
        timeout-minutes: 10

      - name: Position Reconciliation Under Load
        run: |
          pytest tests/test_position_reconciliation.py::TestPositionReconciliationUnderLoad \
            -v --tb=short
        timeout-minutes: 10

      # Removed 2026-10-18: "Swarm Benchmark" step targeted
      # tests/test_swarm_vs_single_agent_benchmark.py, which moved to
      # tests/legacy/ and imports the deleted core.consensus_math module —
      # it can never run against the 15m stack.

      - name: Golden Path + Phase 2/3 Hardening
        run: |
          python -m pytest \
            tests/test_e2e_golden_path.py \
            tests/test_hardening.py \
            tests/event_venues/kalshi/test_ws_resilience.py \
            tests/event_venues/kalshi/test_rate_limits.py \
            tests/integration/test_swarm_health_gating.py \
            tests/integration/test_kalshi_e2e_stress.py \
            -v --tb=short --timeout=60
        timeout-minutes: 30

      - name: Extended Test Suite (full)
        run: |
          pytest tests/ -v --tb=short --durations=20 \
            -x --timeout=120
        timeout-minutes: 45

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results-${{ github.run_number }}
          path: |
            audit_soak_results.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Upsert a single tracking issue instead of opening a new issue per
            // nightly failure (2026-10-18: ~80 duplicate issues were auto-filed).
            const title = '🔴 Nightly Soak Test Failures';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'soak-test',
              per_page: 10,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run #${context.runNumber} failed on ${context.sha.slice(0, 8)}.\n\nSee: ${runUrl}`;
            const tracking = existing.find(i => i.title === title);
            if (tracking) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The nightly soak test is failing. New failures are appended as comments.\n\n${body}`,
                labels: ['bug', 'soak-test', 'ci'],
              });
            }
