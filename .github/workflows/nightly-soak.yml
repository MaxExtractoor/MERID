name: Nightly Soak Tests

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC nightly (11pm ET)

jobs:
  soak-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MERID_ENV: ci
      RUN_MODE: simulation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Audit Trail Soak (5 min, 10K entries)
        run: |
          python scripts/audit_trail_soak.py \
            --entries 10000 \
            --output audit_soak_results.json
        timeout-minutes: 10

      - name: Position Reconciliation Under Load
        run: |
          pytest tests/test_position_reconciliation.py::TestPositionReconciliationUnderLoad \
            -v --tb=short
        timeout-minutes: 10

      # Removed 2026-10-18: "Swarm Benchmark" step targeted
      # tests/test_swarm_vs_single_agent_benchmark.py, which moved to
      # tests/legacy/ and imports the deleted core.consensus_math module —
      # it can never run against the 15m stack.

      - name: Kalshi Venue Hardening (WS resilience + rate limits)
        run: |
          # 2026-11-03: dropped tests/test_e2e_golden_path.py,
          # tests/test_hardening.py, tests/integration/test_swarm_health_gating.py,
          # tests/integration/test_kalshi_e2e_stress.py — all four are in
          # tests/conftest.py collect_ignore (legacy/broken: they import deleted
          # modules merid.signals.decay, merid.prediction.trading_agent,
          # merid.prediction.risk). Explicitly passing ignored files on the
          # command line bypasses collect_ignore, so the step died at collection
          # with pytest exit code 2 every night since 2026-10-18.
          python -m pytest \
            tests/event_venues/kalshi/test_ws_resilience.py \
            tests/event_venues/kalshi/test_rate_limits.py \
            -v --tb=short --timeout=60
        timeout-minutes: 30

      # 2026-11-19: the blocking signal is now the canonical offline
      # acceptance harness (same gate as paper-gate.yml).  The full tests/
      # tree carries a documented non-green backlog (AGENTS.md 2026-09-22
      # baseline), so it runs report-only below — -x used to kill the job on
      # the first known failure ~40s in.  The run borrows ci.yml's
      # full-discovery pattern: ci_pytest_hard_exit survives the Linux
      # interpreter-shutdown wedge, `timeout -s INT` bounds the suite below
      # the step timeout while still letting pytest write junitxml, and the
      # outer watchdog is the last-resort kill for a true mid-run hang.
      - name: Offline Acceptance Gate
        run: |
          python scripts/run_offline_gate.py --output-dir ./results
        timeout-minutes: 20

      - name: Extended Test Suite (report-only)
        continue-on-error: true
        env:
          # The durable-state scan guards the production data/ tree; the CI
          # checkout is ephemeral and unattributed writes trip it even when
          # every test passes.  The pytest steps above still run with the
          # scan enabled.
          MERID_TEST_SKIP_DURABLE_SCAN: '1'
        run: |
          mkdir -p results
          PYTHONFAULTHANDLER=1 setsid --wait timeout -s INT -k 60 2100 \
            python scripts/ci_pytest_hard_exit.py tests/ \
            -v --tb=short --durations=20 --timeout=120 \
            --junitxml=results/extended_tests.xml \
            > results/extended_tests.log 2>&1 &
          TPID=$!
          ( sleep 2200; kill -KILL -- "-$TPID" 2>/dev/null; pkill -KILL -f "ci_pytest_hard_exit" 2>/dev/null ) &
          WPID=$!
          wait $TPID
          ec=$?
          kill "$WPID" 2>/dev/null || true
          tail -80 results/extended_tests.log || true
          echo "extended suite exit: $ec (report-only — does not gate)"
        timeout-minutes: 45

      - name: Extended suite summary
        if: always()
        run: python scripts/nightly_extended_summary.py

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results-${{ github.run_number }}
          path: |
            audit_soak_results.json
            results/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Upsert a single tracking issue instead of opening a new issue per
            // nightly failure (2026-10-18: ~80 duplicate issues were auto-filed).
            const title = '🔴 Nightly Soak Test Failures';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'soak-test',
              per_page: 10,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run #${context.runNumber} failed on ${context.sha.slice(0, 8)}.\n\nSee: ${runUrl}`;
            const tracking = existing.find(i => i.title === title);
            if (tracking) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The nightly soak test is failing. New failures are appended as comments.\n\n${body}`,
                labels: ['bug', 'soak-test', 'ci'],
              });
            }
