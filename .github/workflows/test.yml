name: MERID Tests & Coverage
on: workflow_dispatch  # Legacy — use ci.yml for active CI

jobs:
  tier1:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - run: pip install -e .[test]
    - name: Tier 1 Strict Coverage
      run: |
        pytest --cov-config=.coveragerc \
          --cov=trading/execution --cov=merid/event_venues \
          --cov-report=xml:coverage-tier1.xml \
          --cov-fail-under=95 tests/
    - uses: codecov/codecov-action@v4
      with: { file: coverage-tier1.xml }

  tier2:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - run: pip install -e .[test]
    - name: Tier 2 Relaxed Coverage
      run: |
        pytest --cov-config=.coveragerc \
          --cov=core --cov=trading/router \
          --cov-report=xml:coverage-tier2.xml \
          --cov-fail-under=85 tests/
    - uses: codecov/codecov-action@v4
      with: { file: coverage-tier2.xml }

  safety-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - run: pip install -e .[test]
    - name: Kill Switch & Safety Smoke Tests
      run: |
        python -c "
        from core.automated_risk_controls import TradingHaltManager
        hm = TradingHaltManager()
        assert not hm.is_halted, 'Should start unhalted'
        hm.halt('CI smoke test')
        assert hm.is_halted, 'Should be halted after halt()'
        assert hm.halt_reason == 'CI smoke test'
        hm.resume('ci')
        assert not hm.is_halted, 'Should be unhalted after resume()'
        # Daily loss auto-halt
        hm2 = TradingHaltManager(max_daily_loss_pct=0.05)
        hm2.check_daily_loss(-600, 10000)
        assert hm2.is_halted, 'Should halt on 6% daily loss'
        print('✅ Kill switch smoke tests passed')
        "
    - name: Secrets Guard Smoke Test
      run: |
        python -c "
        from core.secrets_guard import scan_for_tracked_secrets
        findings = scan_for_tracked_secrets()
        critical = [f for f in findings if f.get('severity') == 'CRITICAL']
        assert len(critical) == 0, f'CRITICAL secrets found: {critical}'
        print('✅ No tracked secrets found')
        "
    - name: Mode-Gate Enforcement Tests
      run: |
        pytest tests/test_mode_gate.py -v --tb=short
    - name: Circuit Breaker & Trading Halt Tests
      run: |
        pytest tests/test_trading_halt.py -v --tb=short
    - name: Performance Regression Check
      run: |
        pytest tests/ --durations=10 -q 2>&1 | tee perf_output.txt
        python -c "
        import sys
        MAX_SINGLE_TEST_SEC = 30.0
        MAX_TOTAL_SEC = 90.0
        lines = open('perf_output.txt').readlines()
        slow = []
        for line in lines:
            line = line.strip()
            if 's call' in line or 's setup' in line or 's teardown' in line:
                parts = line.split()
                try:
                    duration = float(parts[0].rstrip('s'))
                    if duration > MAX_SINGLE_TEST_SEC:
                        slow.append((duration, line))
                except (ValueError, IndexError):
                    pass
        if slow:
            print(f'❌ {len(slow)} test(s) exceeded {MAX_SINGLE_TEST_SEC}s threshold:')
            for d, l in slow:
                print(f'  {l}')
            sys.exit(1)
        print(f'✅ No tests exceeded {MAX_SINGLE_TEST_SEC}s threshold')
        "
      continue-on-error: true
    - name: Compliance Report
      run: |
        python -m core.compliance_report --json > compliance_report.json
        python -c "
        import json, sys
        report = json.load(open('compliance_report.json'))
        violations = report.get('violations', [])
        critical = [v for v in violations if v.get('severity') == 'critical']
        print(f'Compliance: {len(violations)} total violations, {len(critical)} critical')
        if critical:
            for v in critical:
                print(f'  ❌ {v}')
            sys.exit(1)
        print('✅ No critical compliance violations')
        "
      continue-on-error: true
    - name: Alertmanager Config Validation
      run: |
        pip install pyyaml
        python monitoring/verify-alertmanager.py
