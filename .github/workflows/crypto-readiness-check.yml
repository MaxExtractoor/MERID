name: Crypto Readiness Check

on:
  schedule:
    # Run daily at 06:00 UTC (before US market open)
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # Allow manual trigger
  push:
    branches:
      - main
      - develop
    paths:
      - 'config/crypto_universe.py'
      - 'merid/event_venues/kalshi/crypto_kalshi_risk.py'
      - 'scripts/kalshi_crypto_live_readiness.py'
      - 'tests/test_crypto_coverage_comprehensive.py'

permissions:
  contents: read
  issues: write

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERID_ENV: ci
      KALSHI_ENV: paper
      MERID_PM_TRADING_MODE: paper
      MERID_PM_LIVE_ENABLED: false
      MERID_CFB_RTI_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # continue-on-error keeps later steps running so the report/artifacts are
      # always produced. steps.<id>.outcome holds the REAL result (success/failure);
      # the old `echo "exit_code=$?"` never ran because bash -e aborts on failure.
      - name: Run comprehensive coverage tests
        id: coverage_tests
        run: python tests/test_crypto_coverage_comprehensive.py > coverage_test_results.txt 2>&1
        continue-on-error: true

      # --ci: CI has no Kalshi credentials, so credential checks are warnings.
      # All other checks (formulas, proposal paths, coverage, sizing) still block.
      - name: Run readiness script
        id: readiness_script
        run: python scripts/kalshi_crypto_live_readiness.py --ci --json > readiness_results.json 2> readiness_stderr.txt
        continue-on-error: true

      - name: Generate readiness report
        if: always()
        run: |
          {
            echo "# Crypto Coverage Readiness Report"
            echo
            echo "**Run Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## Coverage Tests: ${{ steps.coverage_tests.outcome }}"
            echo
            echo '```'
            tail -n 40 coverage_test_results.txt 2>/dev/null || echo "No results available"
            echo '```'
            echo
            echo "## Readiness Script: ${{ steps.readiness_script.outcome }}"
            echo
            echo '```json'
            head -c 6000 readiness_results.json 2>/dev/null || echo '{"error": "No results available"}'
            echo
            echo '```'
            echo
            echo "## Matrix"
            echo
            echo "5 assets (BTC, ETH, SOL, XRP, DOGE) x 6 timeframes (15m, 1h, daily, weekly, monthly, annual) = 30 markets"
          } > readiness_report.md

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-readiness-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            coverage_test_results.txt
            readiness_results.json
            readiness_stderr.txt
            readiness_report.md
          retention-days: 90

      - name: Check for failures
        run: |
          if [ "${{ steps.coverage_tests.outcome }}" != "success" ]; then
            echo "Coverage tests failed"
            exit 1
          fi
          if [ "${{ steps.readiness_script.outcome }}" != "success" ]; then
            echo "Readiness script failed"
            exit 1
          fi
          echo "All checks passed"

      # One tracking issue, not one per day: comment on it if open, create it otherwise.
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Report not available';
            try { report = fs.readFileSync('readiness_report.md', 'utf8'); }
            catch (e) { report = `Error reading report: ${e.message}`; }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Scheduled crypto readiness check failed on ${new Date().toISOString()}.\n\n${report}\n\nSee: ${runUrl}`;
            const labels = ['crypto', 'readiness', 'automated-check', 'ci'];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: labels.join(','), per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Crypto Readiness Check Failed', body, labels,
              });
            }

      - name: Close failure issue when check passes
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['crypto', 'readiness', 'automated-check', 'ci'];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: labels.join(','), per_page: 100,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: 'Readiness check is passing again. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
