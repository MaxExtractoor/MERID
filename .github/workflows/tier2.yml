name: MERID Tier 2 Coverage
on: [push, pull_request]

jobs:
  tier2-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -e .[test]
    - name: Tier 2 Coverage (85% baseline)
      run: |
        pytest --cov-config=.coveragerc \
          --cov=core --cov=trading/router \
          --cov-branch --cov-report=xml:coverage-tier2.xml \
          --cov-fail-under=85 tests/
    - uses: codecov/codecov-action@v4
      with:
        file: coverage-tier2.xml
        flags: tier2
        fail_ci_if_error: true
    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request'
      uses: dorny/test-reporter@v1
      with:
        name: Tier 2 Coverage Results
        path: coverage-tier2.xml
        reporter: cobertura
        fail-on-error: true
