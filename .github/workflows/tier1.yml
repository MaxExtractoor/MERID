name: MERID Tier 1 Coverage
on: workflow_dispatch  # Legacy — use ci.yml for active CI

jobs:
  tier1-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -e .[test]
    - name: Tier 1 Coverage (95% line + branch)
      run: |
        pytest --cov-config=.coveragerc \
          --cov=trading/execution --cov=merid/event_venues \
          --cov-branch --cov-report=xml:coverage-tier1.xml \
          --cov-fail-under=95 tests/
    - uses: codecov/codecov-action@v4
      with:
        file: coverage-tier1.xml
        flags: tier1
        fail_ci_if_error: true
