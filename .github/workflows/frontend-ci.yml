name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'web/react/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/react/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web/react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/react/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --runInBand --coverage

      - name: Report test status
        if: always()
        run: |
          echo "::notice::All tests passing. Check artifacts for coverage report."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./web/react/coverage/

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Frontend CI failed. Please check the workflow logs for TypeScript errors or test failures.'
            })
