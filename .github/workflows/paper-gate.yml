name: Paper Gate Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate_duration:
        description: 'Gate duration in seconds (default: 1800 = 30 min)'
        required: false
        default: '1800'
      gate_id:
        description: 'Gate identifier (default: ci_<run_id>)'
        required: false
        default: ''

jobs:
  # Quick dry-run on every push/PR (2 minutes)
  dry-run-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install aiohttp

      - name: Run dry-run paper gate
        run: |
          python scripts/run_offline_gate.py --output-dir ./results

      - name: Upload dry-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-results
          path: ./results/
          retention-days: 7

  # Full 30-minute gate (manual trigger only)
  full-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 30 min gate + 15 min buffer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install aiohttp

      - name: Set gate ID
        id: gate
        env:
          GATE_LABEL: ${{ inputs.gate_id }}
        run: |
          GATE_ID="${GATE_LABEL:-ci_${GITHUB_RUN_ID}}"
          [[ "$GATE_ID" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          echo "GATE_ID=$GATE_ID" >> "$GITHUB_OUTPUT"

      - name: Run full offline gate
        env:
          GATE_DURATION: ${{ inputs.gate_duration || '1800' }}
        run: |
          python scripts/run_offline_gate.py \
            --soak-seconds "$GATE_DURATION" \
            --output-dir ./results

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-gate-results-${{ steps.gate.outputs.GATE_ID }}
          path: ./results/
          retention-days: 30

      - name: Summarize offline gate
        if: always()
        run: |
          if [ -f results/offline_gate.json ]; then
            echo '### Canonical offline acceptance (not live-trading authorization)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat results/offline_gate.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
