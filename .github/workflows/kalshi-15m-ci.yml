name: Kalshi 15m Crypto CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  kalshi-15m-smoke:
    name: 15m Lean Stack Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run 15m lean smoke tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TRADING_MODE: demo
        TRADING_ENABLED: false
      run: |
        pytest tests/test_15m_lean_smoke.py -v --tb=short

    - name: Run legacy module guard tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TRADING_MODE: demo
        TRADING_ENABLED: false
      run: |
        pytest tests/test_legacy_module_guard.py -v --tb=short

  kalshi-15m-tests:
    name: Kalshi 15m Crypto Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Kalshi 15m tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/kalshi_15m/ -m kalshi_15m -v --tb=short
    
    - name: Run Kalshi core tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/kalshi/ tests/merid/event_venues/kalshi/ -m kalshi_core -v --tb=short
    
    - name: Run reconciliation and risk tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/reconciliation/ tests/risk/ -m kalshi_risk -v --tb=short
