name: Kalshi 15m Crypto CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  kalshi-15m-smoke:
    name: 15m Lean Stack Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run 15m lean smoke tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TRADING_MODE: demo
        TRADING_ENABLED: false
      run: |
        pytest tests/test_15m_lean_smoke.py -v --tb=short

    - name: Run legacy module guard tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TRADING_MODE: demo
        TRADING_ENABLED: false
      run: |
        pytest tests/test_legacy_module_guard.py -v --tb=short

  kalshi-15m-tests:
    name: Kalshi 15m Crypto Tests
    runs-on: ubuntu-latest
    # Backstop: the venue step self-bounds at ~46min; 90min covers the other
    # steps plus runner overhead while preventing a multi-hour wedge.
    timeout-minutes: 90
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Kalshi 15m tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/kalshi_15m/ -m kalshi_15m -v --tb=short
    
    - name: Run Kalshi venue tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        # 2026-10-18: was `pytest tests/kalshi/ tests/merid/event_venues/kalshi/
        # -m kalshi_core` — both directories are pytest-ignored (legacy mirrors)
        # and no test carries the kalshi_core mark, so the step collected 0
        # tests and failed with pytest exit code 5.
        # 2026-11-10: the suite finishes all tests in <1min but the
        # interpreter wedges during shutdown on Linux (leaked WS/asyncio
        # state), so run it through scripts/ci_pytest_hard_exit.py which
        # preserves pytest's exit code via os._exit.  pytest still runs in
        # its own process group with a watchdog SIGKILL at 45min as a
        # backstop for a mid-run wedge; the transcript captures the
        # last in-flight test either way.
        PYTHONFAULTHANDLER=1 setsid --wait python scripts/ci_pytest_hard_exit.py tests/event_venues/kalshi/ -v --tb=short --timeout=120 > venue-tests.log 2>&1 &
        TPID=$!
        ( sleep 2700; kill -KILL -- "-$TPID" 2>/dev/null; pkill -KILL -f "pytest.*event_venues" 2>/dev/null ) &
        WPID=$!
        wait $TPID
        ec=$?
        kill "$WPID" 2>/dev/null || true
        tail -60 venue-tests.log
        exit $ec

    - name: Upload venue test transcript
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kalshi-venue-tests-transcript
        path: venue-tests.log
        retention-days: 14
    
    - name: Run reconciliation and risk tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        # The kalshi_risk marker is vestigial: its only decorated file
        # (tests/risk/test_kalshi_crypto_risk.py) is collect_ignore'd as stale,
        # so `-m kalshi_risk` selected zero tests and exited 5.  Run the live
        # reconciliation + risk suites unfiltered instead.  Same hard-exit
        # wrapper as the venue step — interpreter shutdown can wedge on
        # leaked threads even after a green run.
        PYTHONFAULTHANDLER=1 setsid --wait python scripts/ci_pytest_hard_exit.py tests/reconciliation/ tests/risk/ -v --tb=short > recon-risk-tests.log 2>&1 &
        TPID=$!
        ( sleep 1200; kill -KILL -- "-$TPID" 2>/dev/null; pkill -KILL -f "ci_pytest_hard_exit" 2>/dev/null ) &
        WPID=$!
        wait $TPID
        ec=$?
        kill "$WPID" 2>/dev/null || true
        tail -40 recon-risk-tests.log
        exit $ec

  thesis-side-invariant-tests:
    name: Thesis Side Invariant Verification
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run thesis-side invariant tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/test_thesis_side_domain.py tests/test_intent_thesis_side_invariant.py tests/test_full_lifecycle_thesis_invariant.py tests/test_rest_sync_thesis_preservation.py -v --tb=short
    
    - name: Run lifecycle thesis trace tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/test_lifecycle_thesis_trace.py -v --tb=short
    
    - name: Run zero-quantity fill tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/test_zero_quantity_fills.py -v --tb=short
    
    - name: Run position cache sync tests
      env:
        MERID_PROFILE: kalshi_crypto_15m_v2
        MERID_TEST_MODE: 1
      run: |
        pytest tests/test_position_cache_sync.py -v --tb=short
