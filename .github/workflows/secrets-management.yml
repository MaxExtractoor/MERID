# Secrets Management for MERID Production
# Implements fintech-grade secrets management with vault integration

name: Secrets Management
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Rotate secrets weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  # Secrets Validation and Rotation
  secrets-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up HashiCorp Vault
        run: |
          wget https://releases.hashicorp.com/vault/1.14.0/vault_1.14.0_linux_amd64.zip
          unzip vault_1.14.0_linux_amd64.zip
          sudo mv vault /usr/local/bin/
          vault --version
      
      - name: Configure Vault authentication
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          # Authenticate with Vault using OIDC
          vault login -method=oidc role=${{ secrets.VAULT_ROLE_ID }}
          
          # Verify Vault connectivity
          vault status
      
      - name: Validate secrets structure
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          # Validate required secrets exist
          vault kv get merid/prod/trading-api
          vault kv get merid/prod/market-data
          vault kv get merid/prod/database
          vault kv get merid/prod/monitoring
          
          # Validate secret structure
          python scripts/validate_secrets_structure.py
      
      - name: Check for secret expiration
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/check_secret_expiration.py --days-to-expire=7
      
      - name: Rotate secrets if needed
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        if: github.event.schedule == '0 3 * * 0'
        run: |
          python scripts/rotate_secrets.py --auto-rotate=true

  # Secrets Scanning and Policy Validation
  secrets-policy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks secrets detection
        uses: zricethezav/gitleaks-action@v2
        with:
          version: latest
          config: .gitleaks.toml
          redact: true
      
      - name: Run TruffleHog secrets detection
        uses: trufflesecurity/trufflehog-action@master
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified --regex --entropy=False
      
      - name: Run GitGuardian secrets detection
        uses: GitGuardian/gg-action-secrets@v1.2.0
        env:
          GITHUB_PUSH_BASE_URL: ${{ github.server_url }}
          GITHUB_PUSH_HEAD_SHA: ${{ github.sha }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.before }}
        with:
          ignore_paths: |
            *.md
            *.txt
            docs/
            .git/
            node_modules/
            __pycache__/
      
      - name: Validate secrets policies
        run: |
          python scripts/validate_secrets_policies.py
      
      - name: Generate secrets compliance report
        run: |
          python scripts/generate_secrets_compliance_report.py
      
      - name: Upload secrets compliance report
        uses: actions/upload-artifact@v3
        with:
          name: secrets-compliance
          path: secrets-compliance-report.html

  # Environment-Specific Secrets Deployment
  deploy-secrets:
    runs-on: ubuntu-latest
    needs: secrets-validation
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up HashiCorp Vault
        run: |
          wget https://releases.hashicorp.com/vault/1.14.0/vault_1.14.0_linux_amd64.zip
          unzip vault_1.14.0_linux_amd64.zip
          sudo mv vault /usr/local/bin/
      
      - name: Configure Vault for ${{ matrix.environment }}
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          vault login -method=oidc role=${{ secrets.VAULT_ROLE_ID }}
          vault status
      
      - name: Deploy secrets to ${{ matrix.environment }}
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          python scripts/deploy_secrets.py --environment=${{ matrix.environment }}
      
      - name: Validate secrets deployment
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          python scripts/validate_secrets_deployment.py --environment=${{ matrix.environment }}
      
      - name: Update Kubernetes secrets
        if: matrix.environment == 'production'
        run: |
          python scripts/update_k8s_secrets.py --environment=${{ matrix.environment }}

  # Secrets Access Audit
  secrets-audit:
    runs-on: ubuntu-latest
    needs: deploy-secrets
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up HashiCorp Vault
        run: |
          wget https://releases.hashicorp.com/vault/1.14.0/vault_1.14.0_linux_amd64.zip
          unzip vault_1.14.0_linux_amd64.zip
          sudo mv vault /usr/local/bin/
      
      - name: Generate secrets access audit
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/generate_secrets_audit.py
      
      - name: Store audit in WORM storage
        run: |
          python scripts/store_secrets_audit.py \
            --audit-file=secrets-audit.json \
            --worm-storage=${{ secrets.WORM_STORAGE_ENDPOINT }}
      
      - name: Upload secrets audit
        uses: actions/upload-artifact@v3
        with:
          name: secrets-audit
          path: secrets-audit.json

  # Network Security Validation
  network-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate network security policies
        run: |
          python scripts/validate_network_security.py
      
      - name: Check CI runner egress policies
        run: |
          python scripts/check_egress_policies.py
      
      - name: Validate private networking configuration
        run: |
          python scripts/validate_private_networking.py
      
      - name: Generate network security report
        run: |
          python scripts/generate_network_security_report.py
      
      - name: Upload network security report
        uses: actions/upload-artifact@v3
        with:
          name: network-security
          path: network-security-report.html

  # Key Rotation and Compliance
  key-rotation:
    runs-on: ubuntu-latest
    needs: secrets-validation
    if: github.event.schedule == '0 3 * * 0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up HashiCorp Vault
        run: |
          wget https://releases.hashicorp.com/vault/1.14.0/vault_1.14.0_linux_amd64.zip
          unzip vault_1.14.0_linux_amd64.zip
          sudo mv vault /usr/local/bin/
      
      - name: Configure Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
        run: |
          vault login -method=oidc role=${{ secrets.VAULT_ROLE_ID }}
          vault status
      
      - name: Rotate database credentials
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/rotate_database_credentials.py
      
      - name: Rotate API keys
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/rotate_api_keys.py
      
      - name: Rotate TLS certificates
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/rotate_tls_certificates.py
      
      - name: Validate key rotation
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/validate_key_rotation.py
      
      - name: Update applications with new credentials
        run: |
          python scripts/update_applications_credentials.py
      
      - name: Generate rotation report
        run: |
          python scripts/generate_rotation_report.py
      
      - name: Upload rotation report
        uses: actions/upload-artifact@v3
        with:
          name: key-rotation
          path: rotation-report.html
