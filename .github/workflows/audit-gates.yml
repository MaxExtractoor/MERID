# MERID Audit Gates - CI/CD Pipeline
# Gate 2: CI/CD Foundation - Evidence Artifact
# Date: 2026-01-26

name: MERID Audit Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Gate 2.1: Code Quality & Testing
  test-and-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio black flake8 mypy
        
    - name: Code formatting check (Black)
      run: black --check --diff .
      
    - name: Linting check (Flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Type checking (MyPy)
      run: mypy core/ web/ --ignore-missing-imports
      
    - name: Run tests with coverage
      run: |
        pytest --cov=merid --cov-report=xml --cov-report=html --cov-fail-under=80
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  # Gate 2.2: Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        languages: python
        
    - name: Run Snyk Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        
    - name: Run Trivy Container Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Run GitGuardian Secret Detection
      uses: GitGuardian/ggshield-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # Gate 2.3: Dependency Scanning
  dependency-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Run Dependabot Security Scan
      run: |
        pip install safety
        safety check --json --output safety-report.json
        
    - name: Upload safety report
      uses: actions/upload-artifact@v3
      with:
        name: safety-report
        path: safety-report.json

  # Gate 2.4: Build and Sign
  build-and-sign:
    runs-on: ubuntu-latest
    needs: [test-and-quality, security-scan, dependency-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          merid/merid-api:${{ github.sha }}
          merid/merid-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        
    - name: Generate SBOM
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          syft merid/merid-api:${{ github.sha }} -o cyclonedx-json > sbom.json
          
    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: sbom.json

  # Gate 2.5: Policy Validation
  policy-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Conftest
      run: |
        pip install conftest
        
    - name: Validate Infrastructure as Code
      run: |
        conftest test infra/ --policy policy/ --output junit
        
    - name: Validate Docker configurations
      run: |
        conftest test docker-compose.yml --policy policy/docker.yml --output junit

  # Gate 2.6: Integration Tests
  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-sign
    
    services:
      neo4j:
        image: neo4j:5.27-community
        env:
          NEO4J_AUTH: neo4j/merid
          NEO4J_PLUGINS: '["apoc"]'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p merid 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 7687:7687
          
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short
      env:
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: merid
        REDIS_URL: redis://localhost:6379
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: test-results/

  # Gate 2.7: Security Validation
  security-validation:
    runs-on: ubuntu-latest
    needs: integration-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.7.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    - name: Run SSL/TLS Validation
      run: |
        # Test TLS configuration
        openssl s_client -connect localhost:8443 -showcerts < /dev/null
        
    - name: Validate RBAC permissions
      run: |
        # Check that no debug endpoints are exposed
        curl -f http://localhost:8000/debug || echo "Debug endpoint properly secured"

# Required status checks for branch protection
status-checks:
  runs-on: ubuntu-latest
  needs: [test-and-quality, security-scan, dependency-scan, build-and-sign, integration-test]
  
  steps:
    - name: All Gates Passed
      run: |
        echo "✅ All audit gates passed successfully"
        echo "🚀 Ready for deployment"
