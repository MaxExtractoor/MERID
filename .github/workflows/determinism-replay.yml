name: Determinism Replay CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'merid/prediction/**'
      - 'merid/tools/determinism_replay.py'
      - 'config/kalshi_*.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'merid/prediction/**'
      - 'merid/tools/determinism_replay.py'
      - 'config/kalshi_*.yaml'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  determinism-replay-ci:
    name: Determinism Replay (CI Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -e .
      
      - name: Run determinism replay (CI mode)
        env:
          MERID_DETERMINISM_MODE: ci
          MERID_DETERMINISM_SAMPLE_SIZE: 10
        run: |
          python -m merid.tools.determinism_replay \
            --mode ci \
            --sample-size 10 \
            --fail-on-error
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: determinism-replay-results
          path: determinism_replay_results.json
          retention-days: 30

  determinism-replay-full:
    name: Determinism Replay (Full Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -e .
      
      - name: Run determinism replay (Full mode)
        env:
          MERID_DETERMINISM_MODE: full
          MERID_DETERMINISM_WINDOW_DAYS: 1
        run: |
          python -m merid.tools.determinism_replay \
            --mode full \
            --window-days 1 \
            --output determinism_replay_full_results.json
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: determinism-replay-full-results
          path: determinism_replay_full_results.json
          retention-days: 30
      
      - name: Emit Prometheus metrics
        if: always()
        run: |
          # TODO: Push results to Prometheus
          echo "Determinism replay metrics would be pushed to Prometheus here"
