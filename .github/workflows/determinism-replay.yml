name: Determinism Replay CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'merid/prediction/**'
      - 'merid/data/**'
      - 'merid/event_venues/**'
      - 'merid/utils/**'
      - 'merid/audit/**'
      - 'merid/tools/determinism_replay.py'
      - 'tests/data/test_ingress_replay.py'
      - 'tests/data/test_replay_state_diff.py'
      - 'tests/data/golden/**'
      - 'config/kalshi_*.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'merid/prediction/**'
      - 'merid/data/**'
      - 'merid/event_venues/**'
      - 'merid/utils/**'
      - 'merid/audit/**'
      - 'merid/tools/determinism_replay.py'
      - 'tests/data/test_ingress_replay.py'
      - 'tests/data/test_replay_state_diff.py'
      - 'tests/data/golden/**'
      - 'config/kalshi_*.yaml'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  determinism-replay-ci:
    name: Determinism Replay (CI Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Smoke test replay dispatcher on sample tape
        run: |
          python -m merid.tools.determinism_replay \
            --replay-tape tests/data/golden/replay_tape \
            --smoke

      - name: Run ingress replay unit tests
        run: |
          python -m pytest tests/data/test_ingress_replay.py -v

      - name: Run golden-file state diff regression test
        run: |
          python -m pytest tests/data/test_replay_state_diff.py -v

      - name: Upload state diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-state-diff
          path: data/replay_state_diff/state_diff_replay.jsonl
          retention-days: 30

  determinism-replay-full:
    name: Determinism Replay (Full Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Smoke test replay dispatcher on sample tape
        run: |
          python -m merid.tools.determinism_replay \
            --replay-tape tests/data/golden/replay_tape \
            --smoke

      - name: Run full replay regression suite
        run: |
          python -m pytest \
            tests/data/test_ingress_replay.py \
            tests/data/test_replay_state_diff.py \
            -v

      - name: Upload full state diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-state-diff-full
          path: data/replay_state_diff/state_diff_replay.jsonl
          retention-days: 30
