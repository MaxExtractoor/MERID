name: Kalshi Spec Validation

# 2026-10-18: dispatch-only. The validate job diffs the live venue spec against
# config/kalshi_expected_spec.yaml, which is not committed to the repo, and
# expects the MERID_KALSHI_API_KEY secret. It failed every nightly run. Run it
# manually after generating a spec snapshot:
#   python -m merid.tools.kalshi_spec_snapshot --mode snapshot \
#       --output config/kalshi_expected_spec.yaml
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/kalshi_expected_spec.yaml'
      - 'merid/tools/kalshi_spec_snapshot.py'
  pull_request:
    branches:
      - main
    paths:
      - 'config/kalshi_expected_spec.yaml'
      - 'merid/tools/kalshi_spec_snapshot.py'

jobs:
  kalshi-spec-validation:
    name: Validate Kalshi Spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyyaml
      
      - name: Validate Kalshi spec
        env:
          MERID_KALSHI_API_KEY: ${{ secrets.MERID_KALSHI_API_KEY }}
        run: |
          python -m merid.tools.kalshi_spec_snapshot \
            --mode validate \
            --fail-on-mismatch
      
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-spec-validation-results
          path: kalshi_spec_validation_results.json
          retention-days: 30

  kalshi-spec-snapshot:
    name: Snapshot Kalshi Spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyyaml
      
      - name: Snapshot Kalshi spec
        env:
          MERID_KALSHI_API_KEY: ${{ secrets.MERID_KALSHI_API_KEY }}
        run: |
          python -m merid.tools.kalshi_spec_snapshot \
            --mode snapshot \
            --output config/kalshi_expected_spec.yaml
      
      - name: Create PR for spec update
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Update Kalshi expected spec"
          body: "Automated update of Kalshi expected specification from live API."
          branch: update-kalshi-spec
          commit-message: "Update Kalshi expected spec from live API"
