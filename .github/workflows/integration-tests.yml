name: Integration Tests

on: workflow_dispatch  # Legacy — use ci.yml for active CI

env:
  REDIS_URL: redis://localhost:6379
  CELERY_BROKER_URL: redis://localhost:6379/0
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  MERID_SWARM_INTEGRITY_ENFORCE: "1"
  MERID_SWARM_HEALTH_SNAPSHOT: tests/fixtures/swarm/healthy_snapshot.json
  MERID_SWARM_SAFEGUARD_CONFIG: .merid_safeguard.yml

jobs:
  swarm-integrity-gate:
    name: Swarm Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run swarm integrity policy gate
        run: |
          python scripts/enforce_swarm_integrity.py \
            --config .merid_safeguard.yml \
            --snapshot tests/fixtures/swarm/healthy_snapshot.json \
            --strict

  contract-tests:
    name: Contract Tests (Pact)
    runs-on: ubuntu-latest
    needs: swarm-integrity-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run contract tests
        run: pytest tests/integration/test_contracts.py -v --pact-publish-results

      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: pacts/

  http-mock-tests:
    name: HTTP Mock Tests
    runs-on: ubuntu-latest
    needs: swarm-integrity-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run HTTP mock tests
        run: pytest tests/integration/test_http_mocks.py -v

  integration-component-tests:
    name: Integration Component Tests
    runs-on: ubuntu-latest
    needs: swarm-integrity-gate
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run integration component tests
        run: pytest tests/integration/test_integration_components.py -v
        env:
          REDIS_URL: redis://localhost:6379

  e2e-integration:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: swarm-integrity-gate
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Start Celery worker
        run: |
          celery -A core.celery_tasks worker --loglevel=info --detach

      - name: Run E2E integration tests
        run: pytest tests/integration/ -v -m "e2e"

  validate-pacts:
    name: Validate Pacts Against Providers
    runs-on: ubuntu-latest
    needs: contract-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download Pact contracts
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: pacts/

      - name: Validate against Pact Broker
        run: |
          pip install pact-python
          pact-verifier \
            --provider-base-url https://api.kalshi.com \
            --pact-files pacts/merid-kalshi.json \
            --publish-verification-results \
            --provider-app-version ${{ github.sha }}
