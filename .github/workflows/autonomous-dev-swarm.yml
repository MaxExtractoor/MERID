name: Autonomous Dev Swarm

on:
  workflow_dispatch:
# Disabled schedule trigger — coverage fix scripts not yet implemented
# Re-enable cron once autonomous_coverage_fix.py is wired up
    inputs:
      target_modules:
        description: 'Comma-separated list of modules to fix'
        required: false
        default: ''
      target_coverage:
        description: 'Target coverage percentage'
        required: false
        default: '85'

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  analyze-coverage:
    name: Analyze Coverage Gaps
    runs-on: ubuntu-latest
    outputs:
      low_coverage_modules: ${{ steps.analyze.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: pytest --cov=core --cov=trading --cov-report=xml --cov-report=term

      - name: Identify low coverage modules
        id: analyze
        run: |
          python scripts/analyze_coverage_gaps.py --threshold=${{ github.event.inputs.target_coverage || '85' }} --output=json > coverage_gaps.json
          echo "modules=$(cat coverage_gaps.json)" >> $GITHUB_OUTPUT

      - name: Upload coverage gaps
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gaps
          path: coverage_gaps.json

  autonomous-fix:
    name: Autonomous Coverage Fixes
    runs-on: ubuntu-latest
    needs: analyze-coverage
    if: needs.analyze-coverage.outputs.low_coverage_modules != '[]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Configure Git
        run: |
          git config --global user.name "MERID DevSwarm"
          git config --global user.email "devswarm@merid.ai"

      - name: Create fix branch
        run: |
          BRANCH_NAME="autonomous/coverage-fix-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run autonomous coverage fixer
        run: |
          python scripts/autonomous_coverage_fix.py \
            --modules='${{ needs.analyze-coverage.outputs.low_coverage_modules }}' \
            --target-coverage=${{ github.event.inputs.target_coverage || '85' }} \
            --output-report=fix_report.md

      - name: Run tests to verify fixes
        run: pytest --cov=core --cov=trading --cov-report=term

      - name: Commit changes
        run: |
          git add tests/
          git commit -m "🤖 Autonomous coverage fixes for Tier 2 modules

          - Added tests for uncovered lines
          - Target coverage: ${{ github.event.inputs.target_coverage || '85' }}%
          - Generated by DevSwarm" || echo "No changes to commit"

      - name: Push branch
        run: git push origin $BRANCH_NAME

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          title: '🤖 Autonomous Coverage Fixes'
          body: |
            ## Autonomous Coverage Fix Report

            This PR was automatically generated by the MERID DevSwarm to improve test coverage.

            ### Changes
            - Added tests for uncovered code paths
            - Fixed coverage gaps in Tier 2 modules

            ### Report
            See the full report in the PR artifacts.

            ### Verification
            - [ ] All tests pass
            - [ ] Coverage meets Tier 2 thresholds (85%)
            - [ ] No linting errors

            ---
            *Generated by DevSwarm on $(date)*
          labels: 'autonomous, coverage, dev-swarm'

      - name: Upload fix report
        uses: actions/upload-artifact@v4
        with:
          name: fix-report
          path: fix_report.md

  swarm-self-heal:
    name: Swarm Self-Healing CI
    runs-on: ubuntu-latest
    if: failure()
    needs: [analyze-coverage, autonomous-fix]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Analyze CI failure
        run: |
          python scripts/swarm_diagnose_failure.py \
            --run-id=${{ github.run_id }} \
            --output=diagnosis.json

      - name: Create issue for manual review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 DevSwarm requires manual intervention`,
              body: `The autonomous DevSwarm encountered issues that require manual review.\n\nSee run: ${context.runUrl}`,
              labels: ['autonomous', 'needs-review', 'dev-swarm']
            })
