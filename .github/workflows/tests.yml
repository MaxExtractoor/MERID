# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Tests (parallel + coverage)"

on:
  push:
  pull_request:

jobs:
  tests-parallel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests with safety-critical coverage gates
        run: |
          # Run all tests with coverage for safety-critical modules
          pytest tests \
            --cov=trading.guards.trading_guard \
            --cov=merid.execution.portfolio \
            --cov=merid.execution.executors.kalshi \
            --cov=merid.execution.executors.coinbase \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  safety-critical-coverage:
    runs-on: ubuntu-latest
    name: "Safety-Critical Module Coverage Gates"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: TradingGuard coverage (min 66% - target 85%)
        run: |
          pytest tests/trading tests/risk tests/safety -k "trading_guard or circuit_breaker" \
            --cov=trading.guards.trading_guard \
            --cov-report=term-missing

      - name: Portfolio coverage (min 74% - target 80%)
        run: |
          pytest tests/risk tests/executors -k "portfolio" \
            --cov=merid.execution.portfolio \
            --cov-report=term-missing

      - name: Kalshi executor coverage (min 75%)
        run: |
          pytest tests/executors/test_kalshi_executor.py -v \
            --cov=merid.execution.executors.kalshi \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Coinbase executor coverage (min 75%)
        run: |
          pytest tests/executors/test_coinbase_executor.py -v \
            --cov=merid.execution.executors.coinbase \
            --cov-report=term-missing \
            --cov-fail-under=75
