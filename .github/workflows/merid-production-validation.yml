# MERID Production CI/CD Workflow
# 
# This workflow validates the MERID trading system before deployment to staging
# and provides a pre-flight gate for production releases.
#
# Key validation steps:
# 1. Self-test (Redis, LoopLag, CFB RTI, Kill Switch wiring, Integrity Gate)
# 2. Status snapshot timing check (< 100ms target)
# 3. Build verification
#
# Usage:
#   - Runs automatically on PRs to main branch
#   - Required check before staging deployment
#   - Optional check for production pre-flight

name: MERID Production Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_timing_check:
        description: 'Run status snapshot timing check'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  KALSHI_ENV: ${{ github.event.inputs.environment == 'production' && 'live' || 'paper' }}

jobs:
  # ── Stage 1: Build & Unit Tests ─────────────────────────────────────────────
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short
      
      - name: Syntax check all modified files
        run: |
          python -c "
          import ast
          import sys
          from pathlib import Path
          
          files = [
              'merid/infra/loop_lag_monitor.py',
              'merid/infra/redis_resilient.py',
              'merid/infra/self_test.py',
              'merid/infra/status_snapshot.py',
              'merid/infra/background_scheduler.py',
              'core/execution_gate.py',
              'merid/risk/kill_switches.py',
          ]
          
          for f in files:
              path = Path(f)
              if path.exists():
                  with open(path) as fp:
                      ast.parse(fp.read())
                  print(f'✓ {f}')
              else:
                  print(f'⚠ {f} not found')
          
          print('\nAll files syntax OK')
          "

  # ── Stage 2: Production Self-Test ──────────────────────────────────────────
  self_test:
    name: Production Self-Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Run self-test in PAPER mode (safe for CI)
      - name: Run self-test (Paper Mode)
        id: self_test_paper
        run: |
          # Set paper mode for CI safety
          export KALSHI_ENV=paper
          
          echo "Running MERID Production Self-Test..."
          python -m merid.infra.self_test 2>&1 | tee self_test_output.log
          
          # Capture exit code
          exit_code=${PIPESTATUS[0]}
          
          # Parse JSON output for summary
          python -c "
          import json
          import sys
          
          try:
              # Read the JSON output (last line should be JSON)
              with open('self_test_output.log') as f:
                  lines = f.readlines()
                  for line in reversed(lines):
                      if line.strip().startswith('{'):
                          report = json.loads(line.strip())
                          break
              
              summary = report.get('summary', {})
              print(f'::notice::Self-Test: {summary.get(\"pass\", 0)}/{summary.get(\"total\", 0)} passed')
              
              if not report.get('passed'):
                  print('::error::Self-test FAILED')
                  for test in report.get('tests', []):
                      if test.get('result') == 'fail':
                          print(f'::error::{test[\"name\"]}: {test.get(\"error\", \"unknown error\")}')
                  sys.exit(1)
              
              print('✓ Self-test PASSED')
          except Exception as e:
              print(f'::warning::Could not parse self-test output: {e}')
              # If we can't parse, rely on exit code
              sys.exit(exit_code)
          "
        continue-on-error: false

  # ── Stage 3: Status Snapshot Timing Check ───────────────────────────────────
  timing_check:
    name: Status Snapshot Timing
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.run_timing_check != false }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run timing check
        id: timing_check
        run: |
          python -c "
          import asyncio
          import time
          import sys
          
          from merid.infra.status_snapshot import get_status_snapshot
          
          TARGET_MS = 100  # Target: status snapshot completes in < 100ms
          
          async def run_timing_check():
              times = []
              for i in range(10):
                  start = time.monotonic()
                  snapshot = await get_status_snapshot()
                  elapsed_ms = (time.monotonic() - start) * 1000
                  times.append(elapsed_ms)
              
              avg_ms = sum(times) / len(times)
              max_ms = max(times)
              min_ms = min(times)
              
              print(f'Status snapshot timing (10 samples):')
              print(f'  Min: {min_ms:.1f}ms')
              print(f'  Avg: {avg_ms:.1f}ms')
              print(f'  Max: {max_ms:.1f}ms')
              print(f'  Target: {TARGET_MS}ms')
              
              if avg_ms > TARGET_MS:
                  print(f'::error::Average snapshot time ({avg_ms:.1f}ms) exceeds target ({TARGET_MS}ms)')
                  # Warn but don't fail - this is informational for now
                  print('::warning::Timing check: SLOW but not failing')
              else:
                  print(f'::notice::Timing check PASSED (avg {avg_ms:.1f}ms < {TARGET_MS}ms)')
              
              # Always pass - this is for monitoring, not gating
              return True
          
          asyncio.run(run_timing_check())
          "

  # ── Stage 4: Integration Test (Optional) ────────────────────────────────────
  integration_test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, self_test]
    if: github.event_name == 'pull_request'
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          MERID_REDIS_ENABLED: "1"
        run: |
          pytest tests/integration -v --tb=short -k "redis or kill_switch or execution_gate"

  # ── Stage 5: Staging Deployment Gate ────────────────────────────────────────
  staging_gate:
    name: Staging Deployment Gate
    runs-on: ubuntu-latest
    needs: [build, self_test, timing_check]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    
    steps:
      - name: Validate all checks passed
        run: |
          echo "✓ Build: PASSED"
          echo "✓ Self-Test: PASSED"
          echo "✓ Timing Check: PASSED"
          echo ""
          echo "Staging deployment is CLEARED"
          echo "::notice::Staging deployment gate: CLEARED"
      
      - name: Output deployment metadata
        run: |
          echo "deployment_ready=true" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

  # ── Stage 6: Summary Artifact ──────────────────────────────────────────────
  summary:
    name: Create Summary Artifact
    runs-on: ubuntu-latest
    needs: [build, self_test, timing_check]
    if: always()  # Run even if previous jobs failed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifacts from previous jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true
      
      - name: Create job summary
        run: |
          python -c "
          import json
          import os
          import sys
          from datetime import datetime, timezone
          
          # Determine job outcomes
          build_ok = '${{ needs.build.result }}' in ['success', 'skipped']
          self_test_ok = '${{ needs.self_test.result }}' in ['success', 'skipped']
          timing_ok = '${{ needs.timing_check.result }}' in ['success', 'skipped']
          
          overall_passed = build_ok and self_test_ok and timing_ok
          
          summary = {
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'workflow': 'MERID Production Validation',
              'ref': '${{ github.ref }}',
              'sha': '${{ github.sha }}',
              'overall_passed': overall_passed,
              'jobs': {
                  'build': {'passed': build_ok, 'result': '${{ needs.build.result }}'},
                  'self_test': {'passed': self_test_ok, 'result': '${{ needs.self_test.result }}'},
                  'timing_check': {'passed': timing_ok, 'result': '${{ needs.timing_check.result }}'},
              },
              'infra_tests': {
                  'redis_resilience': self_test_ok,  # Part of self_test
                  'loop_lag_monitor': self_test_ok,
                  'cfb_rti': self_test_ok,
                  'kill_switch_wiring': self_test_ok,
                  'integrity_gate': self_test_ok,
                  'status_snapshot_timing': timing_ok,
              },
              'deployment_ready': overall_passed and '${{ github.ref }}' == 'refs/heads/main',
          }
          
          # Write JSON artifact
          with open('merid-validation-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          
          # Write Markdown summary
          with open('merid-validation-summary.md', 'w') as f:
              f.write('# MERID Production Validation Summary\n\n')
              f.write(f'**Timestamp:** {summary[\"timestamp\"]}\n\n')
              f.write(f'**Commit:** `{summary[\"sha\"][:8]}` on `{summary[\"ref\"]}`\n\n')
              f.write(f'## Overall: {\"✅ PASSED\" if overall_passed else \"❌ FAILED\"}\n\n')
              f.write('| Job | Status |\n')
              f.write('|-----|--------|\n')
              for name, job in summary['jobs'].items():
                  icon = '✅' if job['passed'] else '❌'
                  f.write(f'| {name} | {icon} {job[\"result\"]} |\n')
              f.write('\n## Infrastructure Tests\n\n')
              for test, passed in summary['infra_tests'].items():
                  icon = '✅' if passed else '❌'
                  f.write(f'- {icon} {test}\n')
              f.write(f'\n## Deployment\n\n')
              if summary['deployment_ready']:
                  f.write('✅ **Staging deployment is CLEARED**\n')
              else:
                  f.write('❌ **Deployment blocked** - fix failing checks\n')
          
          print('Summary artifacts created:')
          print('  - merid-validation-summary.json')
          print('  - merid-validation-summary.md')
          
          # Set job output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'overall_passed={str(overall_passed).lower()}\n')
              f.write(f'deployment_ready={str(summary[\"deployment_ready\"]).lower()}\n')
          
          sys.exit(0 if overall_passed else 1)
          "
      
      - name: Upload summary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: |
            merid-validation-summary.json
            merid-validation-summary.md
          retention-days: 30
      
      - name: Add to GitHub step summary
        run: |
          cat merid-validation-summary.md >> $GITHUB_STEP_SUMMARY
# 
# Required secrets (if deploying):
#   - KALSHI_API_KEY (for staging CFB tests)
#   - REDIS_URL (for Redis validation)
#   - TELEGRAM_BOT_TOKEN (for alerts)
#
# Required environment variables:
#   - KALSHI_ENV: Set by workflow (paper for CI, live for prod)
#   - MERID_REDIS_ENABLED: "1" to test Redis features
#
# Self-test failure behavior:
#   - In CI (paper mode): Non-zero exit, loud stderr, but manual override possible
#   - In live mode pre-flight: Non-zero exit BLOCKS deployment
#
# Status snapshot timing:
#   - Target: < 100ms average
#   - Warning: > 100ms average (logged, not blocking)
#   - Critical: > 500ms (investigate event loop blocking)
