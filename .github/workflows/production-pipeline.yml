name: MERID Production Pipeline - Runtime Primitive
on:
  push:
    branches: [ main, develop, 'feature/*', 'release/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: merid

jobs:
  # Stage 1: Build & Unit Tests
  build-and-unit-tests:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist prometheus-client
      
      - name: Lint and type-check
        run: |
          python -m flake8 core/ tests/ --max-line-length=120 --ignore=E501,W503 --extend-exclude=venv/
          python -m mypy core/ --ignore-missing-imports --strict-optional
      
      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=core \
            --cov=web/api \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=90 \
            --junit-xml=test-results.xml
      
      - name: Run runtime primitive unit tests
        run: |
          python -m pytest tests/test_domain_priority_system.py -v --tb=short
          python -m pytest tests/test_conflict_resolution.py -v --tb=short
          python -m pytest tests/test_degraded_signal_handling.py -v --tb=short
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=digest
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Stage 2: Security & Compliance
  security-compliance:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on-error
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: python
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
      
      - name: Run secrets detection
        uses: trufflesecurity/trufflehog-action@master
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # Stage 3: Runtime Primitive Validation
  runtime-primitive-validation:
    runs-on: ubuntu-latest
    needs: [build-and-unit-tests, security-compliance]
    services:
      # Mock trading API service
      mock-trading-api:
        image: python:3.11-slim
        options: >-
          --health-cmd "python -c 'import requests; requests.get(\"http://localhost:8080/health\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8080:8080
      # MERID application
      merid-app:
        image: ${{ needs.build-and-unit-tests.outputs.image-tag }}
        options: >-
          --health-cmd "curl -f http://localhost:8001/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8001:8001
        env:
          MERID_ENVIRONMENT: test
          MERID_LOG_LEVEL: INFO
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install test dependencies
        run: |
          pip install pytest requests prometheus-client
      
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8001/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
      
      - name: Run SIGHTED_DEGRADED activation test
        run: |
          python test_production_sighted_degraded_activation.py
      
      - name: Run domain priority integration tests
        run: |
          python -m pytest tests/test_domain_priority_system.py::TestModeAwareBehavior -v --tb=short
      
      - name: Run conflict resolution tests
        run: |
          python -m pytest tests/test_conflict_resolution.py::TestConflictResolutionPrecedence -v --tb=short
      
      - name: Run fault injection tests
        run: |
          python -m pytest tests/test_fault_injection.py::TestFeedLossDegradation -v --tb=short
          python -m pytest tests/test_fault_injection.py::TestAssertionEngineFailure -v --tb=short
      
      - name: Run degraded signal handling tests
        run: |
          python -m pytest tests/test_degraded_signal_handling.py::TestPartialAssertionLoss -v --tb=short
          python -m pytest tests/test_degraded_signal_handling.py::TestHighViolationRate -v --tb=short
      
      - name: Verify safety checks and rollback
        run: |
          python scripts/verify_safety_checks.py
      
      - name: Collect runtime metrics
        run: |
          python scripts/collect_runtime_metrics.py > runtime-metrics.json
      
      - name: Upload runtime metrics
        uses: actions/upload-artifact@v3
        with:
          name: runtime-metrics
          path: runtime-metrics.json

  # Stage 4: Staging Deploy
  staging-deploy:
    runs-on: ubuntu-latest
    needs: runtime-primitive-validation
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
      
      - name: Deploy to staging
        run: |
          helm upgrade --install merid-staging ./helm/merid \
            --namespace staging \
            --set image.tag=${{ needs.build-and-unit-tests.outputs.image-tag }} \
            --set environment=staging \
            --set featureFlags.runtimePrimitiveEnabled=true \
            --set featureFlags.prioritySystemEnabled=true \
            --wait --timeout=10m
      
      - name: Run health checks against staging
        run: |
          kubectl wait --for=condition=ready pod -l app=merid -n staging --timeout=300s
          kubectl exec -n staging deployment/merid -- curl -f http://localhost:8001/health
      
      - name: Run end-to-end tests with mocked venues
        run: |
          python -m pytest tests/test_e2e_scenarios.py -v --tb=short --env=staging
      
      - name: Run DAST against staging APIs
        run: |
          docker run --rm -t \
            -e TARGET_URL=https://staging-api.merid.com \
            -e API_KEY=${{ secrets.STAGING_API_KEY }} \
            owasp/zap2docker-stable \
            zap-baseline.py -t https://staging-api.merid.com
      
      - name: Validate feature flags
        run: |
          python scripts/validate_feature_flags.py --environment=staging

  # Stage 5: Blue-Green / Canary to Prod
  prod-deploy:
    runs-on: ubuntu-latest
    needs: staging-deploy
    environment: production
    strategy:
      matrix:
        deploy_strategy: [canary, blue-green]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl for production
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}
      
      - name: Deploy to production (Green/Canary)
        if: matrix.deploy_strategy == 'canary'
        run: |
          helm upgrade --install merid-canary ./helm/merid \
            --namespace production \
            --set image.tag=${{ needs.build-and-unit-tests.outputs.image-tag }} \
            --set environment=production \
            --set deployment.strategy=canary \
            --set deployment.canary.weight=5 \
            --set featureFlags.runtimePrimitiveEnabled=true \
            --set featureFlags.prioritySystemEnabled=true \
            --wait --timeout=10m
      
      - name: Deploy to production (Blue-Green)
        if: matrix.deploy_strategy == 'blue-green'
        run: |
          helm upgrade --install merid-green ./helm/merid \
            --namespace production \
            --set image.tag=${{ needs.build-and-unit-tests.outputs.image-tag }} \
            --set environment=production \
            --set deployment.strategy=blue-green \
            --set featureFlags.runtimePrimitiveEnabled=true \
            --set featureFlags.prioritySystemEnabled=true \
            --wait --timeout=10m
      
      - name: Monitor canary for 30 minutes
        if: matrix.deploy_strategy == 'canary'
        run: |
          python scripts/monitor_canary.py \
            --duration=1800 \
            --threshold-error-rate=0.01 \
            --threshold-latency-p95=500 \
            --threshold-violations=10
      
      - name: Validate production metrics
        run: |
          python scripts/validate_production_metrics.py
      
      - name: Run smoke tests against production
        run: |
          python -m pytest tests/test_smoke_scenarios.py -v --tb=short --env=production
      
      - name: Promote canary to full production
        if: matrix.deploy_strategy == 'canary'
        run: |
          helm upgrade merid-canary ./helm/merid \
            --namespace production \
            --set deployment.canary.weight=100 \
            --wait --timeout=10m
      
      - name: Switch blue-green traffic
        if: matrix.deploy_strategy == 'blue-green'
        run: |
          kubectl patch service merid-prod -n production \
            -p '{"spec":{"selector":{"version":"green"}}}'
      
      - name: Final production validation
        run: |
          python scripts/final_production_validation.py

  # Stage 6: Audit & Reporting
  audit-reporting:
    runs-on: ubuntu-latest
    needs: [prod-deploy]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate deployment report
        run: |
          python scripts/generate_deployment_report.py \
            --version=${{ needs.build-and-unit-tests.outputs.image-tag }} \
            --pipeline-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
      - name: Store audit events in WORM logs
        run: |
          python scripts/store_audit_events.py \
            --deployment-report=deployment-report.json \
            --worm-storage=${{ secrets.WORM_STORAGE_ENDPOINT }}
      
      - name: Send compliance notification
        if: needs.prod-deploy.result == 'success'
        run: |
          python scripts/send_compliance_notification.py \
            --status=success \
            --version=${{ needs.build-and-unit-tests.outputs.image-tag }}
      
      - name: Send compliance notification
        if: needs.prod-deploy.result == 'failure'
        run: |
          python scripts/send_compliance_notification.py \
            --status=failed \
            --version=${{ needs.build-and-unit-tests.outputs.image-tag }}
      
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-report-${{ github.run_number }}
          path: |
            deployment-report.json
            audit-events.json
            runtime-metrics.json
