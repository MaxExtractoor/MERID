apiVersion: apps/v1
kind: Deployment
metadata:
  name: merid-api
  namespace: merid
  labels:
    app: merid
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merid
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: merid
        component: api
    spec:
      serviceAccountName: merid-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: merid-api
          image: merid:latest
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: merid-secrets
            - configMapRef:
                name: merid-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: merid-data
---
apiVersion: v1
kind: Service
metadata:
  name: merid-api
  namespace: merid
  labels:
    app: merid
    component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: merid
    component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: merid-api
  namespace: merid
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: merid-data
  namespace: merid
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: merid-config
  namespace: merid
data:
  MERID_ENV: "production"
  MERID_LOG_LEVEL: "INFO"
  SIMULATION_MODE: ""
  TLS_ENABLED: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: merid
  labels:
    app: merid
