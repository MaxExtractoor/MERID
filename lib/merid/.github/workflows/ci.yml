name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

      - name: Verify generated schemas are up to date
        run: |
          python -c "from web.schema_export import export_schemas; export_schemas('generated/schemas_ci')"
          git --no-pager diff --exit-code generated/schemas generated/schemas_ci || (echo "Schemas out of date. Regenerate with: python -c \"from web.schema_export import export_schemas; export_schemas('generated/schemas')\"" && exit 1)

  vuln-scan:
    runs-on: ubuntu-latest
    needs: [python-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install scanning tools
        run: python -m pip install --upgrade pip && pip install pip-audit bandit
      - name: Run pip-audit
        run: pip-audit --progress=failure
      - name: Run bandit (fail on high)
        run: bandit -r . -lll -f text -n 5

  secrets-scan:
    runs-on: ubuntu-latest
    needs: [python-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install detect-secrets
        run: python -m pip install --upgrade pip && pip install detect-secrets
      - name: Run detect-secrets
        run: |
          detect-secrets scan --all-files || (echo "DetectSecrets found potential secrets; run 'detect-secrets scan --all-files > .secrets.baseline' and review" && exit 1)

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: 'fs'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  python-test-testnet:
    runs-on: ubuntu-latest
    needs: [python-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Test (pytest with MERID_USE_TESTNET)
        env:
          MERID_USE_TESTNET: 'true'
        run: pytest -q

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - name: Flutter test
        run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [python-lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run E2E smoke
        run: python scripts/run_e2e.py --steps 5 --threshold 1.0 --actor ci-smoke --min-orders 1 --require-audit

