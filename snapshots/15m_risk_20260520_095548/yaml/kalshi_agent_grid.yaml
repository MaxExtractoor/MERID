strike_selection_defaults:
  # Global defaults for spot-to-strike distance thresholds.
  # These are used when an agent doesn't have per-asset/timeframe overrides.
  # Per-agent YAML blocks override these; these override hardcoded Python defaults.
  # v2 (2026-04-17): Calibrated to match actual Kalshi market availability
  max_spot_to_strike_pct: 0.20     # max |spot-strike|/strike (fraction) - 20% default
  target_spot_band_pct: 0.08       # preferred ATM band (fraction) - 8% default
  deep_otm_allowed: false
  deep_otm_max_risk_pct: 0.005    # max risk per trade when deep OTM (0.5%)
  rejection_log_throttle_seconds: 30  # throttle STRIKE_REJECT logs

portfolio_risk:
  # BANKROLL SCALING: All USD limits derived from merid.settings bankroll percentages.
  # Set 0 (or omit) to auto-derive from KALSHI_PORTFOLIO_BANKROLL_CENTS × PCT env vars.
  # Override env vars: KALSHI_PORTFOLIO_BANKROLL_CENTS, KALSHI_PORTFOLIO_MAX_NOTIONAL_PCT, etc.
  max_total_notional_usd: 0         # 0 = derive from settings (bankroll × 50%)
  max_notional_per_asset_usd: 0     # 0 = derive from settings (bankroll × 16%)
  max_open_markets: 50
  max_daily_loss_usd: 0             # 0 = derive from settings (bankroll × 10%)
  max_margin_utilization_pct: 0     # 0 = derive from settings (default 75%)
  rebalance_check_interval_seconds: 30
  max_margin_utilization_pct: 0     # 0 = derive from settings (default 75%)
  rebalance_check_interval_seconds: 30
