venue:
  name: kalshi
  base_url: https://api.elections.kalshi.com/trade-api/v2
  use_demo: false
  # DEPRECATED for kalshi_crypto_15m_v2 profile: Use config/profiles/kalshi_crypto_15m.yaml instead
  # This venue-level setting is still used by other profiles (sports, paper, generic prediction)
  max_notional_per_expiry_usd: 0  # 0 = derive from actual Kalshi bankroll (was $1000)
  max_open_markets_per_asset: 20
session:
  maintenance_day: 3
  maintenance_start_et: 03:00
  maintenance_end_et: 05:00
agents:
- name: BTC_15M
  # PROFILE-GATED: When MERID_PROFILE=kalshi_crypto_15m_v2, risk_limits, edge thresholds, and time windows come from profile
  # Removed duplicate strategy.edge and entry_window definitions to avoid contradictions with profile config
  series_tickers:
  - KXBTC15M
  assets:
  - BTC
  timeframes:
  - 15m
  archetype: directional
  market_filter:
    category: crypto
    frequency: fifteen_min
  take_profit:
    enabled: true
    # OPTIMIZED (2026-05-10): Time-based dynamic TP for 15m contracts
    time_based_r_multiple:
      over_7_min: 0.4
      between_4_7_min: 0.25
      under_4_min: 0.15
    min_cents: 3
    scale_out_fraction: 0.5
    trailing_enabled: true
    trailing_activation_r_multiple: 0.3
    trailing_giveback_cents: 5
    max_round_trips_per_contract: 2
    min_price_move_for_reentry: 5
    min_edge_after_fees_cents: 2.0
  strike_selection:
    max_spot_to_strike_pct: 0.15   # 15% max distance for 15m BTC (calibrated v2)
    target_spot_band_pct: 0.06     # prefer contracts within 6% of spot
    deep_otm_allowed: false
