# Alertmanager configuration for Kelly alerts
# Mount into Alertmanager container (e.g., /etc/alertmanager/alertmanager.yml)

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, strategy]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      continue: false

receivers:
  - name: default
    email_configs:
      - to: alerts@example.com
        from: prometheus@example.com
        smarthost: smtp.example.com:587
        auth_username: prometheus@example.com
        auth_password: ${SMTP_PASSWORD}
        send_resolved: true

  - name: critical
    slack_configs:
      - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
        channel: "#kelly-alerts"
        title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.strategy }})"
        text: |
          *{{ .CommonAnnotations.summary }}*
          {{ range .Alerts }}
          - {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, strategy]
