[mypy]
# Global settings
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
strict = True
ignore_missing_imports = True

# Per-module options
[mypy.core.*]
ignore_errors = False

[mypy.trading.*]
ignore_errors = False

[mypy.merid.*]
ignore_errors = False

[mypy.utils.*]
ignore_errors = False

[mypy.tests.*]
ignore_errors = True  # Don't enforce types in tests
